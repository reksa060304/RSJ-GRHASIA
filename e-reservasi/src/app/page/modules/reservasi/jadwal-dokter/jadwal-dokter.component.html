<div class="card card-w-title" style="margin-top:10px" >
    <div class="card card-form-header">
      <h1>Informasi Jadwal</h1>
    </div>
    <div class="ui-g ui-fluid">
      <div class="ui-g-12 ui-md-12 ui-lg-12">
        <p-dataTable  [value]="dataSourceJadwal" [rows]="50" [paginator]="true" [pageLinks]="5"
          [rowsPerPageOptions]="[50,100,150]" selectionMode="single" [(selection)]="selected"
          loadingIcon="fa fa-spinner" scrollable="true" expandableRows="true" (click)="klikdata(selected)">
          <p-column field="namaruangan" header="POLIKLINIK" [sortable]="true"
            [style]="{'width':'150px', 'white-space': 'pre', 'font-weihgt': 'bold'}">
          </p-column>
          <!-- <p-column field="namalengkap" header="NAMA PPA" [sortable]="true"
           [style]="{'width':'50px','text-align':'center'}">
          </p-column> -->
          <p-column field="jammulai" header="JAM MULAI" [sortable]="true"
            [style]="{'width':'50px','text-align':'center'}">
          </p-column> 
          <p-column field="jamakhir" header="JAM SELESAI" [sortable]="true"
            [style]="{'width':'50px','text-align':'center'}">
          </p-column>        
          <p-column field="hari" header="HARI PRAKTEK" [sortable]="true"
            [style]="{'width':'50px','text-align':'center'}">
          </p-column> 
        </p-dataTable>
      </div>
    </div>
  </div>
