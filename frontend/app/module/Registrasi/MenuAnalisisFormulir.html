</div>

<div kendo-window="popupuyy" k-title="'Data'" k-width="1000" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="grid_12">
            <div class="grid_12 margin-top-20 margin-bottom" ng-show="keterangan">
                <label c-label item="item" class="margin-bottom">Keterangan</label>
                <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.keterangan"
                    k-data-source="" style="height: 100px; width: 50%; " />
                    </div>
        </div>
        <div class="grid_12" style="margin-top:10px" ng-show="verifikator">
            <div class="grid_12">
                <label c-label item="item" class="margin-bottom">Verifikator</label>
            </div>
            <div class="grid_12">
                <input style="width: 250px;" kendo-combo-box k-ng-model="item.verifikator" k-data-text-field="'text'"
                    k-data-value-field="'value'" k-filter="'contains'" k-auto-bind="false"
                    k-data-source="listPegawai" />
            </div>
        </div>
        
        
        <div class="grid_12">
            <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                <button class="k-button  k-button-icontext" ng-click="simpanaja()"><span
                        class="k-icon k-file-success"></span>Simpan</button>
            </div>
        </div>
        
    </div>
</div>

<div kendo-window="popupriwayat" k-title="'Riwayat'" k-width="1250" k-height="500" k-visible="false"
    k-on-open="win2visible = true"
    k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="grid_12">
            <div class="grid_12">
                <div class="grid_6">
                    <label c-label item="item" required>NAMA EMR
                    </label>
                    <input c-text-box type="input" filter="'string'" class="k-textbox"
                        ng-model="item.namaemr" disabled />
                </div>
            </div>
            <div class="grid_12 borderBox">
                <div id="kGrid" kendo-grid k-data-source="dataGrid" k-selectable="'row'" k-options="mainGridOptions"
                    k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelected">
                    <div k-detail-template>
                        <kendo-tabstrip>
                            <div>
                                <div id="kGridDetail" kendo-grid k-options="data2(dataItem)" k-sortable="'true'"
                                    k-selectable="'row'" k-ng-model="dataSelected2"
                                    ng-click="klikDetail(dataSelected2)">
                                </div>
                            </div>
                        </kendo-tabstrip>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
