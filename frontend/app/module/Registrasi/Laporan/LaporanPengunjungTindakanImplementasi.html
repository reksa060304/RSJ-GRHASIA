    <h1 style="color: white;">
        <b>Laporan Implementasi</b>
    </h1>
</div>
<div class="grid_12">
    <div class="grid_12">
        <fieldset style="min-height:50px !important" align="left">
            <legend>
                <h2>Pencarian</h2>
            </legend>

            <div class="grid_12">
                <div class="grid_12" ng-repeat="list in listTglPeriode">
                    <div ng-repeat="opsi in list.detail | orderBy:'id'" class="grid_1">
                        <input type="radio" name="{{opsi.nama}}" id="{{opsi.nama}}" class="k-radio"
                            ng-model="item.periodeBerdasarkan" value="{{opsi.id}}">
                        <label class="k-radio-label" for="{{opsi.nama}}">{{opsi.nama}}</label>
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Periode"></label>
                    </div>
                    <div class="grid_12">
                        <!-- AwalPeriode -->
                        <div class="grid_6 padDatePicker">
                            <input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker k-max="now"
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>

                        <!-- AkhirPeriode -->
                        <div class="grid_6 padDatePicker">
                            <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                        <div class="clear"></div>
                    </div>
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="Departement"></label>
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.departement"
                        k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listDepartemen" k-on-change="getIsiComboRuangan()"
                        ng-keypress="($event.which == 13)? SearchData():item.departement" />
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="Ruangan"></label>
                    <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                        k-data-text-field="'ruangan'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listRuangan"
                        ng-keypress="($event.which == 13)? SearchData():item.ruangan" />
                </div>
                <div class="grid_2">
                    <label c-label item="item">Nama Pegawai</label>
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaPegawai"
                        k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listPegawai"
                        ng-keypress="($event.which == 13)? SearchData():item.namaPegawai" />
                </div>
                <!-- <div class="grid_2">
                    <label c-label item="item" c-label-text="Kelompok Pasien"></label>
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.KelompokPasien"
                        k-data-text-field="'kelompokpasien'" k-data-value-field="'id'" class="'max-height'"
                        k-filter="'contains'" k-auto-bind="false" k-data-source="listKelompokPasien"
                        ng-keypress="($event.which == 13)? SearchData():item.KelompokPasien" />
                </div> -->
                <div class="grid_2" style="margin-top:5px">
                    <label c-label>Nama Implementasi</label>
                    <select kendo-multi-select k-options="selectOptionsRuangan"
                        k-filter="'contains'" k-data-source="listTindakan" k-ng-model="item.TindakanMulti"></select>
                    <!--<input style="width: 100%;" kendo-combo-box k-ng-model="item.Ruangan" k-data-text-field="'namaRuangan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="ruangans"/>-->
                </div>
                <div class="grid_1" style="margin-top: 14px">
                    <div class="grid_12">
                        <button class="btnTemplate1" style="margin-left: 0;" ng-click="CariData()">Cari</button>
                    </div>
                </div>
            </div>
            <div class="grid_12">

                    <div class="grid_12">

                    <div class="grid_12">

                    <div class="grid_12">

                            ng-keypress="($event.which == 13)? SearchData():item.namaproduk" />
                    </div>
                </div> -->

                
            </div>
        </fieldset>
    </div>
    <div class="grid_12" style="margin-top: 10px;">
        <kendo-grid k-data-source="dataTindakan" k-selectable="'row'" k-options="columnTindakan"
            k-ng-model="dataPasienSelected" ng-click="click(dataPasienSelected)">
        </kendo-grid>
    </div>
</div>
