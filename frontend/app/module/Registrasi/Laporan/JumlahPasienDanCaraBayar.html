<div ng-show="dataVOloaded">
    <div class="grid_12 headerBox">
        <h1 style="color: white;"><b>JUMLAH PASIEN RJ & RI BESERTA CARA BAYAR</b></h1>
    </div>

    <div class="grid_12">
        <div class="grid_1">
            <label c-label item="item" c-label-text="Tahun"></label>
            <input style="width: 100%" k-options="yearUngkul" k-ng-model="item.tahun" kendo-date-picker
                placeholer="YYYY" k-format="'yyyy'" />
        </div>
        <div class="grid_6">
           
            <div class="grid_5">
                <label c-label item="item" c-label-text="Tanggal Pulang Awal" for="periode"></label>
                <input id="tglpulgawal" style="width: 100%" k-ng-model="item.tglawal"
                    kendo-datetimepicker placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" />
            </div>
            <div class="grid_5">
                <label c-label item="item" c-label-text="Tanggal Pulang Akhir"></label>
                <input id="tglpulgakhir" style="width: 100%" k-ng-model="item.tglakhir"
                    kendo-datetimepicker placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" />
            </div>
        </div>

        <div class="grid_2">
            <label c-label item="item" c-label-text="Departement"></label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="item.departemen" k-data-text-field="'departemen'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDepartement"
                k-on-change="getIsiComboRuangan()" />
        </div>
        <div class="grid_2">
            <label c-label item="item" c-label-text="Ruangan"></label>
            <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                k-data-text-field="'ruangan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="listRuangan" />
        </div>

            <label c-label c-label-text=""></label>
            <em style="margin-top:6px;" ng-click='SearchData()' id="iconButton" data-role="button"

    <div class="grid_12">
        <md-content>
            <md-tabs md-dynamic-height md-border-bottom md-selected="myVar">
                <md-tab label="RJ & RI">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top: 10px;">
                            <div class="grid_12 borderBox">
                                <kendo-grid id="kGrid" data-source="dataSourceGridP" options="columnGridP"
                                    k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                                    k-ng-model="dataPasienSelected" ng-click="klikGrid(dataPasienSelected)">
                                </kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>
                <md-tab label="IGD">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top: 10px;">
                            <div class="grid_12 borderBox">
                                <kendo-grid id="kGrid" data-source="dataSourceGridQ" options="columnGridQ"
                                    k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                                    k-ng-model="dataPasienSelected" ng-click="klikGrid(dataPasienSelected)">
                                </kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>
                <md-tab label="jumlah pasien V2">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top: 10px;">
                            <div class="grid_12 borderBox">
                                <kendo-grid id="kGrid" data-source="dataSourceGridjp" options="columnGridjp"
                                    k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                                    k-ng-model="dataPasienSelected" ng-click="klikGrid(dataPasienSelected)">
                                </kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>

            </md-tabs>
        </md-content>
