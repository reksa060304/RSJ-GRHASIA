    <style>
        .k-grid .k-grid-header .k-header .k-link {
            height: auto;
        }
    
        .k-grid .k-grid-header .k-header {
            white-space: normal;
        }
    
        .k-grid .k-grid-header .k-header {
            text-align: center;
        }
    </style>
    <div ng-show="dataVOloaded">
        <!-- <c-panel item="item" header="'Daftar Tagihan Rekanan'" disabled> -->
        <div class="grid_12 headerBox">
            <h2 style="color: white;">
                <p>GRAFIK BARBER JOHNSON</p>
            </h2>
        </div>
        <div class="grid_12">
            <div class="grid_3">
                <label c-label item="item" c-label-text="Tanggal awal"></label>
                <input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker placeholer="yyyy-mm-dd"
                    k-format="'yyyy-MM-dd'" />
            </div>
            <div class="grid_3">
                <label c-label item="item" c-label-text="Tanggal Akhir"></label>
                <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker placeholer="yyyy-mm-dd"
                    k-format="'yyyy-MM-dd'" />
            </div>
            <div class="grid_1">
                <div class="grid_12">
                    <label>&nbsp;</label>
                </div>
                <div class="grid_12">
                    <button class="primary c-button" style="margin-top: 6px" ng-click="CariData()">Cari</button>
                </div>
            </div>
            <div class="grid_1">
                <div class="grid_12">
                    <label>&nbsp;</label>
                </div>
                <div class="clear"></div>
                <div class="grid_12">
                    <button class="cancel c-button" style="margin-top: 6px" ng-click="ClearSearch()">Clear</button>
                </div>
            </div>
        </div>
        <div style="height:100px;" class="grid_12"></div>

        <canvas id="myChart" style="width:100%;"></canvas>

        <div class="grid_12">
            <div class="grid_12" style="float:right">
                <div class="grid_10"></div>
            </div>
        </div>
        <br />
    </div>
    <br />
    </div>
    <div class="grid_12" style="margin-top:60px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>
