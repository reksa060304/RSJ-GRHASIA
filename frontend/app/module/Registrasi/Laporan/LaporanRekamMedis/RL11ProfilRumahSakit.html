<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }
</style>
<div ng-show="dataVOloaded">
    <div class="grid_12 headerBox">
        <h2 style="color: white;">
            <p>Formulir RL 1.1</p>
            <p>Profil Rumah Sakit</p>
        </h2>
    </div>

    <div class="grid_12">
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>

            <div class="grid_12">
                <button class="primary c-button" style="margin-top: 6px" ng-click="CariData()">Refresh</button>
            </div>
        </div>

        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="success c-button" style="margin-top: 6px" ng-click="ubahData()">Ubah Data</button>
            </div>
        </div>
    </div>
    <div class="grid_12" style="margin-top:10px">
        <div class="grid_12 headerBox">
            <p>Profil</p>
        </div>
        <div class="clear"></div>
        <div class="grid_12 borderBox">
            <div id="kGrid" kendo-grid k-groupable="'true'" k-aggregate='aggregate' k-data-source="sourceLaporan"
                k-selectable="'row'" k-columns="columnLaporan" k-pageable="'true'" k-sortable="'true'"
                k-ng-model="dataPasienSelected" ng-click="click(dataPasienSelected)">
            </div>
        </div>
    </div>
    <div class="grid_12">
        <div class="grid_12" style="float:right">
            <div class="grid_10"></div>
        </div>
    </div>
    <br />
</div>
<br />
</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
