<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }
</style>

<div class="grid_12 headerBox">
    <h2 style="color: white;">
        <p>Formulir RL 3.18</p>
        <p>PENULISAN DAN PELAYANAN RESEP</p>
    </h2>
</div>

<div class="grid_12">
    <div class="grid_12" style="margin-top:10px">
        <div class="grid_3">
            <label c-label item="item" c-label-text="Tanggal awal"></label>
            <input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker
                placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
        </div>

        <div class="grid_3">
            <label c-label item="item" c-label-text="Tanggal Akhir"></label>
            <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker
                placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
        </div>

        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-show="! isLoading"
                    ng-click="CariData()">Cari</button>
            </div>
        </div>
        
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-show="! isLoading"
                    ng-click="ClearSearch()">Clear</button>
            </div>
        </div>
    </div>

    <div class="grid_12" style="margin-top:10px">
        <div class="grid_12 borderBox">
            <div id="kGrid" kendo-grid k-data-source="dataRL318" k-selectable="'row'"
                k-columns="columnRL318" k-sortable="'true'" k-ng-model="dataSelected"
                ng-click="click(dataSelected)">
            </div>
        </div>
    </div>

    <div class="grid_12" style="margin-top:60px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>
</div>
