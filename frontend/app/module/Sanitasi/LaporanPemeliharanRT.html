<div class="grid_12 headerBox">
    <h1 style="color: white;">
        <b>Laporan Pemeliharaan RS</b>
    </h1>
</div>
<div class="grid_12">
    <div class="grid_12">
        <fieldset style="min-height:50px !important" align="left">
            <legend>
                <h2>Pencarian</h2>
            </legend>
            <div class="grid_12">
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Periode"></label>
                    </div>
                    <div class="grid_12">
                        <!-- AwalPeriode -->
                        <div class="grid_6 padDatePicker">
                            <input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker
                                placeholer="yyyy-MM-dd 00:00" k-format="'yyyy-MM-dd 00:00'" />
                        </div>

                        <!-- AkhirPeriode -->
                        <div class="grid_6 padDatePicker">
                            <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker
                                placeholer="yyyy-MM-dd 23:59" k-format="'yyyy-MM-dd 23:59'" />
                        </div>
                    </div>
                </div>
                <div class="grid_1" style="margin-top: 14px">
                    <div class="grid_12">
                        <button class="btnTemplate1" style="margin-left: 0;" ng-click="CariData()">Cari</button>
                    </div>
                </div>
            </div>
            
        </fieldset>
    </div>
    <div class="grid_12" style="margin-top: 10px;">
        <kendo-grid k-data-source="dataTindakan" k-selectable="'row'" k-options="columnTindakan"
            k-ng-model="dataPasienSelected" ng-click="click(dataPasienSelected)">
        </kendo-grid>
    </div>
</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
