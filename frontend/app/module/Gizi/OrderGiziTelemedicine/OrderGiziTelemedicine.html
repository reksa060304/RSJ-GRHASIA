<style>
	.style-center { display: inline-block; text-align: center; width: 100%; }
	.style-left { display: inline-block; text-align: left; width: 100%; }
	.k-grid .k-grid-header .k-header .k-link { height: auto; }
	.k-grid .k-grid-header .k-header { white-space: normal; text-align: center; }
	.custom-button {
		margin: 0 0 5px;
		background: none;
		color: black;
		border-radius: 0.8em;
		border: 1px solid;
		background-color: white;
	}
	.k-multiselect-wrap {
		position: relative;
		border-radius: 4px;
		background-color: #FFF;
		min-height: 2.04em;
		border-width: 1px;
		border-style: solid;
		border-color: #228be6;
	}
</style>

<div ng-show="dataVOloaded">
	<div class="grid_12 headerBox">
		<h1 style="color: white;"><b>Order Diet Gizi</b></h1>
	</div>
	<div class="clear"></div>
	<br />

	<!-- Filter Atas -->
	<div class="grid_12">
		<div class="grid_12 borderBox containerBorderBox">
			<div class="grid_2">
				<div class="grid_12"><label c-label item="item" c-label-text="Produk"></label></div>
				<div class="clear"></div>
				<div class="grid_12">
					<input style="width: 100%;" kendo-combo-box k-ng-model="item.produk"
						k-data-text-field="'namaproduk'" k-data-value-field="'id'" k-filter="'contains'"
						k-auto-bind="false" k-data-source="listProduk" />
				</div>
			</div>
			<div class="grid_2">
				<div class="grid_12"><label c-label item="item" c-label-text="Menu Makanan"></label></div>
				<div class="clear"></div>
				<div class="grid_12">
					<input style="width: 100%;" kendo-combo-box k-ng-model="item.menuMakanan"
						k-data-text-field="'menumakanan'" k-data-value-field="'id'" k-filter="'contains'"
						k-auto-bind="false" k-data-source="listMenu" />
				</div>
			</div>
			<div class="grid_4">
				<div class="grid_12"><label c-label item="item" c-label-text="Periode"></label></div>
				<div class="clear"></div>
				<div class="grid_12">
					<div class="grid_6 padDatePicker">
						<input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker
							k-format="'yyyy-MM-dd'" />
					</div>
					<div class="grid_6 padDatePicker">
						<input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
							k-format="'yyyy-MM-dd'" />
					</div>
					<div class="clear"></div>
				</div>
			</div>
			<div class="grid_1">
				<div class="grid_12"><label>&nbsp;</label></div>
				<div class="clear"></div>
				<div class="grid_12">
					<button class="btnTemplate1" style="margin-top: 7px;" ng-click="SearchData()">
						<i class="fa fa-search"></i>Cari
					</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Grid Utama -->
	<div class="grid_12">
		<div class="grid_12 borderBox">
			<div kendo-grid id="kGrid"
				k-data-source="sourceGrid"
				k-selectable="'row'"
				k-pageable="'true'"
				k-columns="columnGrid"
				k-sortable="'true'"
				k-groupable="'true'"
				k-ng-model="dataPasienSelected"
				class="max-height">
				<div k-detail-template>
					<kendo-tabstrip>
						<div>
							<div id="kGridDetail" kendo-grid k-options="data2(dataItem)"
								k-sortable="'true'"
								k-selectable="'row'"
								k-ng-model="dataSelected2"
								ng-click="klikDetail(dataSelected2)">
							</div>
						</div>
					</kendo-tabstrip>
				</div>
			</div>
		</div>
	</div>

	<div class="grid_3" style="margin-top: 10px;">
		<button class="btnTemplate1" style="font-size: 16px; padding: 10px 20px; background-color: red; color: white;" ng-click="batalVerifikasi()" ng-show="dataPasienSelected && dataPasienSelected.status == 'VERIFIKASI'">
			<i class="fa fa-times-circle"></i> Batal Verifikasi
		</button>
	</div>

	<div class="clear"></div>

	<!-- Filter Bawah + Tombol Aksi -->
	<div class="grid_12">
		<div class="grid_1">
			<div class="grid_12"><label c-label item="item">No Order</label></div>
			<div class="clear"></div>
			<div class="grid_12">
				<input c-text-box type="input" class="k-textbox" ng-model="item.noOrder"
					ng-keypress="($event.which == 13)? SearchData():item.noOrder" />
			</div>
		</div>
		
		<div class="grid_1">
			<div class="grid_12"><label c-label item="item">No RM</label></div>
			<div class="clear"></div>
			<div class="grid_12">
				<input c-text-box type="input" class="k-textbox" ng-model="item.noRm"
					ng-keypress="($event.which == 13)? SearchData():item.noRm" />
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12"><label c-label item="item" c-label-text="Nama"></label></div>
			<div class="clear"></div>
			<div class="grid_12">
				<input c-text-box type="input" class="k-textbox" ng-model="item.nama"
					ng-keypress="($event.which == 13)? SearchData():item.nama" />
			</div>
		</div>
		<div class="grid_2"></div>

		<div class="grid_12" style="margin-top: 60px">
			<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
		</div>
	</div>
</div>

<!-- Popup Edit Order -->
<div kendo-window="popUpOrder" k-title="'Edit Order Gizi Telemedicine'" k-width="750" k-visible="false"
	k-on-open="win2visible = true" k-on-close="win2visible = false">
	<div class="panel panel-default container_12">
		<div class="grid_12">
			<div class="grid_4" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">Tanggal Order</label></div>
				<div class="grid_12">
					<input c-text-box type="input" class="k-textbox" ng-model="pop.tglorder" disabled />
				</div>
			</div>
			<div class="grid_4" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">No Order</label></div>
				<div class="grid_12">
					<input c-text-box type="input" class="k-textbox" ng-model="pop.noorder" disabled />
				</div>
			</div>
			<div class="grid_4" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">Pengorder</label></div>
				<div class="grid_12">
					<input c-text-box type="input" class="k-textbox" ng-model="pop.pengorder" disabled />
				</div>
			</div>
			<div class="grid_4" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">Tanggal Menu</label></div>
				<div class="grid_12">
					<input style="width:100%" kendo-datetimepicker k-ng-model="pop.tglmenu"
						k-format="'yyyy-MM-dd HH:mm'" />
				</div>
			</div>
			<div class="grid_4" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">Jenis Waktu</label></div>
				<div class="grid_12">
					<input style="width: 100%;" kendo-combo-box k-data-source="listJenisWaktu"
						k-ng-model="pop.jenisWaktu" k-data-text-field="'jeniswaktu'"
						k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" />
				</div>
			</div>
			<div class="grid_4" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">Jenis Diet</label></div>
				<div class="grid_12">
					<select ng-show="listJenisDiet.length" kendo-multi-select k-options="optJenisDiet"
						k-filter="'contains'" k-data-source="listJenisDiet" k-ng-model="pop.jenisDiet"></select>
				</div>
			</div>
			<div class="grid_4" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">Kategori Diet</label></div>
				<div class="grid_12">
					<input style="width: 100%;" kendo-combo-box k-data-source="listKategoriDiet"
						k-ng-model="pop.kategoriDiet" k-data-text-field="'kategorydiet'"
						k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" />
				</div>
			</div>
			<div class="grid_8" style="margin-bottom:1px">
				<div class="grid_12"><label c-label item="item">Keterangan</label></div>
				<div class="clear"></div>
				<div class="grid_12">
					<input c-text-box type="input" class="k-textbox" ng-model="pop.keterangan" />
				</div>
			</div>
		</div>

		<div class="k-edit-buttons k-state-default pull-right" style="margin-top: 20px">
			<kendo-button class="k-primary" ng-click="saveEditOrder()" ng-hide="tombolSimpanVis">Simpan</kendo-button>
			<kendo-button ng-click="batalEdit()">Batal</kendo-button>
		</div>
	</div>
</div>
