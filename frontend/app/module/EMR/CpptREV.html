<div class="grid_12" id="form">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <!-- <div class="panel-heading" style="text-align: right;">001.2/FORM/7/RMIK/2022/Rev. 00</div> -->
            <div class="panel-heading" c-translate>Catatan Perkembangan Pasien Terintegrasi (CPPT) 
                </div>
        </div>
        <div class="grid_12" style="margin-top: 20px">
            <fieldset>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Tanggal dan Jam Datang"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%" k-ng-model="item.tgljamdatang" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm"
                            ng-disabled="item.tgljamdatang2" />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item">DPJP</label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.dpjputama"
                            k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listPegawai " ng-disabled="item.dpjputama2" />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Bangsal"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.bangsal"
                            ng-disabled="item.bangsal2" k-data-text-field="'text'" k-data-value-field="'value'"
                            k-filter="'contains'" k-auto-bind="false" k-data-source="listRuang" />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Kelas"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.kelas"
                            ng-disabled="item.kelas2" k-data-text-field="'text'" k-data-value-field="'value'"
                            k-filter="'contains'" k-auto-bind="false" k-data-source="listKelas " />
                    </div>
                </div>
                <!-- <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item">Dokter Rawat Bersama</label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.dokterrawatbersama"
                            k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listPegawai " ng-disabled="item.dokterrawatbersama2" />
                    </div>
                </div> -->
            </fieldset>
        </div>
        <div class="grid_12">
            <fieldset style="margin-top: 10px; ">
                <div class="grid_12" style="margin-top: 20px">
                    <table style="width:100%;color: #4c5356;">
                        <tr>
                            <th style="text-align: center;width: 200px" rowspan="2">Tanggal/Jam</th>
                            <th style="text-align: center;width: 200px" rowspan="2">Profesional Pemberi Asuhan</th>
                            <th style="text-align: center;width: 400px">Catatan Asuhan Medis dan Tenaga Medis Kesehatan
                                Lain</th>
                            <th style="text-align: center;width: 150px" rowspan="2">Intruksi PPA</th>
                            <th style="text-align: center;width: 200px" rowspan="2"> Verifikasi DPJP</th>
                            <th rowspan="2"></th>
                        </tr>
                        <tr>
                            <th style="text-align: center;width: 200px">SOAP</th>
                        </tr>
                        <tr ng-repeat="(index, data) in listItemREV">
                            <td>
                                <input style="width: 100%" k-ng-model="data.tgljam"
                                    ng-disabled="data.tgljam2" kendo-datetimepicker
                                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                                    parsedate="yyyy-MM-dd HH:mm" />
                            </td>
                            <td>
                                <input style="width: 100%;" kendo-combo-box k-ng-model="data.jenisppa"
                                    ng-disabled="data.jenisppa2" k-data-text-field="'text'"
                                    k-data-value-field="'value'" k-filter="'contains'" k-auto-bind="false"
                                    k-data-source="listJenisPegawai" />

                            </td>
                            <td>
                                <textarea style="width: 95%;height: 200px" cols="6" rows="5" c-text-area type="input"
                                    filter="'string'" class="k-textbox" ng-model="data.soap"
                                    ng-disabled="data.soap2"></textarea>
                                <input style="width: 100%;" kendo-combo-box k-ng-model="data.tenagamedis"
                                    ng-disabled="data.tenagamedis2" k-data-text-field="'text'"
                                    k-data-value-field="'value'" k-filter="'contains'" k-auto-bind="false"
                                    k-data-source="listPegawai" />
                            </td>
                            <td>
                                <textarea style="width: 95%;height: 200px" cols="6" rows="5" c-text-area type="input"
                                    filter="'string'" class="k-textbox" ng-model="data.ppa"
                                    ng-disabled="data.ppa2"></textarea>
                            </td>
                            <td>
                                <textarea style="width: 95%;height: 200px" cols="6" rows="5" c-text-area type="input"
                                    filter="'string'" class="k-textbox" ng-model="data.dpjp"
                                    ng-change="getTTD(index, data)"
                                    ng-disabled="data.dpjp2"></textarea>
                                <input style="width: 100%" k-ng-model="data.tgldpjp"
                                    ng-disabled="data.tgldpjp2" kendo-datetimepicker
                                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                                    parsedate="yyyy-MM-dd HH:mm" />
                                <input style="width: 100%;" kendo-combo-box k-ng-model="data.dropdpjp"
                                    ng-disabled="data.dropdpjp2" k-data-text-field="'text'"
                                    k-data-value-field="'value'" k-filter="'contains'" k-auto-bind="false"
                                    k-data-source="listPegawai" />
                            </td>
                            <td>
                                <div class="grid_1" style="margin-top:20px">
                                    <label ng-click="addNewItem()" class="clicks" ng-show="listItemREV.length -1 == index"><img src="stylesheets/Addd.png"
                                            width="25" alt="Picture"></label>
                                    <label ng-click="removeItem(index)" ng-show="listItemREV.length -1 == index" class="clicks"><img
                                            src="stylesheets/cancel.png" width="25" alt="Picture"></label>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </fieldset>
        </div>
    </div>
    <div class="grid_12">
        <div class="grid_3"></div>
        <div class="grid_9">
            <div class="grid_2"></div>
            <div class="grid_2" style="margin-top: 22px" ng-show='tombolSimpanVis'>
                <button class="btnTemplate1" ng-click="Save()" ng-disabled="disabledSimpan"><i
                        class="fa fa-save"></i>Simpan</button>
            </div>
            <div class="grid_2" style="margin-top: 22px">
                <button class="btnTemplate1" ng-click="Batal()" ng-disabled="disabledBatal"><i
                        class="fa fa-refresh"></i>Batal</button>
            </div>
            <div class="grid_2" style="margin-top: 22px">
                <button class="btnTemplate1" ng-click="kembali()" ng-disabled="disabledBatal"><i
                        class="fa fa-arrow-left"></i>Kembali</button>
            </div>
            <div class="grid_2" ng-show="isCetak" style="margin-top: 22px">
                <button class="btnTemplate1 success" ng-click="cetakPdf()"><i class="fa fa-print"></i>Cetak</button>
            </div>
            <div class="grid_2" ng-show="isCetakV" style="margin-top: 22px">
                <button class="btnTemplate1 success" ng-click="cetakBlade()"><i class="fa fa-print"></i>Cetak
                    View</button>
            </div>
        </div>
    </div>
</div>
<style type="text/css">
    fieldset {
        border-radius: 5px;
        border: 1px solid #228be6;
    }

    .k-slider-horizontal {
        display: inline-block;
        width: 450px;
        height: 26px;
    }

    table,
    th,
    td {
        border: 1px solid #929191;
        border-collapse: collapse;
        padding: 5px;
    }

    th,
    td {
        padding: 5px;
        text-align: left;
    }

    .k-slider {

        margin-left: 3%;
        margin-right: 3%;
        margin-top: 1%;
        margin-bottom: 5%;
        display: inline-block;
    }

    .activeBtn {
        background-color: #10c4b2;
        color: #ffffff;
    }

    .clicks {
        cursor: pointer;
    }

    span.icon.fa.fa-plus-circle {
        display: none !important;
    }

    span.icon.fa.fa-minus-circle {
        display: none !important;
    }

    button[disabled] {
        cursor: default;
        color: #c2c2c2;
        border-color: #ccc;
        border: 1px solid #ccc;
        background-color: #f5f5f5;
        background-image: none;
    }

    span.autor {
        float: right;
        color: rgb(255, 64, 129);
        font-size: 13px;
        background: white;
        padding: 5px;
        border-radius: 10px;
    }
</style>
