                </div>
                <div class="grid_9">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.page"
                        k-data-text-field="'page'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listPage"/>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <label c-label item="item">Keterangan</label>
                </div>
                <div class="grid_9">
                    <textarea class="k-textbox" style="height: 76px; width: 100%; resize: none;"
                        ng-model="item.reason"></textarea>
                </div>
            </div>
        </fieldset>

        <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
            <button class="k-button k-button-icontext k-primary k-grid-update" ng-disabled="disabledSimpan2"
                ng-click="SaveUpdate()" id="btnSimpan2"><span class="k-icon k-update"></span>Simpan</button>
            <button class="k-button  k-button-icontext" ng-disabled="disabledBatal" ng-click="batal()"
                id="btnBatal2"><span class="k-icon k-cancel"></span>Batal</button>
        </div>

    </div>
</div>
