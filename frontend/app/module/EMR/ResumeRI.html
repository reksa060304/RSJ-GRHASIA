<style>
    .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }
</style>
<div>
    <c-panel item="item" header="'Ringkasan Pulang'" disabled>
    </c-panel>
    <div class="panel panel-default container_12" ng-show="isGrid">
        <div class="panel-body">
            <div class="grid_3">
                <label c-label c-label-text="Riwayat Penyakit" real></label>
                <input c-text-box type="input" filter="'varchar'" class="k-textbox" ng-model="item.filterRiwayat" />
            </div>
            <div class="grid_3">
                <label c-label item="item">Pemeriksaan Fisik</label>
                <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                    ng-model="item.filterPemeriksaanfisik" />
            </div>
            <div class="grid_3">
                <label c-label item="item">Pemeriksaan Penunjang</label>
                <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                    ng-model="item.filterPemeriksaanPenunjang" />
            </div>
            <div class="grid_1">
                <label c-label c-label-text=""></label>
                <em style="margin-top:6px;" ng-click='resetFilter()' id="iconButton" data-role="button"
                    class="k-button k-button-icon k-primary" role="button" aria-disabled="false" tabindex="0"><span
                        class="k-sprite k-icon k-i-cancel">Refresh</span></em>
            </div>
        </div>
        <div class="grid_12">
            <div id="gridResumeHead" kendo-grid k-data-source="sourceResumeHead" options="resumeOptHead"
                k-ng-model="modelGrid" ng-click="klik(modelGrid)">
            </div>
        </div>
        <div class="grid_2">
        </div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="showInput()"><i class="fa fa-plus"></i>Tambah
            
            </button>
        </div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="editGrid()"><i class="fa fa-edit"></i>Edit
            </button>
        </div>
        <div class="grid_2">
            <button class="btnTemplate1 cancel" ng-click="hapusGrid()"><i class="fa fa-trash"></i>Hapus
            </button>
        </div>
        
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="cetakBladeV3()"><i class="fa fa-print"></i>Cetak View
            </button>
        </div>
        <div class="grid_2" style="margin-top: 22px">
            <button class="btnTemplate1 success" ng-click="ttdElek()"><i class="fa fa-key"></i>TTD Elektronik</button>
        </div>
        
    </div>
    <md-content class="md-padding" ng-show="isEdit">
        <div class="grid_12">
            <div class="grid_1">
                <label c-label>Tanggal Masuk</label>
            </div>
            <div class="grid_2">
                <input style="width: 100%" k-ng-model="item.tglmasuk" kendo-datetimepicker
                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
            </div>
            <div class="grid_1">
                <label c-label>Tanggal Pulang</label>
            </div>
            <div class="grid_2">
                <input style="width: 100%" k-ng-model="item.tglpulang" kendo-datetimepicker
                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
            </div>
            <div class="grid_1">
                <label c-label>Wisma :</label>
            </div>
            <div class="grid_2">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.wisma">
            </div>
            <div class="grid_1">
                <label c-label>Kelas :</label>
            </div>
            <div class="grid_2">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.kelas">
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label item="item">1. Indikasi Dirawat </label>
            </div>
            <div class="clear"></div>
            <div class="grid_12" style="margin-top: 5px;">
                <!-- <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.tindakanProsedur" /> -->

                <textarea class="k-textbox" style="height: 50px; width: 100%; "
                    ng-model="item.alasanDirawat"></textarea>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label>2. Diagnosa Masuk</label>
            </div>
            <div class="grid_6">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.diagnosamasuktext">
            </div>
            <div class="grid_4">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.diagnosamasuk"
                    k-data-text-field="'kodeNama'" k-data-value-field="'id'"
                    k-filter="'contains '" k-auto-bind="false"
                    k-data-source="listDiagnosa" />
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label item="item">3. Hasil Pemeriksaan Fisik </label>
            </div>
            <div class="clear"></div>
            <div class="grid_12" style="margin-top: 5px;">
                <!-- <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.tindakanProsedur" /> -->

                <textarea class="k-textbox" style="height: 50px; width: 100%; "
                    ng-model="item.hasilfisik"></textarea>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label item="item">4. Hasil Pemeriksaan Psikiatri </label>
            </div>
            <div class="clear"></div>
            <div class="grid_12" style="margin-top: 5px;">
                <!-- <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.tindakanProsedur" /> -->

                <textarea class="k-textbox" style="height: 50px; width: 100%; "
                    ng-model="item.hasilpsikiatri"></textarea>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_3">
                <label c-label item="item">5. Pemeriksaan Diagnostik atau Penunjang </label>
            </div>
            <div class="clear"></div>
            <div class="grid_12" style="margin-top: 5px;">
                <!-- <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.tindakanProsedur" /> -->

                <textarea class="k-textbox" style="height: 50px; width: 100%; "
                    ng-model="item.hasilpenunjang"></textarea>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_12" style="margin-top: 10px;">
                <label c-label item="item">6. Terapi dan Tindakan yang diberikan </label>
            </div>
            <div class="grid_12">
                <label c-label item="item">a. Selama Dirawat </label>
            </div>
            <div class="clear"></div>
            <div class="grid_12" style="margin-top:5px">
                <textarea class="k-textbox" style="height: 50px; width: 100%; " ng-model="item.terapi"></textarea>
            </div>
            <div class="grid_12">
                <label c-label item="item">b. Waktu Pulang </label>
            </div>
            <div class="clear"></div>
            <div class="grid_12" style="margin-top:5px">
                <textarea class="k-textbox" style="height: 50px; width: 100%; " ng-model="item.terapipulang"></textarea>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_12" style="margin-top: 10px; margin-bottom: 5px;">
                <label c-label>7. Diagnosa Akhir</label>
            </div>
            <div class="grid_2">
                <label c-label>Axis I</label>
            </div>
            <div class="grid_6">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.diagnosautamatext">
            </div>
            <div class="grid_4">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.diagnosautama"
                    k-data-text-field="'kodeNama'" k-data-value-field="'id'"
                    k-filter="'contains '" k-auto-bind="false"
                    k-data-source="listDiagnosa" />
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label>Axis II</label>
            </div>
            <div class="grid_6">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.axis2">
            </div>
            <div class="grid_4">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.diagnosatambahan"
                    k-data-text-field="'kodeNama'" k-data-value-field="'id'"
                    k-filter="'contains '" k-auto-bind="false"
                    k-data-source="listDiagnosa" />
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label>Axis III</label>
            </div>
            <div class="grid_6">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.axis3">
            </div>
            <div class="grid_4">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.diagnosatambahan2"
                    k-data-text-field="'kodeNama'" k-data-value-field="'id'"
                    k-filter="'contains '" k-auto-bind="false"
                    k-data-source="listDiagnosa" />
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label>Axis IV</label>
            </div>
            <div class="grid_6">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.axis4">
            </div>
            <div class="grid_4">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.diagnosatambahan3"
                    k-data-text-field="'kodeNama'" k-data-value-field="'id'"
                    k-filter="'contains '" k-auto-bind="false"
                    k-data-source="listDiagnosa" />
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_2">
                <label c-label>Axis V</label>
            </div>
            <div class="grid_6">
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.axis5">
            </div>
            <div class="grid_4">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.diagnosatambahan4"
                    k-data-text-field="'kodeNama'" k-data-value-field="'id'"
                    k-filter="'contains '" k-auto-bind="false"
                    k-data-source="listDiagnosa" />
            </div>
        </div>
        <div class="grid_12" style="margin-top:10px;">
            <div class="grid_12">
                <label c-label item="item">8. Status / Kondisi Pasien Waktu Pulang :</label>
            </div>

            <div class="grid_12" style="margin-top:5px">
                <textarea c-text-box class="k-textbox" style="height: 50px; width: 95%;"
                    ng-model="item.riwayatPenyakit"></textarea>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_12" style="margin-top: 5px; margin-bottom: 5px;">
                <label c-label item="item">9. Intruksi Follow Up / Tindak Lanjut :</label>
            </div>
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_12" style="margin-left:5px">
                        <label c-label item="item">a.  Minum obat sesuai aturan</label>
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_2">
                        <label c-label item="item">b. Kontrol klinik</label>
                    </div>
                    <div class="grid_2">
                        <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.kontrolklinik">
                    </div>
                    <div class="grid_2">
                        <label c-label item="item">di RS Jiwa Grhasia /</label>
                    </div>
                    <div class="grid_3">
                        <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.rumahsakittujuan">
                    </div>
                    <div class="grid_1">
                        <label c-label item="item">Tanggal</label>
                    </div>
                    <div class="grid_2">
                        <input style="width: 100%" k-ng-model="item.tglkontrolpoli" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
                    </div>
                    
                </div>
                <div class="grid_12">
                    <div class="grid_2">
                        <label c-label item="item">
                            c. Edukasi perawatan lanjut
                        </label>
                    </div>
                    <div class="grid_10">
                        <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.intruksi">
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_1">
                        <label c-label item="item">
                            d. 
                        </label>
                    </div>
                    <div class="grid_11">
                        <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.kondisi">
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_1">
                        <label c-label item="item">
                            e. 
                        </label>
                    </div>
                    <div class="grid_11">
                        <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.kondisiwaktukeluare">
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <label c-label item="item">
                    Saya telah menerima informasi tersebut diatas dan menyetujui bahwa Ringkasan Pulang ini hanya dapat digunakan untuk kepentingan pengobatan, serta TIDAK DAPAT digunakan untuk kepentingan lainnya. 
                </label>
            </div>
            <div class="grid_12"></div><br>
            <div class="grid_4">
                <label c-label item="item">
                    Pasien / Wali Pasien
                </label>
                <input c-text-box type="input" filter="'char'" class="k-textbox" ng-model="item.pasien">
            </div>
        </div>
          
        <div class="grid_12">
                <div class="grid_8" ></div>
            <div class="grid_2" >
                    <button class="btnTemplate1" ng-click="Save()"><i class="fa fa-save"></i>Simpan
                    </button>
            </div>
            <div class="grid_2">
                    <button class="btnTemplate1" ng-click="Back()"><i class="fa fa-arrow-left"></i>Kembali
                    </button>
            </div>
        </div>
    </md-content>

    <div kendo-window="popUp" k-title="'Tambah Data'" k-width="500" k-height="260" k-visible="false"
        k-on-open="win2visible = true" k-on-close="win2visible = false">
        <div class="panel panel-default container_12" style="padding: 0px 10px;">
            <div class="grid_12">
                <div class="grid_6" style="margin: 0px 0px 5px" ng-show="Nomer">
                    <label c-label c-label-text="No" real></label>
                    <input c-text-box type="input" class="k-textbox" ng-model="item.no">
                </div>
                <div class="grid_6" style="margin: 0px 0px 5px">
                    <label c-label c-label-text="Nama Obat" real></label>
                    <input c-text-box type="input" class="k-textbox" ng-model="item.namaobat">
                </div>
                <div class="grid_6" style="margin: 0px 0px 5px">
                    <label c-label c-label-text="Jumlah" real></label>
                    <input c-text-box type="input" class="k-textbox" ng-model="item.jumlah">
                </div>
                <div class="grid_6" style="margin: 0px 0px 5px">
                    <label c-label c-label-text="Dosis" real></label>
                    <input c-text-box type="input" class="k-textbox" ng-model="item.dosis">
                </div>
                <div class="grid_6" style="margin: 0px 0px 5px">
                    <label c-label c-label-text="Frekuensi" real></label>
                    <input c-text-box type="input" class="k-textbox" ng-model="item.frekuensi">
                </div>
                <div class="grid_6" style="margin: 0px 0px 5px">
                    <label c-label c-label-text="Cara Pemberian" real></label>
                    <input c-text-box type="input" class="k-textbox" ng-model="item.carapemberian">
                </div>

            </div>
            <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="Tambah()"><span
                        class="k-icon k-update"></span>Tambah</button>
                <button class="k-button  k-button-icontext" ng-click="batal()"><span
                        class="k-icon k-cancel"></span>Batal</button>
            </div>
        </div>
    </div> 
    
    <div class="grid_12" style="margin-top:100px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>
    <div kendo-window="winDialog" k-title="'Pilih Pegawai'" k-width="400" k-height="120" k-visible="false"
        k-on-open="win2visible = true" k-on-close="win2visible = false">
        <label c-label item="item " c-label-text="pegawaiPenandaTangan "></label>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.pegawai" k-data-text-field="'namalengkap'"
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listDokter" />
        <div class="clear">
            <button class="k-button" ng-click="savePengajuanTTE(item.pegawai)"
                style="float:right;margin-top:4%">Simpan</button>
        </div>
    </div>
</div>
