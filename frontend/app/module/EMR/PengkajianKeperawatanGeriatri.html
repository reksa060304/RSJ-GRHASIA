<style type="text/css">
    fieldset {
        border-radius: 5px;
        border: 1px solid #228be6;
    }

    .k-slider-horizontal {
        display: inline-block;
        /* float: left; */
        /* float: left; */
        width: 450px;

        height: 26px;


    }

    .k-slider {

        margin-left: 3%;
        margin-right: 3%;
        margin-top: 1%;
        margin-bottom: 5%;
        display: inline-block;
    }

    .activeBtn {
        background-color: #10c4b2;
        color: #ffffff;
    }

    table,
    th,
    td {
        border: 1px solid #929191;
        border-collapse: collapse;
        padding: 5px;
    }

    th,
    td {
        padding: 5px;
        text-align: left;
    }
</style>

<div class="grid_12" disable-contents="allDisabled">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <div class="panel-heading" c-translate>Lembar Keperawatan Geriatri</div>
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <fieldset style="margin-top: 10px">
                <div class="grid_12" ng-repeat="list in listSatu | orderBy:'nourut'">
                    <div ng-repeat="jawab in list.details | orderBy: 'nourut'">
                        <div ng-switch on="jawab.type">
                            <!-- //radio -->
                            <div class="grid_12" ng-switch-when="radio">
                                <div class="grid_3">
                                    {{jawab.caption}}
                                </div>
                                <div class="grid_6">
                                    <md-radio-group ng-model="item.obj[jawab.id]">
                                        <md-radio-button ng-repeat="stat in jawab.cbotable | orderBy:'id'"
                                            value="{{stat.value}}" class="md-primary">{{stat.name}}
                                        </md-radio-button>
                                    </md-radio-group>
                                </div>
                            </div>
                            <!-- //textbox -->
                            <div class="grid_4" ng-switch-when="textbox0">
                                <div class="grid_12">
                                    <div class="grid_12">
                                        <label>{{jawab.caption}}</label>
                                    </div>
                                    <div class="grid_11">
                                        <input type="text" class="k-textbox" id="item.obj{{jawab.id}}"
                                            ng-model="item.obj[jawab.id]">
                                    </div>
                                </div>
                            </div>
                            <div class="grid_2" ng-switch-when="textbox2">
                                <div class="grid_12">
                                    <div class="grid_12">
                                        <label>{{jawab.caption}}</label>
                                    </div>
                                    <div class="grid_11">
                                        <input type="text" class="k-textbox" id="item.obj{{jawab.id}}"
                                            ng-model="item.obj[jawab.id]">
                                    </div>
                                </div>
                            </div>
                            <div class="grid_4" ng-switch-when="textbox4">
                                <div class="grid_12">
                                    <div class="grid_12">
                                        <label>{{jawab.caption}}</label>
                                    </div>
                                    <div class="grid_11">
                                        <input type="text" class="k-textbox" id="item.obj{{jawab.id}}"
                                            ng-model="item.obj[jawab.id]">
                                    </div>
                                </div>
                            </div>
                            <div class="grid_6" ng-switch-when="textbox6">
                                <div class="grid_12">
                                    <div class="grid_12">
                                        <label>{{jawab.caption}}</label>
                                    </div>
                                    <div class="grid_11">
                                        <input type="text" class="k-textbox" id="item.obj{{jawab.id}}"
                                            ng-model="item.obj[jawab.id]">
                                    </div>
                                </div>
                            </div>
                            <div class="grid_12" ng-switch-when="textbox">
                                <div class="grid_12">
                                    <div class="grid_12">
                                        <label>{{jawab.caption}}</label>
                                    </div>
                                    <div class="grid_11">
                                        <input type="text" class="k-textbox" id="item.obj{{jawab.id}}"
                                            ng-model="item.obj[jawab.id]">
                                    </div>
                                </div>
                            </div>
                            <!-- //end textbox -->


                            <div class="grid_3" ng-switch-when="label3">
                                <label c-label item="item">
                                    &nbsp;{{jawab.caption}}</label>
                            </div>
                            <div class="grid_12" ng-switch-when="datetime">
                                <div class="grid_12">
                                    <label c-label item="item">{{jawab.caption}}</label>
                                </div>
                                <div class="grid_6">
                                    <input style="width: 100%" k-ng-model="item.obj[jawab.id]" kendo-datetimepicker
                                        placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                                        parsedate="yyyy-MM-dd HH:mm" />
                                </div>
                            </div>
                            
                            <div class="grid_12" ng-switch-when="label">
                                <label c-label item="item">
                                    &nbsp;{{jawab.caption}}</label>
                            </div>
                            <div class="grid_0" ng-switch-when="checkbox0">
                                <div class="grid_12">
                                    <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                        ng-model="item.obj[jawab.id]">
                                    <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                        &nbsp;{{jawab.caption}}</label>
                                </div>
                            </div>
                            <div class="grid_3" ng-switch-when="checkbox">
                                <div class="grid_12">
                                    <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                        ng-model="item.obj[jawab.id]">
                                    <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                        &nbsp;{{jawab.caption}}</label>
                                </div>
                            </div>
                            <div class="grid_12" ng-switch-when="textarea">
                                <div>
                                    <label c-label item="item">{{jawab.caption}}</label>
                                </div>
                                <div>
                                    <textarea style="width: 95%;height: 100px" c-text-area type="input"
                                        filter="'string'" class="k-textbox" ng-model="item.obj[jawab.id]" />
                                    </div>
                            </div>
                            <div class="grid_12" ng-switch-when="combobox">
                                <div class="grid_12">
                                    <label c-label item="item">{{jawab.caption}}</label>
                                </div>
                                <div class="grid_10">
                                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[jawab.id]"
                                        k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                                        k-auto-bind="false" k-data-source="{{jawab.cbotable}}" />
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>
                
            </fieldset>
        </div>
        
        <div class="grid_12">
            <img ng-show="isLoadingNoKartu" style="position:absolute;right:0;top:7px;" height="24"
                src="stylesheets\Flat\loading-image.gif" />
            <div ng-include='"../app/module/EMR/TemplateButtonDinamis" '></div>
        </div>
    </div>
</div>

    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div> -->
