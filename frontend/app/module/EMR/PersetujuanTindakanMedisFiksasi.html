                                <tr>
                                        <td>5. </td>
                                        <td>Tata Cara</td>
                                        <td>
                                            1. Siapkan tempat dan peralatan fiksasi <br>
                                            2. Lakukan identifikasi sesuai prosedur<br>
                                            3. Jelaskan alasan dan tujuan dilakukan fiksasi<br>
                                            4. Atur posisi pasien diatas tempat tidur dengan posisi
                                            satu tangan diatas satu tangan dibawah dan kedua
                                            kaki direnggangkan <br>
                                            5. Lakukan fiksasi pasien minimal pada 4 (empat) titik
                                            yaitu pada kedua pergelangan tangan dan kedua
                                            pergelangan kaki<br>
                                            6. Apabila dengan tindakan nomor 4, keadaan pasien
                                            masih sulit diatasi, lakukan fiksasi tambahan pada
                                            kedua lengan atas dan kedua paha atas<br>
                                            7. Observasi tanda - tanda vital, respon dan kondisi
                                            pengikatan pada kedua tangan dan kaki pasien
                                            dan melakukan evaluasi tentang kondisi pasien
                                            minimal tiap setengah jam<br>
                                            8.Ubah posisi pengikatan dan melakukan range
                                            of motion (mobilisasi) setiap 2 (dua) jam<br>
                                            9. Lakukan pemenuhan kebutuhan dasar pasien<br>
                                         </td>
