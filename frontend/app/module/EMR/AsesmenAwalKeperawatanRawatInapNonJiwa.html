<style type="text/css">

        display: inline-block;

        width: 450px;

        height: 26px;


    }

<div class="grid_12" disable-contents="allDisabled">

        <div class="grid_12" style="margin-top: 10px;">
            <fieldset style="margin-top: 10px">

                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                            </div>
                                        </div>

                                    </div>
                                </div>

                                            </div>
                                        </div>

                                    </div>
                                </div>

                                                        &nbsp;{{jawab.nama}}</label>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                            </div>
                        </div>

                                            &nbsp;Ya Skor(2)</label>

                                            &nbsp;Ya Skor(1)</label>

                                </td>
                            </tr>

                                <td>1</td>
                                <td>

                                            &nbsp;Tidak Skor(0)</label>
                                    </div>
                                    <div class="grid_12">
                                        <input type="checkbox" class="k-checkbox" id="item.obj1901301504"
                                            ng-model="item.obj[1901301504]">
                                        <label class="k-checkbox-label" for="item.obj1901301504">
                                            &nbsp;Ya Skor(1)</label>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>
                                    Apakah ada penurunan berat badan atau tidak adanya

                                        <label class="k-checkbox-label" for="item.obj1901301505">
                                            &nbsp;Tidak Skor(0)</label>

                                    <div class="grid_12">
                                        <input type="checkbox" class="k-checkbox" id="item.obj1901301506"

                                </td>
                            </tr>
                            <tr>
                                <th colspan="2">TOTAL SKOR</th>
                                <td><input type="text" class="k-textbox" ng-model="item.obj[1901301507]"></td>
                            </tr>
                        </table>
                        <fieldset style="margin-top: 10px;">
                            KESIMPULAN : <br>
                            Skor 0 = Risiko rendah, tidak ada intervensi gizi yang diperlukan<br>

                            lengkap, pertimbangkan intervensi gizi dengan ahli gizi<br>
                            Skor 4 - 5 = Risiko tinggi, konsultasikan kepada dokter dan ahli gizi untuk<br>
                            rekomendasi gizi individu dan tindak lanjut
                        </fieldset>
                    </div>
                    <div class="grid_12">

                        <div class="grid_6" style="margin-bottom: 10px">
                            <label c-label item="item">TB</label>

                                        </md-radio-group>

                                    <div class="grid_2">
                                       <md-radio-group ng-model="item.obj[1901301512]">
                                         <md-radio-button value="4" class="md-primary"> >15kg
                                        </md-radio-button>

                                        </md-radio-button>

                                </td>
                                
                            </tr>

                                        <input type="checkbox" class="k-checkbox" id="item.obj1901301513"

                                        <label class="k-checkbox-label" for="item.obj1901301513">
                                            &nbsp;Tidak Skor(0)</label>

                                    <div class="grid_12">
                                        <input type="checkbox" class="k-checkbox" id="item.obj1901301514"

                                        <label class="k-checkbox-label" for="item.obj1901301514">
                                            &nbsp;ragu Skor(2)</label>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th colspan="2">TOTAL SKOR</th>
                                <td><input type="text" class="k-textbox" ng-model="item.obj[1901301515]"></td>
