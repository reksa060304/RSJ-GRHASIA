                    <div class="grid_12 margin-top-10 margin-bottom">
                        <div class="container-edukasi">
                            <p style="font-size: 1.2em; font-weight: bold; margin-bottom: 20px;">
                                Rekomendasi Edukasi dan Tindak Lanjut di Puskesmas</p>
                            <ol>
                                <li>1. Melanjutkan pengobatan anti Diabetes
                                    <p>Pasien diberikan edukasi secara jelas dan berkelanjutan mengenai:</p>
                                    <ul>
                                        <li>Pentingnya kepatuhan terhadap pengobatan DM sesuai anjuran dokter, baik obat oral maupun insulin bila digunakan.</li>
                                        <li>Ditekankan bahwa obat harus dikonsumsi secara teratur dan berkesinambungan, meskipun kadar gula darah atau keluhan sudah membaik.</li>
                                        <li>Tidak menghentikan pengobatan tanpa konsultasi dengan dokter.</li>
                                    </ul>
                                </li>
                                <li>2. Melakukan pemeriksaan gula darah secara rutin dan mandiri
                                    <p>Pasien dianjurkan untuk:</p>
                                    <ul>
                                        <li>Melakukan pemeriksaan gula darah dan tekanan darah secara rutin di Puskesmas sesuai jadwal kontrol</li>
                                        <li>Melakukan pemantauan mandiri gula darah di rumah bila memungkinkan</li>
                                        <li>Mencatat hasil pemeriksaan dalam buku kontrol untuk evaluasi berkala</li>
                                        <li>Segera melapor ke tenaga kesehatan bila gula darah melebihi atau di bawah nilai normal dan disertai keluhan</li>
                                    </ul>
                                </li>
                                <li>3. Penjelasan tentang pencegahan komplikasi
                                    <p>Pasien diberikan edukasi mengenai risiko komplikasi DM seperti penyakit jantung, stroke, gagal ginjal, neuropati, retinopati, dan luka kaki diabetik, serta upaya pencegahannya, meliputi:</p>
                                    <ol type="a">
                                        <li>a. Kepatuhan Minum Obat
                                            <p>Pasien diarahkan untuk:</p>
                                            <ul>
                                                <li>Mengonsumsi obat pada waktu yang sama setiap hari</li>
                                                <li>Tidak melewatkan dosis</li>
                                                <li>Jika lupa minum obat, segera minum begitu teringat. Jangan menggandakan dosis jika sudah mendekati waktu dosis berikutnya.</li>
                                                <li>Menggunakan pengingat bila diperlukan</li>
                                                <li>Memahami cara penggunaan obat, termasuk insulin bila digunakan</li>
                                            </ul>
                                        </li>
                                        <li>b. Pengawasan Dosis Pemberian Obat
                                            <p>Pasien dan keluarga diberikan edukasi untuk:</p>
                                            <ul>
                                                <li>Tidak mengubah dosis atau jenis obat tanpa evaluasi dokter</li>
                                                <li>Melaporkan efek samping atau keluhan terkait obat</li>
                                                <li>Membawa daftar obat saat kontrol rutin</li>
                                                <li>Edukasi ke pasien bila muncul tanda hipoglikemi seperti keringat dingin, lemas, gemetar, pusing; segera minum manis dan memeriksakan diri ke pusat kesehatan terdekat.</li>
                                            </ul>
                                        </li>
                                    </ol>
                                </li>
                                <li>4. Dukungan Psikososial
                                    <p>Pasien dan keluarga diberikan dukungan psikososial berupa:</p>
                                    <ul>
                                        <li>Edukasi bahwa DM merupakan penyakit kronis yang dapat dikendalikan</li>
                                        <li>Dukungan keluarga dalam kepatuhan minum obat, pemantauan gula darah, dan pola hidup sehat</li>
                                        <li>Edukasi manajemen stres dan anjuran aktivitas fisik sesuai kemampuan</li>
                                        <li>Rujukan ke konseling bila ditemukan masalah psikologis atau penurunan kepatuhan terapi</li>
                                    </ul>
                                </li>
                                <li>5. Jadwal Pengawasan dan Pemantauan
                                    <p>Pasien dianjurkan untuk:</p>
                                    <ul>
                                        <li>Kontrol rutin ke Puskesmas sesuai jadwal yang ditentukan</li>
                                        <li>Evaluasi kadar gula darah, tekanan darah, berat badan, dan kepatuhan terapi secara berkala</li>
                                        <li>Pemeriksaan penunjang sesuai indikasi (HbA1c, fungsi ginjal, lipid)</li>
                                        <li>Penyesuaian terapi dilakukan berdasarkan hasil pemantauan klinis</li>
                                    </ul>
                                </li>
                                <li>6. Konseling Nutrisi untuk Mendukung Pengobatan
                                    <p>Pasien diberikan konseling nutrisi meliputi:</p>
                                    <ul>
                                        <li>Pengaturan pola makan seimbang sesuai kebutuhan kalori</li>
                                        <li>Pembatasan konsumsi gula sederhana dan makanan tinggi indeks glikemik</li>
                                        <li>Peningkatan konsumsi serat (sayur dan buah)</li>
                                        <li>Pembagian porsi makan teratur (3 kali makan utama dan 2–3 selingan)</li>
                                        <li>Edukasi label makanan dan pengaturan berat badan ideal</li>
                                    </ul>
                                </li>
                                <li>7. Rujukan Kembali Jika Terjadi Komplikasi
                                    <p>Pasien direncanakan untuk dirujuk ke fasilitas kesehatan rujukan apabila ditemukan:</p>
                                    <ul>
                                        <li>Kadar gula darah tidak terkendali meskipun terapi optimal</li>
                                        <li>Hipoglikemia atau hiperglikemia berulang</li>
                                        <li>Luka diabetik, gangguan penglihatan, gangguan neurologis (neuropati diabetikum) atau penurunan fungsi ginjal</li>
                                        <li>Tanda komplikasi akut atau kronis lainnya</li>
                                    </ul>
                                </li>
                            </ol>
                        </div>
