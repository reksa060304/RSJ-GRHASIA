                        <label item="item" class="margin-bottom" style="color: #000000; font-weight: normal;">
                            Saya menyadari bahwa tindakan kedokteran adalah berisiko, meliputi tindakan medis berupa preventif, diagnostik, terapeutik atau rehabilitatif yang dilakukan
                            oleh dokter atau dokter gigi terhadap Pasien. <br>
                            Saya menyetujui segala pelayanan medis di RS Jiwa Grhasia sebagaimana sesuai dengan keadaan medis saya selama mendapatkan pelayanan medis
                            di RS Jiwa Grhasia. <br>
                            Saya dengan ini memberikan persetujuan (kecuali yang membutuhkan persetujuan khusus/tertulis) dengan tidak dapat ditarik kembali kepada RS Jiwa
                            Grhasia, dalam memberikan pelayanan medis, pemeriksaan fisik, yang dapat dilakukan oleh dokter atau perawat dan melakukan prosedur diagnostik atau
                            terapi dan tatalaksana sesuai pertimbangan dokter yang diperlukan atau disarankan pada pelayanan medis untuk saya. Hal ini mencakup seluruh
                            pemeriksaan dan prosedur diagnostik rutin, termasuk namun tidak terbatas pada x-ray, pemberian dan atau tindakan kedokteran serta penyuntikan
                            (intramuskular, intravena dan prosedur invasif lainnya) produk farmasi dan obat-obatan, pemasangan alat medis dan pengambilan darah untuk pemeriksaan
                            laboratorium atau pemeriksaan patologi yang dibutuhkan untuk pelayanan medis saya. <br>
                            Saya mempercayakan kepada semua tenaga kesehatan rumah sakit untuk memberikan perawatan, diagnostik dan terapi kepada saya sebagai pasien rawat
                            inap atau rawat jalan atau Instalasi Gawat Darurat (IGD), termasuk semua pemeriksaan penunjang, yang dibutuhkan untuk pengobatan dan tindakan yang
                            diperlukan.
                        </label>

                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">7. Mendapatkan hak lain sesuai dengan ketentuan peraturan perundangan-undangan.</u></b> </label>
                </div>

                <div class="grid_12" style="margin-top: 50px; text-align: center;">
                    <label item="item" class="margin-bottom" style="color: #000000; font-weight: bold">KEWAJIBAN PASIEN / KELUARGA</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">(sesuai pasal 277 Undang-Undang No.17 tahun 2023 tentang Kesehatan)</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 15px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">Dalam menerima pelayanan dari Rumah Sakit, Pasien mempunyai kewajiban :</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">1. Memberikan informasi yang lengkap dan jujur tentang masalah kesehatannya;</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">2. Mematuhi nasihat dan petunjuk Tenaga Medis dan Tenaga Kesehatan;</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">3. Mematuhi ketentuan yang berlaku pada Fasilitas Pelayanan Kesehatan;</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">4. Memberikan imbalan jasa atas pelayanan yang diterima.</u></b> </label>
                </div>

                <div class="grid_12" style="margin-top: 50px; text-align: center;">
                    <label item="item" class="margin-bottom" style="color: #000000; font-weight: bold">TANGGUNG JAWAB PASIEN / KELUARGA</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 15px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">Dalam menerima pelayanan dari Rumah Sakit, Pasien mempunyai tanggung jawab :</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">1. Mengajukan pertanyaan dan berpartisipasi aktif dalam diskusi pengambilan keputusan mengenai perawatan kesehatan
 pasien.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">2. Memberikan informasi yang lengkap dan akurat t entang kesehatan dan riwayat kesehatan , termasuk kondisi sekarang,
 masa lalu penyakit , rawat inap dan obat-obatan.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">3. Mendiskusikan masalah perawatan kesehatan, kekhawatiran dan kebutuhan pribadi dengan penyedia layanan kesehatan
 secara jujur dan untuk menginformasikan kepada penyedia layanan kesehatan tentang setiap perubahan kondisi yang
 terjadi.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">4. Tidak mengkonsumsi narkoba dan alkohol selama masa perawatan di rumah sakit.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">5. Bekerja sama dengan semua petugas kesehatan yang terlibat dalam perawatan dan berperilaku sopan dan hormat.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">6.  Menghormati hak penyedia layanan kesehatan dan bertukar informasi dengan cara yang tidak kasar baik secara fisik
 maupun lisan saat menerima perawatan.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">7.  Mengikuti instruksi perawatan kesehatan atau memberi tahu penyedia layanan kesehatan jika tidak dapat atau tidak
 mengikuti rencana perawatan.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">8. Menerima konsekuensi karena menolak perawatan atau tidak mengikuti rencana perawatan.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">9. Menghormati hak semua profesional perawatan kesehatan, karyawan dan pasien lain. </u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">10. Menepati semua janji pertemuan yang dijadwalkan untuk memastikan bahwa semua pasien dilayani tepat waktu. Pasien
 bertanggung jawab untuk memberitahu 24 jam sebelumnya jika ada perubahan jadwal.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">11. Membayar layanan kesehatan yang diterima dan pasien menerima informasi terperinci mengenai tagihan.</u></b> </label>
                </div>
                <div class="grid_11 margin-top-20" style="text-align: justify; margin-top: 5px; margin-left: 10px; margin-top: 5px;">
                    <label item="item" style="color: #000000; font-weight: normal">12. Memberitahu penyedia layanan kesehatan terhadap perubahan keputusan mengenai orang yang ditunjuk dalam membuat
 keputusan perawatan kesehatan.</u></b> </label>
                </div>
                <div class="grid_12" style="text-align: left;">
                    <label item="item" class="margin-bottom" style="color: #000000; font-weight: bold">SAYA TELAH DIJELASKAN, MEMBACA, MEMAHAMI, dan SEPENUHNYA SETUJU terhadap pernyataan tersebut di atas</u></b> </label>
                </div>
