<style type="text/css">
    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }

    .k-treeview .k-item {
        background-color: #f9f9f9 !important;
    }
    #canvas-container {
    border: 2px dashed #ccc;
    width: 400px;
    height: 400px;
    position: relative;
    }

    canvas {
    border: 2px dashed #ccc;
    width: 100%;
    height: 100%;
    }

    .k-checkbox-label:before {
        margin: 1px 0px 0px 6px;
    }

    .k-button[disabled] {
        color: #fff;
        border-color: #41abf2;
        background-color: #41abf2;
    }

    .custom-button {
        margin: 0 0 10px;
        background: none;
        color: black;
        border-radius: 0.8em;
        border: 1px solid;
        background-color: white;
    }

    .k-edit,
    .k-i-download {
        background-position: -313px -221px;
    }

    a.k-button.k-button-icontext {
        min-width: 84px;
        background-color: #e0360b;
        border: none;
        margin: .1em;
    }

    k-button.k-button-icontext.k-grid-Cetak {
        min-width: 84px;
        background-color: #e0360b;
        border: none;
        margin: .1em;
    }

    .duplicateDate {
        background-color: red;
        border: 2px solid red !important;
    }

    span.errorCuti {
        text-align: center;
        width: 100%;
        padding: 10px 20px;
        color: red;
        font: italic 14px/30px arial, sans-serif;
    }

    .md-dialog-container,
    md-dialog {
        display: -webkit-box;
        display: -webkit-flex;
        display: flex;
        z-index: 200000;
    }

    hr {
        border: 1px dashed #cccccc;
        margin-top: 0;
        margin-bottom: 0;
        display: inline-block;
        width: 100%;
    }
    .green {
        background-color: #98FB98;
        /*color: #000000;*/
        font-weight: bold;
        color: black;
    }

    .red {
        background-color: #ff3860;
        color: #FFFFFF;
        /*font-weight: bold;*/
    }
    #movingImage {
    position: absolute;
    left: 100px;
    top: 100px;
    }

<div ng-show="cacheRM !=undefined || cachePARAM !=undefined">
    <div class="panel panel-default container_12">
        <div class="panel-heading"><span c-translate>Tanda Tangan Elektronik</span>
            <span class="icon fa fa-chevron-circle-left" ng-show="isShowNavAses" style="right:10px"
                ng-click="showNav()"></span>
            <span class="icon fa fa-chevron-circle-right" ng-show="!isShowNavAses" style="right:10px"
                ng-click="showNav()"></span>
        </div>
        <div class="panel-body">
            <div class="grid_12" ng-show="cachePARAM != undefined">
                <div class="grid_12 borderBox containerBorderBox">
                    <div class="grid_2">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Dokter"></label>
                        </div>
                        <div class="clear"></div>
        
                        <div class="grid_12">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.qdokter"
                                k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
                                k-auto-bind="false" k-data-source="listPegawai" disabled />
                        </div>
                    </div>
                    <div class="grid_2">
                        <div class="grid_12">
                            <label c-label item="item">No Registrasi</label>
                        </div>
                        <div class="clear"></div>
            
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.qnoreg"
                                ng-keypress="($event.which == 13)? SearchData():item.qnoreg" />
                        </div>
                    </div>
                    <div class="grid_1">
                        <div class="grid_12">
                            <label c-label item="item">No RM</label>
                        </div>
                        <div class="clear"></div>
            
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.qnocm"
                                ng-keypress="($event.which == 13)? SearchData():item.qnocm" />
                        </div>
                    </div>
                    <div class="grid_2">
                        <div class="grid_12">
                            <label c-label item="item">Nama Pasien</label>
                        </div>
                        <div class="clear"></div>
            
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.qnama"
                                ng-keypress="($event.which == 13)? SearchData():item.qnama" />
                        </div>
                    </div>
        
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Periode"></label>
                        </div>
                        <div class="clear"></div>
        
                        <div class="grid_12">
                            <div class="grid_6 padDatePicker">
                                <input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker k-max="now"
                                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
                            </div>
        
                       
                            <div class="grid_6 padDatePicker">
                                <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
                                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                            </div>
                            <div class="clear"></div>
                        </div>
                    </div>
        
                    <div class="grid_1">
                        <div class="grid_12">
                            <label>&nbsp;</label>
                        </div>
                        <div class="clear"></div>
        
                        <div class="grid_12">
                            <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()"> <i
                                    class="fa fa-search"></i>Cari</button>
                        </div>
                    </div>
        
                </div>
            </div>
            <div class="grid_12">
                <div ng-cloak>
                    <md-content>
                        <md-tabs md-dynamic-height md-border-bottom md-selected="myVar">
                            <md-tab label="List Dokumen">
                                <md-content class="md-padding">
                                    <div class="grid_12">
                                        <div class="grid_12 borderBox">
                                            <kendo-grid id="Grid" data-source="dataDaftar" options="columnDaftar"
                                                k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                                                k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)">
                                            </kendo-grid>

                                        </div>
                                        <!-- <div class="grid_12">
                                            <div class="grid_10"></div>
                                           
                                            <div class="grid_2">
                                                <button class="btnTemplate1" style="margin-left: 0;" ng-click="inputBaru()"><i
                                                        class="fa fa-plus-circle"></i>Upload</button>
                                           
                                            </div>
                                           
                                        </div> -->
                                    </div>
                                </md-content>
                            </md-tab>
                        </md-tabs>
                    </md-content>
                </div>
            </div>
            <div class="grid_12" style="margin-top:60px">
                <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
            </div>
        </div>
    </div>
</div>
<div kendo-window="popUpFile" k-title="'Upload File'" k-width="800" k-visible="false" k-on-open="win2visible = true"
    k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <fieldset>
            <legend><label c-label item="item"> Dokumen</label></legend>

            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Pegawai</label>
                </div>
                <div class="grid_9">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.pegawai"
                        k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listPegawai" k-on-change="changeTTD(item.pegawai)" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3" style=" margin-top: 10px;">
                    <label c-label item="item">NIK</label>
                </div>
                <div class="grid_7">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nik" />
                </div>
                <div class="grid_2" style="margin-top: 5px;">
                    <button class="k-button k-button-icontext k-primary k-grid-update" 
                        ng-click="cekUser()" id="btnSimpanCek"><span class="k-icon k-update"></span>Cek User</button>
                </div>
            </div>

            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Nama Dokumen</label>
                </div>
                <div class="grid_9">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namadokumen" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">No EMR</label>
                </div>
                <div class="grid_9">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nomoremr" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Dokumen</label>
                </div>
                <div class="grid_9">
                    <form method="post" enctype="multipart/form-data" id="formFile">
                        <input type="file" id="filePasien" accept="application/pdf" />
                    </form>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <label c-label item="item">File Tanda Tangan (optional)</label>
                </div>
                <div class="grid_9">
                    <form method="post" enctype="multipart/form-data" id="formFile2">
                        <input type="file" id="fileTTD" accept=".png,.jpg,.jpeg" />
                    </form>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <label c-label item="item">Link QR</label>
                </div>
                <div class="grid_9">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.linkQR"
                        placeholder="" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3">
                    <label c-label item="item">Keterangan</label>
                </div>
                <div class="grid_9">
                    <textarea class="k-textbox" style="height: 76px; width: 100%; resize: none;"
                        ng-model="item.reason"></textarea>
                </div>
            </div>
        </fieldset>

        <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
            <button class="k-button k-button-icontext k-primary k-grid-update" ng-disabled="disabledSimpan"
                ng-click="Save()" id="btnSimpan"><span class="k-icon k-update"></span>Simpan</button>
            <button class="k-button  k-button-icontext" ng-disabled="disabledBatal" ng-click="batal()"
                id="btnBatal"><span class="k-icon k-cancel"></span>Batal</button>
        </div>

    </div>
</div>

<div kendo-window="popUp2" k-title="'Detail'" k-width="1200" k-visible="false" k-on-open="win2visible = true"
    k-on-close="win2visible = false">
    <div class="panel panel-default container_12">

        <md-content class="md-padding">
            <div class="grid_12">
                <div class="grid_6">
                    <div class="grid_6">
                        <label c-label item="item">Summary</label>
                    </div>
                    <div class="grid_6">
                        <label>: {{ verify.summary }} </label>
                    </div>
                </div>
                <div class="grid_6">
                    <div class="grid_6">
                        <label c-label item="item">Notes</label>
                    </div>
                    <div class="grid_6">
                        <label>: {{ verify.notes}}</label>
                    </div>
                </div>
            </div>
            <hr>
            <div class="grid_12">
                <fieldset>
                    <legend><label c-label item="item"> Info Signer</label></legend>
                    <div class="grid_12">
                        <div class="grid_6">
                            <div class="grid_6">
                                <label c-label item="item">Issuer DN</label>
                            </div>
                            <div class="grid_6">
                                <label>: {{ verify.details[0].info_signer.issuer_dn}}</label>
                            </div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6">
                                <label c-label item="item">Signer Cert Validity </label>
                            </div>
                            <div class="grid_6">
                                <label>: {{ verify.details[0].info_signer.signer_cert_validity}}</label>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="grid_12">
                        <div class="grid_6">
                            <div class="grid_6">
                                <label c-label item="item">Signer Name </label>
                            </div>
                            <div class="grid_6">
                                <label>: {{ verify.details[0].info_signer.signer_name}}</label>
                            </div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6">
                                <label c-label item="item">Signer DN </label>
                            </div>
                            <div class="grid_6">
                                <label>: {{ verify.details[0].info_signer.signer_dn}}</label>
                            </div>
                        </div>
                    </div>
                </fieldset>

            </div>
            <hr>
            <div class="grid_12">
                <fieldset>
                    <legend><label c-label item="item"> Signature Document </label></legend>
                    <div class="grid_12">
                        <div class="grid_6">
                            <div class="grid_6">
                                <label c-label item="item">Location</label>
                            </div>
                            <div class="grid_6">
                                <label>: {{ verify.details[0].signature_document.location}}</label>
                            </div>
                        </div>
                        <div class="grid_6">
                            <div class="grid_6">
                                <label c-label item="item">Signed in </label>
                            </div>
                            <div class="grid_6">
                                <label>: {{ verify.details[0].signature_document.signed_in}}</label>
                            </div>
                        </div>
                    </div>

                </fieldset>

            </div>
        </md-content>

    </div>
</div>
<div kendo-window="popUpk" k-title="'Koordinat TTD'" k-width="1200" k-visible="false" k-on-open="win2visible = true"
    k-on-close="win2visible = false">
    <div class="panel panel-default container_12">
        <div class="grid_12">
            <div class="grid_12">
                <div class="grid_12">
                    <label c-label item="item">Halaman</label>
                </div>
                <div class="grid_6">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.page" k-data-text-field="'page'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listPage"
                        k-on-change="changePage(dataItem,item.page)" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Ukuran QRcode</label>
                    </div>
                    <div class="grid_6">
                        <input kendo-slider="" k-min="10" k-max="500" k-ng-model="item.sizeWidth" style="width: 100%;"
                            id="imageWidthSlider" />
                    </div>
                    <div class="grid_3">
                        <input c-text-box class="k-textbox" type="text" ng-model="item.sizeWidth" id="imageWidthInput"
                        min="10" max="500">
                    </div>
                    <div class="grid_3">
                        <input c-text-box class="k-textbox" type="text" ng-model="item.sizeHeight" id="imageHeightInput"
                            min="10" max="500">
                    </div>
                </div>
                <div class="grid_12" ng-hide="true">
                    <label c-label item="item">Height</label>
                    <input kendo-slider="" k-min="10" k-max="500" k-ng-model="item.sizeHeight" style="width: 50%;"
                        id="imageHeightSlider" />
                </div>
            </div>
            
        </div>
        <div class="grid_12">
            <div class="grid_12" >
                <img id="movingImage" src="images/contoh_ttd.png" alt="Gambar">
            </div>
            <div class="grid_12">
                <canvas id="pdfCanvas" width="1200" height="450"></canvas>
            </div>
        </div>
        
        <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="cekDulu()"
            id="btnSimpanCek"><span class="k-icon k-update"></span>OK!!!</button>
            <!-- <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="barcode()"
                id="btnSimpanCek"><span class="k-icon k-update"></span>BARCODE</button> -->
    </div>
</div>

    k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <fieldset>
            <legend><label c-label item="item"> Dokumen</label></legend>

            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Pegawai</label>
                </div>
                <div class="grid_9">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.pegawai"
                        k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listPegawai" k-on-change="changeTTD(item.pegawai)" disabled/>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3" style=" margin-top: 10px;">
                    <label c-label item="item">NIK</label>

                <div class="grid_7">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nik" />

                    <button class="k-button k-button-icontext k-primary k-grid-update" 
                        ng-click="cekUser()" id="btnSimpanCek"><span class="k-icon k-update"></span>Cek User</button>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Pass Phrase</label>
                </div>
                <div class="grid_9">
                    <input c-text-box type="password" filter="" class="k-textbox" ng-model="item.passphrase" />

            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Nama Dokumen</label>
                </div>
                <div class="grid_9">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namadokumen" />

            </div>
            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">No EMR</label>

                <div class="grid_9">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nomoremr" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Dokumen</label>
                </div>
                <div class="grid_9">
                    <div class="grid_4" style="margin-top: 5px;">
                        <button class="k-button k-button-icontext k-primary success k-grid-update"

                    </div>
                </div>

            <div class="grid_12">
                <div class="grid_3"  style=" margin-top: 10px;">
                    <label c-label item="item">Halaman</label>

                <div class="grid_9">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.page"
                        k-data-text-field="'page'" k-data-value-field="'id'" k-filter="'contains'"

            <div class="grid_12">
                <div class="grid_3">

                    <textarea class="k-textbox" style="height: 76px; width: 100%; resize: none;"

        <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">

                id="btnBatal2"><span class="k-icon k-cancel"></span>Batal</button>

    </div>
</div>
