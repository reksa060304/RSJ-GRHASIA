                <fieldset>
                   
                  
                    <div class="grid_12" style="text-align:justify;">
                       <b>1. PERSETUJUAN ASUHAN KESEHATAN</b> <br>
                        Saya menyadari bahwa tindakan kedokteran adalah berisiko, meliputi tindakan medis berupa preventif, diagnostik, terapeutik atau rehabilitatif yang dilakukan oleh dokter atau dokter gigi terhadap Pasien.<br>
                       Saya menyetujui segala pelayanan medis di RS Jiwa Grhasia sebagaimana sesuai dengan keadaan medis saya selama mendapatkan pelayanan medis di RS Jiwa Grhasia.<br>
                       Saya dengan ini memberikan persetujuan (kecuali yang membutuhkan persetujuan khusus/tertulis) dengan tidak dapat ditarik kembali kepada RS Jiwa
Grhasia, dalam memberikan pelayanan medis, pemeriksaan fisik, yang dapat dilakukan oleh dokter atau perawat dan melakukan prosedur diagnostik atau
terapi dan tatalaksana sesuai pertimbangan dokter yang diperlukan atau disarankan pada pelayanan medis untuk saya. Hal ini mencakup seluruh
pemeriksaan dan prosedur diagnostik rutin, termasuk namun tidak terbatas pada x-ray, pemberian dan atau tindakan kedokteran serta penyuntikan
(intramuskular, intravena dan prosedur invasif lainnya) produk farmasi dan obat-obatan, pemasangan alat medis dan pengambilan darah untuk pemeriksaan laboratorium atau pemeriksaan patologi yang dibutuhkan untuk pelayanan medis saya.<br>
Saya mempercayakan kepada semua tenaga kesehatan rumah sakit untuk memberikan perawatan, diagnostik dan terapi kepada saya sebagai pasien rawat
inap atau rawat jalan atau Instalasi Gawat Darurat (IGD), termasuk semua pemeriksaan penunjang, yang dibutuhkan untuk pengobatan dan tindakan yang diperlukan.<br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>2. KEJADIAN TIDAK TERDUGA / DIHARAPKAN.</b> <br> Saya mengerti dan menyadari bahwa dalam tindakan kedokteran dapat terjadi adanya kejadian tidak terduga/diharapkan (unanticipated outcome) yang dapat
                        merupakan efek samping dari tindakan kedokteran yang tidak dapat diduga sebelumnya (termasuk antara lain, namun tidak terbatas pada Steven Johnson Syndrome dan syok anafilaktik).  <br>
                        Saya mengerti bahwa hasil asuhan dan pengobatan termasuk kejadian yang tidak terduga/diharapkan akan diberitahukan kepada saya dan keluarga oleh Dokter Penanggung Jawab Pasien (DPJP). <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>3. PENETAPAN PIHAK YANG DIIJINKAN.</b> <br> Saya telah mendapat ijin dari pasien/penanggung jawab pasien untuk berpartisipasi dalam pengambilan keputusan terkait perawatan di RS Jiwa Grhasia. <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>4. RUMAH SAKIT LAYANAN PENDIDIKAN.</b> <br> Saya mengetahui bahwa Rumah Sakit Jiwa Grhasia merupakan Rumah Sakit yang digunakan untuk pendidikan dan praktik klinik mahasiswa kedokteran
                        dan profesi kesehatan lainnya. Untuk itu, saya menyetujui mereka berpartisipasi dalam proses perawatan pasien sepanjang dibawah supervisi Penanggung Jawab Pasien yaitu dokter, perawat dan tenaga kesehatan lain. Hal ini dikecualikan bagi pasien kelas VIP.<br> <br>
                    </div>
                   

                </fieldset>

                <fieldset>
                    <div class="grid_12 margin-top-30 text-center">
                        <label c-label item="item" font size=""> <u><h2>TATA TERTIB DAN PERATURAN RUMAH SAKIT</h2></u></label>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>1. HAK, KEWAJIBAN, DAN TANGGUNG JAWAB SEBAGAI PASIEN.</b> Dengan menandatangani dokumen ini saya, pasien atau penanggung jawab, wali
                        ataupun keluarga yang menandatangani dokumen ini untuk dan atas nama saya menyatakan bahwa telah memperoleh dan telah menerima semua
                        informasi mengenai hak-hak, kewajiban dan tanggung jawab Pasien pada saat proses pendaftaran Pasien dan selama mendapatkan pelayanan medis di RS Jiwa Grhasia, antara lain, hak-hak dan kewajiban Pasien sebagaimana terdapat pada halaman belakang persetujuan umum ini.<br> <br>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        <b>2. AKSES INFORMASI KESEHATAN. </b>Saya dengan ini memberikan persetujuan kepada RS Jiwa Grhasia untuk memberikan informasi tentang hal-hal yang
                        berkaitan dengan kesehatan saya kepada penanggung jawab, keluarga atau pihak yang menjamin biaya perawatan saya di RS Jiwa Grhasia, kepada (tulis nama, minimal 2) :
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">a.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004464]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">b.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004465]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">c.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004466]"
                        style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <br> <br><b>3. RAHASIA KEDOKTERAN.</b> Saya setuju RS Jiwa Grhasia menjamin rahasia kedokteran saya dan hanya menggunakannya untuk kepentingan perawatan
                            atau pengobatan, penagihan asuransi, pendidikan maupun penelitian, kecuali saya mengungkapkan sendiri atau orang lain / pihak lain yang saya beri kuasa untuk itu.<br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                    <b>4. PRIVASI. </b>Apabila saya memerlukan hal-hal yang menyangkut privasi saya sebagai pasien, saya menyampaikan kepada staf RS Jiwa Grhasia.<br> <br>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        <b>5. BARANG PRIBADI.</b> Saya menyatakan bahwa RS Jiwa Grhasia telah menyarankan untuk tidak membawa barang-barang berharga (seperti perhiasan,
                        elektronik, dll.). Dalam hal barang-barang berharga tersebut tetap dibawa ke lingkungan RS Jiwa Grhasia oleh saya atau pihak manapun, maka RS Jiwa Grhasia tidak akan bertanggung jawab atas kehilangan, kerusakan atau pencurian atas barang berharga tersebut. <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                       <b>6. PENGAJUAN KELUHAN. </b> Saya dengan ini menyatakan bahwa saya telah menerima informasi dan telah mengerti tata cara pengajuan dan tindak lanjut bila ada keluhan saya sebagai pasien terkait pelayanan yang diberikan. Saya setuju untuk mengikuti tata cara pengajuan keluhan sesuai dengan prosedur yang
                        ada. RS Jiwa Grhasia tidak wajib menindak-lanjuti keluhan saya apabila tidak diajukan sesuai dengan prosedur yang berlaku dan tidak wajib untuk bertanggung jawab atas setiap kerugian dalam bentuk apapun yang timbul dari atau sehubungan dengan keluhan yang tidak diajukan sesuai prosedur.  <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>7. KEWAJIBAN PEMBAYARAN. </b> Dengan ini saya atau penanggung jawab, wali ataupun keluarga saya menyatakan setuju bahwa sesuai dengan
                        pertimbangan pelayanan yang diberikan kepada saya, maka saya wajib untuk melakukan pembayaran atas seluruh biaya pelayanan, yang akan ditentukan berdasarkan acuan biaya dan ketentuan yang ditetapkan oleh RS Jiwa Grhasia.<br>
                        Apabila asuransi kesehatan swasta atau program pemerintah menanggung pembiayaan atas pelayanan kesehatan terhadap saya, saya dengan ini
                        memberikan kewenangan kepada RS Jiwa Grhasia tanpa dapat dicabut kembali untuk memberi tagihan kepada asuransi terkait atas seluruh pelayanan
                        dan tindakan kedokteran yang telah dilakukan. Tanggungan asuransi dari saya mungkin akan menyatakan bahwa sebagian pembayaran tetap menjadi
                        tanggung jawab pribadi dari saya atau tidak ditanggung oleh asuransi tersebut, oleh karenanya RS Jiwa Grhasia berhak untuk memberi tagihan atas biaya
                        tagihan yang tidak ditanggung tersebut dan dengan ini saya atau penanggung jawab, wali ataupun keluarga saya setuju untuk bertanggung jawab membayar biaya tagihan tersebut. <br> 
                        Saya dengan ini juga memberikan persetujuan kepada RS Jiwa Grhasia untuk dapat memberikan rahasia kedokteran atas Rekam Medis saya kepada perusahaan asuransi terkait sesuai dengan keperluan penagihan tersebut. <br>
                        Apabila di kemudian hari saya tidak lagi ditanggung oleh asuransi, maka saya atau penanggung jawab, wali ataupun keluarga saya dengan ini setuju untuk secara pribadi bertanggung jawab dalam membayar seluruh biaya pelayanan dan tindakan kedokteran dari RS Jiwa Grhasia. <br><br>

                    </div>

                <fieldset>
                    <div class="grid_12 margin-top-30 text-center">
                        <label c-label item="item" font size=""> <u><h2>HAK PASIEN / KELUARGA</h2></u></label>
                    </div>
                    <div class="grid_12 text-left ">
                        (sesuai pasal 32 UU No.44 tahun 2009 tentang Rumah Sakit) <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        1. Memperoleh informasi mengenai tata tertib dan peraturan yang berlaku di Rumah Sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        2. Memperoleh informasi tentang hak dan kewajiban pasien. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        3. Memperoleh layanan yang manusiawi, adil, jujur, dan tanpa diskriminasi.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        4. Memperoleh layanan kesehatan yang bermutu sesuai dengan standar profesi dan standar prosedur operasional. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        5. Memperoleh layanan yang efektif dan efisien sehingga pasien terhindar dari kerugian fisik dan materi. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        6. Mengajukan pengaduan atas kualitas pelayanan yang didapatkan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        7. Memilih dokter dan kelas perawatan sesuai dengan keinginannya dan peraturan yang berlaku di Rumah Sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        8. Meminta konsultasi tentang penyakit yang dideritanya kepada dokter lain yang mempunyai Surat Ijin Praktek (SIP)
                        baik di dalam maupun di luar Rumah Sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        9. Mendapatkan privasi dan kerahasiaan penyakit yang diderita termasuk data-data medisnya.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        10. Mendapat informasi yang meliputi diagnosis dan tata cara tindakan medis, tujuan tindakan medis, alternatif tindakan,
                        risiko dan komplikasi yang mungkin terjadi, dan prognosis terhadap tindakan yang dilakukan serta perkiraan biaya pengobatan.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        11. Memberikan persetujuan atau menolak atas tindakan yang akan dilakukan oleh tenaga kesehatan terhadap yang dideritanya.  <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        12. Didampingi keluarganya dalam keadaan kritis. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        13. Menjalankan ibadah sesuai agama atau kepercayaan yang dianutnya selama itu tidak mengganggu pasien lainnya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        14. Memperoleh keamanan dan keselamatan dirinya selama dalam perawatan di Rumah Sakit.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        15. Mengajukan usul, saran perbaikan atas perlakuan Rumah Sakit terhadap dirinya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        16. Menolak bimbingan rohani yang tidak sesuai dengan agama dan kepercayaan yang dianutnya.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        17. Menggugat atau menuntut Rumah Sakit apabila Rumah Sakit diduga memberikan pelayanan yang tidak sesuai dengan standar baik secara perdata maupun pidana, dan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        18. Mengeluhkan pelayanan Rumah Sakit yang tidak sesuai dengan standar pelayanan melalui media cetak dan elektronik sesuai dengan ketentuan peraturan perundang-undangan. <br> <br>
                    </div>

                </fieldset>
                <fieldset>
                    <div class="grid_12 margin-top-30 text-center">
                        <label c-label item="item" font size=""> <u><h2>KEWAJIBAN PASIEN DAN KELUARGA</h2></u></label>
                    </div>
                    <div class="grid_12 text-left ">
                        (sesuai Pasal 26 Peraturan Menteri Kesehatan RI No 4 tahun 2018 tentang Kewajiban Rumah Sakit dan Kewajiban
Pasien) <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        Dalam menerima pelayanan dari Rumah Sakit, Pasien mempunyai kewajiban : <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        1. Mematuhi peraturan yang berlaku di Rumah Sakit Jiwa Grhasia. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        2. Menggunakan fasilitas rumah sakit secara bertanggungjawab. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        3. Menghormati hak-hak pasien lain, pengunjung dan hak tenaga kesehatan serta petugas lainnya yang bekerja dirumah sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        4. Memberikan informasi yang jujur, lengkap, dan akurat sesuai kemampuan dan pengetahuannya tentang masalah kesehatannya.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        5. Memberikan informasi mengenai kemampuan finansial dan jaminan kesehatan yang dimilikinya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        6. Mematuhi rencana terapi yang direkomendasikan oleh Tenaga Kesehatan di rumah sakit dan disetujui oleh yang bersangkkutan setelah mendapatkan penjelasan sesuai ketentuan peraturan perundang-undangan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        7. Menerima segala konsekuensi atas keputusan pribadinya untuk menolak rencana terapi yang direkomendasikan
                        oleh Tenaga Kesehatan dan/atau tidak mematuhi petunjuk yang diberikan oleh Tenaga Kesehatan dalam rangka penyembuhan penyakit atau masalah kesehatannya dan<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        8. Memberikan imbalan jasa atas pelayanan yang diterima. <br> <br>
                    </div>

                </fieldset>
                <fieldset>
                    <div class="grid_12 margin-top-30 text-center">
                        <label c-label item="item" font size=""> <u><h2>TANGGUNG JAWAB PASIEN / KELUARGA</h2></u></label>
                    </div>
                    <div class="grid_12 text-left ">
                        Dalam menerima pelayanan dari Rumah Sakit, Pasien mempunyai tanggung jawab : <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        1. Mengajukan pertanyaan dan berpartisipasi aktif dalam diskusi dan keputusan mengenai perawatan kesehatan pasien. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        2. Memberikan informasi yang lengkap dan akurat tentang kesehatan dan riwayat kesehatan pasien, termasuk kondisi sekarang, penyakit masa lalu, riwayat rawat inap dan pengobatan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        3. Mendiskusikan masalah perawatan kesehatan, kekhawatiran, dan kebutuhan pribadi pasien dengan penyedia
                        layanan kesehatan secara jujur dan beri tahu penyedia layanan kesehatan tentang setiap perubahan yang terjadi pada kesehatan pasien.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        4. Bekerja sama dengan semua petugas kesehatan yang terlibat dalam perawatan pasien dan berperilaku sopan dan saling menghormati. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        5. Menghormati hak penyedia layanan kesehatan dan untuk bertukar informasi dengan cara yang baik dan tidak melakukan kekerasan, secara fisik maupun verbal saat dalam perawatan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        6. Mengikuti instruksi asuhan kesehatan atau beri tahu staf kami jika pasien tidak dapat atau tidak bersedia mengikuti rencana asuhan.<br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        7. Menerima konsekuensi karena menolak rencana asuhan atau tidak mengikuti rencana asuhan menghormati hak dan privasi semua profesional pemberi asuhan, karyawan rumah sakit, dan pasien lain. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        8. Memberitahu staf rumah sakit bila merubah keputusan persetujan atas rencana asuhan yang telah disetujui. <br> <br>
                    </div>

                </fieldset>

        </div>
    </div>
