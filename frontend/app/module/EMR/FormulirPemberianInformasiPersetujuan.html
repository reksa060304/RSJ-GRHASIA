                <fieldset>
                    <div class="grid_12 text-left ">
                      Dengan ini menyatakan dengan sesungguhnya bahwa :   <br> <br>
                    </div>
                  
                    <div class="grid_12" style="text-align:justify;">
                       <b>1. HAK DAN KEWAJIBAN SEBAGAI PASIEN.</b> Dengan menandatanagani dokumen ini. Saya mengaku sudah mendapat informasi tentang HAK
                      dan Kewajiban Pasien serta Peraturan yang berlaku di Rumah Sakit Jiwa Grhasia yang diberikan oleh petugas Rumah Sakit dan saya telah memahami,
                      menerima dan menyetujui.   <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>2. PERSETUJUAN PELAYANAN KESEHATAN.</b> Saya menyetujui dan memberikan persetujuan untuk dirawat di Rumah Sakit Jiwa Grhasia dan dengan ini
                        saya meminta dan memberikan kuasa kepada Rumah Sakit Jiwa Grhasia, Dokter, Perawat dan Petugas Kesehatan lainnya di Rumah Sakit Grhasia untuk memberikan asuhan Medis
                        dan keperawatan, termasuk dimasukan tindakan atau prosedur diagnostik seperti pemeriksaaan radiologi, EKG, EEG, dan pengambilan darah untuk pemeriksaan laboratorium,
                        pemberian dan atau penyuntikan produk farmasi dan obat-obatan, serta pemasangan alat kesehatan (kecuali yang membutuhkan persetujuan khusus)   <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>3. AKSES INFORMASI KESEHATAN.</b> Saya memberikan kuasa kepada setiap dan seluruh petugas kesehatan yang merawat pasien untuk memeriksa dan atau memberitahukan 
                        informasi kesehatan pasien serta melakukan konsul kepada pemberi kesehatan lain yang dirasa perlu dalam melakukan perawatan pasien serta melakukan konsul kepada pemberi
                        kesehatan lain yang dirasa perlu dalam melakukan perawatan pasien dan saya menyetujui atau menerima diagnosis, terapi dan segala tindakan dalam rangka upaya penyembuhan.   <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>4. RAHASIA MEDIS.</b> Saya menyetujui dan memberi kuasa kepada Rumah Sakit Jiwa Grhasia untuk menjaga privasi dan kerahasiaan penyakit pasien selama dalam masa perawatannya serta menjamin
                        kerahasiaan informasi medis pasien untuk kepentingan perawatan, pengobatan dan pendidikan maupun penelitian dan saya menyetujui pelepasan informasi medis sesuai dengan Permenkes 
                        269 Tahun 2008 Pasal 10 Tentang Rekam Medis (kepentingan kesehatan pasien, penegakan hukum, penelitian, pendidikan, dan audit medis) dan keperluan klaim informasi.  <br> <br>
                    </div>
                    <div class="grid_12 text-left " style="text-align:justify;">
                        <b>KERAHASIAAN INFORMASI.</b> Saya memberi kuasa kepada Rumah Sakit Jiwa Grhasia untuk memberikan informasi tentang diagnosis, hasil pelayanan dan pengobatan saya selama dirawat kepada (tulis nama) :   <br>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                                <label c-label item="item" class="margin-bottom">a.</label>
                                <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004461]"
                                        style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                                <label c-label item="item" class="margin-bottom">b.</label>
                                <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004462]"
                                        style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">c.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004463]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        <b>PRIVASI.</b> Saya memberi kuasa kepada Rumah Sakit Jiwa Grhasia untuk menjaga privasi dan kerahasiaan penyakit saya selama dalam perawatan.
                        Saya menginginkan / tidak menginginkan privasi khusus pada saat :
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">a.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004464]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">b.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004465]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">c.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004466]"
                        style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        <b>5. RUMAH SAKIT LAYANAN PENDIDIKAN.</b>Saya mengetahui bahwa Rumah Sakit Jiwa Grhasia merupakan Rumah Sakit yang digunakan untuk pendidikan dan praktik klinik
                        mahasiswa kedokteran dan profesi kesehatan lainnya. Untuk itu, saya menyetujui mereka berpartisipasi dalam perawatan pasien sepanjang dibawah supervisi Penanggung Jawab
                        Pasien yaitu dokter, perawat, dan tenaga kesehatan lain. Hal ini dikecualikan bagi pasien kelas VIP. <br> <br>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        <b>6. BARANG PRIBADI.</b>Saya memahami dan akan memenuhi peraturan untuk tidak membawa barang berharga yang tidak diperlukan (perhiasan, elektronik, dll) dan jika terjadi kehilangan, 
                        pencurian atau kerusakan maka Rumah Sakit Jiwa Grhasia tidak bertanggung jawab terhadap hal tersebut. <br> <br>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        <b>7. PENGAJUAN KELUHAN.</b>Saya menyatakan bahwa telah menerima informasi tentang adanya tata cara mengajukan dan mengatasi keluhan terkait pelayanan medik yang diberikan
                        terhadap diri saya. Saya setuju untuk mengikuti tata cara mengajukan keluhan sesuai prosedur yang ada. <br> <br>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        8. Saya menyetujui untuk melunasi seluruh biaya perawatan, obat obatan dan tindakan lain (sesuai jenis cara bayarnya) maupun selisih biaya jaminan kesehatan serta sanggup menerima 
                        kembali setelah pasien dapat dipulangakan dalam waktu secepatnya. <br> <br>
                    </div>
                    <div class="grid_12 text-left "  style="text-align:justify;">
                        9. Melalui dokumen ini, saya menegaskan kembali bahwa saya mempercayakan kepada semua Tenaga Kesehatan Rumah Sakit Jiwa Grhasia untuk memberikan perawatan, diagnostikdan terapi
                        kepada pasien Rawat Inap / Rawat Jalan / IGD, semua pemeriksaan penjang yang dibutuhkan untuk pengobatan dan tindakan yang aman. <br> <br>
                    </div>

                </fieldset>


                <fieldset>
                    <div class="grid_12 margin-top-30 text-center">
                        <label c-label item="item" font size=""> <u><h2>HAK PASIEN</h2></u></label>
                    </div>
                    <div class="grid_12 text-left ">
                        1. Pasien berhak menerima informasi mengenai tata tertib dan peraturan yang berlaku di Rumah Sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        2. Pasien dapat memperoleh informasi tentang hak dan kewajiban pasien. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        3. Pasien dapat memperoleh layanan yang manusiawi, adil, jujur dan tanpa diskriminasi. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        4. Pasien berhak memperoleh layanan kesehatan yang bermutu sesuai dengan standar profesi dan standar prosedur operasional. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        5. Pasien berhak memperoleh layanan yang efektif. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        6. Pasien berhak mengajukan pengaduan atas kualitas pelayanan yang didapatkan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        7. Pasien berhak menerima dokter dan kelas perawatan sesuai dengan keinginannya dan peraturan yang berlaku di Rumah Sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        8. Pasien berhak meminta konsultasi tentang penyakit yang dideritanya kepada dokter lain <i>(second opinion)</i> yang mempunyai Surat Ijin Praktek (SIP) baik didalam maupun diluar Rumah Sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        9. Pasien berhak mendapatkan privasi dan kerahasiaan penyakit yang diderita termasuk data-data medisnya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        10. Pasien berhak mendapakan informasi yang meliputi diagnosis dan tata cra tindakan medis, tujuan tindakan medis, alternatif tidnakan, resiko dan komplikasi yang mungkin terjadi dan prognosis terhadap tindakan yang dilakukan serta perkiraan biaya pengobatan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        11. Pasien berhak memberikan persetujuan atau menolak atas tindakan yang akan dilakukan oleh tenaga kesehatan terhadap penyakit yang dideritanya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        12. Pasien berhak didampingi keluarganya dalam keadaan kritis. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        13. Pasien berhak menjalankan ibadah sesuai agama atau kepercayaan yang dianutnya selama hal itu tidak mengganggu pasien lainnya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        14. Pasien berhak memperolah keamanan dan keselamatan dirinya selama dalam perawatan di Rumah Sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        15. Pasien berhak mengajukan usul, saran, perbaikan atas perlakuan terhadap dirinya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        16. Pasien berhak menolak pelayanan bimbingan rohani yang tidak sesuai dengan agama dan kepercayaan yang dianutnya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        17.Pasien berhak menggugat dan/atau menuntut Rumah Sakit apabila Rumah Sakit diduga memberikan pelayanan yang tidak sesuai dengan standar baik secara perdata ataupun pidana. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        18. Pasien berhak mengeluhkan pelayanan Rumah Sakit yang tidak sesuai dengan standar pelayanan melalui media cetak dan elektronik sesuai dengan ketentuan peraturan perundang-undangan. <br> <br>
                    </div>

                </fieldset>
                <fieldset>
                    <div class="grid_12 margin-top-30 text-center">
                        <label c-label item="item" font size=""> <u><h2>KEWAJIBAN PASIEN DAN KELUARGA</h2></u></label>
                    </div>
                    <div class="grid_12 text-left ">
                        1. Mematuhi peraturan yang berlaku di rumah sakit. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        2. Menggunakan fasilitas rumah sakit secara bertanggung jawab. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        4. Memberikan informasi yang jujug, lengkap dan akurat sesuai kemampuan dan pengetahuannyang tentang masalah kesehatannya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        5. Memberikan informasi mengenai kemampuan finansial dan jaminan kesehatan yang dimilikinya. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        6. Mengetahui rencana terapi yang direkomendasikannya oleh tenaga kesehatan di Rumah Sakit dan disetujui oleh pasien yang bersangkutan setelah mendapatkan penjelasan sesuai ketentuan peraturan perundang-undangan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        7. Menerima segala konsekwensi atas keputusan pribadinya untuk menolak rencana terapi yang direkomendasikan oleh tenaga kesehatan dan/atau tidak mematuhi petunjuk yang diberikan oleh tenaga kesehatan dalam rangka penyembuhan penyakut atau masalah kesehatan. <br> <br>
                    </div>
                    <div class="grid_12 text-left ">
                        8. Memberikan imbalan jasa pelayanan yang diterima. <br> <br>
                    </div>

                </fieldset>
                <div class="grid_12 text-left ">
                   <b>Sumber </b> : UU Nomor 44 tahun 2009 tantang Rumah Sakit. Permenkes RI Nomor 4 Tahun 2018 tentang Kewajiban Rumah Sakit dan Kewajiban Pasien.
                </div>
