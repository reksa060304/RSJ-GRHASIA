                <fieldset>
                    <div class="grid_12 text-left ">
                      Dengan ini menyatakan dengan sesungguhnya bahwa :
                    </div>
                    <br>
                    <div class="grid_12 text-left ">
                       <b>1. HAK DAN KEWAJIBAN SEBAGAI PASIEN.</b> Dengan menandatanagani dokumen ini. Saya mengaku sudah mendapat informasi tentang HAK
                      dan Kewajiban Pasien serta Peraturan yang berlaku di Rumah Sakit Jiwa Grhasia yang diberikan oleh petugas Rumah Sakit dan saya telah memahami,
                      menerima dan menyetujui.
                    </div>
                    <div class="grid_12 text-left ">
                        <b>2. PERSETUJUAN PELAYANAN KESEHATAN.</b> Saya menyetujui dan memberikan persetujuan untuk dirawat di Rumah Sakit Jiwa Grhasia dan dengan ini
                        saya meminta dan memberikan kuasa kepada Rumah Sakit Jiwa Grhasia, Dokter, Perawat dan Petugas Kesehatan lainnya di Rumah Sakit Grhasia untuk memberikan asuhan Medis
                        dan keperawatan, termasuk dimasukan tindakan atau prosedur diagnostik seperti pemeriksaaan radiologi, EKG, EEG, dan pengambilan darah untuk pemeriksaan laboratorium,
                        pemberian dan atau penyuntikan produk farmasi dan obat-obatan, serta pemasangan alat kesehatan (kecuali yang membutuhkan persetujuan khusus)
                    </div>
                    <div class="grid_12 text-left ">
                        <b>3. AKSES INFORMASI KESEHATAN.</b> Saya memberikan kuasa kepada setiap dan seluruh petugas kesehatan yang merawat pasien untuk memeriksa dan atau memberitahukan 
                        informasi kesehatan pasien serta melakukan konsul kepada pemberi kesehatan lain yang dirasa perlu dalam melakukan perawatan pasien serta melakukan konsul kepada pemberi
                        kesehatan lain yang dirasa perlu dalam melakukan perawatan pasien dan saya menyetujui atau menerima diagnosis, terapi dan segala tindakan dalam rangka upaya penyembuhan. 
                    </div>
                    <div class="grid_12 text-left ">
                        <b>4. RAHASIA MEDIS.</b> Saya menyetujui dan memberi kuasa kepada Rumah Sakit Jiwa Grhasia untuk menjaga privasi dan kerahasiaan penyakit pasien selama dalam masa perawatannya serta menjamin
                        kerahasiaan informasi medis pasien untuk kepentingan perawatan, pengobatan dan pendidikan maupun penelitian dan saya menyetujui pelepasan informasi medis sesuai dengan Permenkes 
                        269 Tahun 2008 Pasal 10 Tentang Rekam Medis (kepentingan kesehatan pasien, penegakan hukum, penelitian, pendidikan, dan audit medis) dan keperluan klaim informasi.
                    </div>
                    <div class="grid_12 text-left ">
                        <b>KERAHASIAAN INFORMASI.</b> Saya memberi kuasa kepada Rumah Sakit Jiwa Grhasia untuk memberikan informasi tentang diagnosis, hasil pelayanan dan pengobatan saya selama dirawat kepada (tulis nama) :
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                                <label c-label item="item" class="margin-bottom">a.</label>
                                <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004353]"
                                        style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                                <label c-label item="item" class="margin-bottom">b.</label>
                                <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004353]"
                                        style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">c.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004353]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 text-left ">
                        <b>PRIVASI.</b> Saya memberi kuasa kepada Rumah Sakit Jiwa Grhasia untuk menjaga privasi dan kerahasiaan penyakit saya selama dalam perawatan.
                        Saya menginginkan / tidak menginginkan privasi khusus pada saat :
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">a.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004353]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">b.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004353]"
                                style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 margin-top-20 margin-bottom">
                        <label c-label item="item" class="margin-bottom">c.</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3004353]"
                        style="height: 20px; width: 50%; "/>
                    </div>
                    <div class="grid_12 text-left ">
                        <b>5. RUMAH SAKIT LAYANAN PENDIDIKAN.</b>Saya mengetahui bahwa Rumah Sakit Jiwa Grhasia merupakan Rumah Sakit yang digunakan untuk pendidikan dan praktik klinik
                        mahasiswa kedokteran dan profesi kesehatan lainnya. Untuk itu, saya menyetujui mereka berpartisipasi dalam perawatan pasien sepanjang dibawah supervisi Penanggung Jawab
                        Pasien yaitu dokter, perawat, dan tenaga kesehatan lain. Hal ini dikecualikan bagi pasien kelas VIP.
                    </div>
                    <div class="grid_12 text-left ">
                        <b>6. BARANG PRIBADI.</b>Saya memahami dan akan memenuhi peraturan untuk tidak membawa barang berharga yang tidak diperlukan (perhiasan, elektronik, dll) dan jika terjadi kehilangan, 
                        pencurian atau kerusakan maka Rumah Sakit Jiwa Grhasia tidak bertanggung jawab terhadap hal tersebut.
                    </div>
                    <div class="grid_12 text-left ">
                        <b>7. PENGAJUAN KELUHAN.</b>Saya menyatakan bahwa telah menerima informasi tentang adanya tata cara mengajukan dan mengatasi keluhan terkait pelayanan medik yang diberikan
                        terhadap diri saya. Saya setuju untuk mengikuti tata cara mengajukan keluhan sesuai prosedur yang ada.
                    </div>
                    <div class="grid_12 text-left ">
                        8. Saya menyetujui untuk melunasi seluruh biaya perawatan, obat obatan dan tindakan lain (sesuai jenis cara bayarnya) maupun selisih biaya jaminan kesehatan serta sanggup menerima 
                        kembali setelah pasien dapat dipulangakan dalam waktu secepatnya
                    </div>
                    <div class="grid_12 text-left ">
                        9. Melalui dokumen ini, saya menegaskan kembali bahwa saya mempercayakan kepada semua Tenaga Kesehatan Rumah Sakit Jiwa Grhasia untuk memberikan perawatan, diagnostikdan terapi
                        kepada pasien Rawat Inap / Rawat Jalan / IGD, semua pemeriksaan penjang yang dibutuhkan untuk pengobatan dan tindakan yang aman.
                    </div>

                </fieldset>

                    </div>
                    <div class="grid_12 text-left ">
                        5. Pasien berhak memperoleh layanan yang efektif
