<div class="grid_12">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <div class="panel-heading" c-translate> Surat Keterangan Pemeriksaan kesehatan Jiwa</div>
        </div>

        <div class="grid_12 margin-top-30">
            <div class="grid_3">
                <label c-label item="item">Yogyakarta, </label>
                <input style="width: 100%" k-ng-model="item.obj[3003951]" kendo-datetimepicker
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
            </div>
            <div class="grid_3">
                <label c-label item="item" class="margin-bottom">No. CM.RJP.02.003/20... </label>
                <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003950]" />
            </div>
        </div>
        
        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_12 margin-top-30 text-center">
                    <label c-label item="item"><u><h1>SURAT KETERANGAN PEMERIKSAAN KESEHATAN JIWA</h1></u></label>
                </div>
                <div class="grid_12">
                    <div class="grid_12 margin-top-10 text-center margin-bottom">
                        <label c-label item="item" class="margin-bottom">Nomor :</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003952]"
                            style="height: 30px; width: 30%; "/>
                    </div>
                    <div class="grid_12">
                        <label c-label item="item" class="margin-bottom">Yang bertandatangan dibawah ini, telah melakukan pemeriksaan psikiatrik pada tanggal : </label>
                        <input style="width: 20%" k-ng-model="item.obj[3003951]" kendo-datetimepicker
                        placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
                        <label c-label item="item" class="margin-bottom"><br>terhadap</label>
                    </div>
                </div>
                <div class="grid_12 margin-top-20 margin-bottom">
                    <label c-label item="item" class="margin-bottom">Nama :</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003957]"
                            k-data-source=""
                            style="height: 30px; width: 50%; "/>
                </div>
                <div class="grid_12 margin-top-20 margin-bottom">
                    <label c-label item="item" class="margin-bottom">Tempat/Tanggal Lahir :</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003958]"
                            style="height: 30px; width: 50%; "/>
                </div>
                <div class="grid_12 margin-top-20 margin-bottom">
                    <label c-label item="item" class="margin-bottom">Jenis Kelamin :</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003959]"
                            style="height: 30px; width: 50%; "/>
                </div>
                <div class="grid_12 margin-top-20 margin-bottom">
                    <label c-label item="item" class="margin-bottom">Pekerjaan :</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003960]"
                            style="height: 30px; width: 50%; "/>
                </div>
                <div class="grid_12 margin-top-20 margin-bottom">
                    <label c-label item="item" class="margin-bottom">Alamat :</label>
                    <textarea 
                        c-text-area 
                        type="input" 
                        filter="'string'" 
                        class="k-textbox" 
                        ng-model="item.obj[3003961]"
                        style="height: 55px; width: 100%; "/>
                    <div class="grid_12 margin-top-30 margin-bottom">
                        <label c-label item="item">
                            Dengan Hasil Pemeriksaan Kesehatan Jiwa pada saat ini :  
                        </label>
                        <div class="grid_2">
                            <input type="checkbox" class="k-checkbox" id="item.obj3003953"
                                ng-model="item.obj[3003953]">
                            <label class="k-checkbox-label" for="item.obj3003953">
                                &nbsp;<b>DITEMUKAN</b></label>
                        </div>
                        <div class="grid_2">
                            <input type="checkbox" class="k-checkbox" id="item.obj3003954"
                                ng-model="item.obj[3003954]">
                            <label class="k-checkbox-label" for="item.obj3003954">
                                &nbsp;<b>TIDAK DITEMUKAN</b></label>
                        </div>
                        <div class="grid_12">
                            <label c-label item="item"><br><br>TANDA DAN GEJALA GANGGUAN JIWA BERMAKNA YANG DAPAT MENGGANGGU AKTIVITAS KEHIDUPAN SEHARI HARI <br><br>
                            Demikian Surat Keterangan Pemeriksaan Kesehatan Jiwa ini dibuat untuk keperluan : </label>
                        </div>
                        <div class="grid_12 margin-top-30">
                            <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003955]"
                            style="height: 55px; width: 100%; "/>
                        </div>
                        <div class="grid_12 margin-top-30 margin bottom">
                            <label c-label item="item">dan tidak dapat digunakan untuk kepentingan hukum lainnya.</label>
                        </div>
                        <div class="grid_12">
                            <div class="grid_4 margin-top-30 text-center margin-bottom">
                                <label c-label item="item" c-label-text="Dokter yang memeriksa" />
                                <input style="width: 80%;" kendo-combo-box k-ng-model="item.obj[3003956]"
                                        k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                                        k-auto-bind="false" k-data-source="listPegawai" />
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>
    </div>
</div>

<div kendo-window="winDialog" k-title="'Pilih Pegawai'" k-width="400" k-height="120" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <label c-label item="item " c-label-text="pegawaiPenandaTangan "></label>
    <input style="width: 100%; " kendo-combo-box k-ng-model="item.pegawai" k-data-text-field="'text'"
        k-filter=" 'contains' " k-data-value-field=" 'value' " k-auto-bind="false " k-data-source="listPegawai" />
    <div class="clear">
        <button class="k-button" ng-click="savePengajuanTTE(item.pegawai)"
            style="float:right;margin-top:4%">Simpan</button>
    </div>
</div>

<div class="grid_12">
    <div ng-include='"../app/module/EMR/TemplateButtonDinamis" '></div>
</div>
