<style type="text/css">
    fieldset {
        border-radius: 5px;
        border: 1px solid #228be6;
    }

    .k-slider-horizontal {
        display: inline-block;
        /* float: left; */
        /* float: left; */
        width: 450px;
        height: 26px;
    }

    input[type="text"]::placeholder {
        /* Firefox, Chrome, Opera */
        text-align: right;
    }

    .k-slider {

        margin-left: 3%;
        margin-right: 3%;
        margin-top: 1%;
        margin-bottom: 5%;

    }

    .activeBtn {
        background-color: #10c4b2;

                                    {{jawab.caption}}
                                </div>
                                <div class="grid_6">
                                    <md-radio-group ng-model="item.obj[jawab.id]">
                                        <div layout="{{jawab.style}}">
                                            <md-radio-button ng-click="getSkor(jawab)"

                                        </div>
                                    </md-radio-group>
                                </div>
                            </div>

                                    </div>

                                    </div>
                                </div>
                            </div>
                            <!-- //end textbox -->

                            <!-- //label -->
                            <div class="{{jawab.style}}" ng-switch-when="datetime">

                                    <label c-label item="item">{{jawab.caption}}</label>
                                </div>
                                <div class="grid_12">
                                    <input style="width: 100%" k-ng-model="item.obj[jawab.id]" kendo-datetimepicker
                                        placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                                        parsedate="yyyy-MM-dd HH:mm" />
                                </div>
                            </div>

                            <div class="{{jawab.style}}" style="margin-top: 10px;" ng-switch-when="label">
                                <label>
                                    &nbsp;{{jawab.caption}}</label>
                            </div>
                            <div class="{{jawab.style}}" style="margin-top: 10px;" ng-switch-when="label_bold">
                                <label c-label item="item">
                                    &nbsp;{{jawab.caption}}</label>
                            </div>

                            <!-- //checkbox -->

                            <div class="{{jawab.style}}" ng-switch-when="checkbox">

                                    <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"

                                    <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                        &nbsp;{{jawab.caption}}</label>
                                </div>
                            </div>

                            <div class="{{jawab.style}}" ng-switch-when="textarea">
                                <div>
                                    <label c-label item="item">{{jawab.caption}}</label>
                                </div>
                                <div>
                                    <textarea style="width: 95%;height: 100px" c-text-area type="input"
                                        filter="'string'" class="k-textbox" ng-model="item.obj[jawab.id]" />
                                    </div>
                            </div>
                            <div class="{{jawab.style}}" ng-switch-when="combobox">

                                    <label c-label item="item">{{jawab.caption}}</label>
                                </div>
                                <div class="grid_12">
                                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[jawab.id]"
