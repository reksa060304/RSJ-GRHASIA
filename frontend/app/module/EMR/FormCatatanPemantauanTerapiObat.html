<div class="grid_12">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <div class="panel-heading" c-translate> Form Catatan Pemantauan Obat </div>
        </div>
        <div style="margin-top:10px">
            <div class="grid_12" style="margin-top: 20px">
                <table style="width:100%;color: #4c5356;">
                    <tr>
                        <th>
                            <div class="grid_12" style ="text-align: center;">
                                <b>Tanggal Jam</b>
                            </div>
                        </th>
                        <th>
                            <div class="grid_12" style ="text-align: center;">
                                <b>Pelaksanaan</b>
                            </div>
                        </th>
                        <th>
                            <div class="grid_12" style ="text-align: center;">
                                <b>Evaluasi</b>
                            </div>
                        </th>
                        <th>
                            <div class="grid_12 " style ="text-align: center;">
                                <b>Paraf Nama</b>
                            </div>
                        </th>
                    </tr>
                              
                    <tr>
                        <td>
                            <div class="grid_12">
                                <input style="width: 100%" k-ng-model="item.obj[3012250]" kendo-datetimepicker
                                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                                    parsedate="yyyy-MM-dd HH:mm" />
                            </div>
                        </td><td>
                            <div class="grid_12">
                                <label for="">
                                    &nbsp;Nama Obat :</label>
                                <label c-label item="item">
                                    <textarea style="width: 100%;height: 100px" c-text-area type="input"
                                                filter="'string'" class="k-textbox" 
                                                ng-model="item.obj[3012251]" />
                                </label>
                            </div>
                            <div class="grid_12">
                                <label for="">
                                    &nbsp;Efek Obat :</label>
                                <label c-label item="item">
                                    <textarea style="width: 100%;height: 100px" c-text-area type="input"
                                                filter="'string'" class="k-textbox" 
                                                ng-model="item.obj[3012252]" />
                                </label>
                            </div>
                            <div class="grid_12">
                                <label for="">
                                    &nbsp;Efek yang tidak diharapkan :</label>
                                <label c-label item="item">
                                    <textarea style="width:100%;height: 100px" c-text-area type="input"
                                                filter="'string'" class="k-textbox" 
                                                ng-model="item.obj[3012253]" />
                                </label>
                            </div>
                        </td>
                        <td style="vertical-align: top;">
                            <div class="grid_12">
                                <label for="">
                                    &nbsp;</label>
                                <label c-label item="item">
                                    <textarea style="width: 100%;height: 300px" c-text-area type="input"
                                                filter="'string'" class="k-textbox" 
                                                ng-model="item.obj[3012254]" />
                                </label>
                            </div>
                        </td>
                        <td style="vertical-align: top;">
                            <div class="grid_12 margin-bottom margin-top-30" style="margin-top: 100px;">
                                <label c-label item="item">Nama Perawat</label>
                                <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[3012255]"
                                    k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                                    k-auto-bind="false" k-data-source="listPegawai" />
                            </div>
                        </td>
                         
                    </tr>
                   
                </table>
            </div>
        </div>
    </div>
</div>
