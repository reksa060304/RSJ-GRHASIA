                    <div class="grid_12 margin-top-10 margin-bottom">
                        <div class="container-edukasi">
                            <p style="font-size: 1.2em; font-weight: bold; margin-bottom: 20px;">
                                Rekomendasi Edukasi dan Tindak Lanjut di Puskesmas</p>
                            <ol>
                                <li>1. Melanjutkan pengobatan anti hipertensi
                                    <p>Pasien diberikan edukasi yang jelas, konsisten, dan berkelanjutan mengenai pentingnya konsumsi obat antihipertensi setiap hari sesuai anjuran dokter, meskipun keluhan atau gejala telah berkurang atau tidak dirasakan.</p>
                                    <p>Ditekankan bahwa penghentian obat secara tiba-tiba dapat menyebabkan peningkatan tekanan darah dan risiko komplikasi serius.</p>
                                </li>
                                <li>2. Melakukan pemeriksaan tekanan darah secara rutin dan mandiri
                                    <p>Pasien dianjurkan untuk:</p>
                                    <ul>
                                        <li>Melakukan pemeriksaan tekanan darah secara rutin di Puskesmas sesuai jadwal kontrol</li>
                                        <li>Melakukan pengukuran tekanan darah secara mandiri di rumah bila memungkinkan</li>
                                        <li>Mencatat hasil pengukuran tekanan darah dalam buku kontrol untuk evaluasi pada kunjungan berikutnya</li>
                                        <li>Segera melapor ke tenaga kesehatan bila tekanan darah ≥ 140/90 mmHg secara berulang atau disertai keluhan</li>
                                    </ul>
                                </li>
                                <li>3. Penjelasan tentang pencegahan komplikasi
                                    <p>Pasien diberikan edukasi mengenai risiko komplikasi hipertensi seperti stroke, penyakit jantung, gagal ginjal, dan gangguan penglihatan, serta cara pencegahannya, meliputi:</p>
                                    <ol type="a">
                                        <li>a. Kepatuhan Minum Obat
                                            <p>Pasien diarahkan untuk:</p>
                                            <ul>
                                                <li>Sesuaikan waktu minum obat dengan rutinitas harian (misal: bersamaan dengan minum obat jiwa di pagi/malam hari).</li>
                                                <li>Meminum obat pada waktu yang sama setiap hari</li>
                                                <li>Tidak melewatkan dosis obat</li>
                                                <li>Jika lupa minum obat, segera minum begitu teringat. Jangan menggandakan dosis jika sudah mendekati waktu dosis berikutnya.</li>
                                                <li>Menggunakan pengingat (alarm HP atau kotak obat) bila diperlukan</li>
                                            </ul>
                                        </li>
                                        <li>b. Pengawasan Dosis Pemberian Obat
                                            <p>Pasien dan keluarga diberikan pemahaman untuk:</p>
                                            <ul>
                                                <li>Tidak mengubah dosis, jenis, atau menghentikan obat tanpa evaluasi dokter.</li>
                                                <li>Melaporkan efek samping obat yang dirasakan kepada tenaga kesehatan</li>
                                                <li>Membawa daftar obat yang dikonsumsi saat kontrol kesehatan</li>
                                            </ul>
                                        </li>
                                    </ol>
                                </li>
                                <li>4. Dukungan Psikososial
                                    <p>Pasien dan keluarga diberikan dukungan psikososial berupa:</p>
                                    <ul>
                                        <li>Edukasi bahwa hipertensi merupakan penyakit kronis yang dapat dikendalikan</li>
                                        <li>Dukungan keluarga dalam pengawasan minum obat dan pola hidup sehat</li>
                                        <li>Anjuran mengelola stres melalui aktivitas relaksasi, ibadah, olahraga ringan, dan istirahat cukup</li>
                                        <li>Rujukan ke konseling bila ditemukan kecemasan, depresi, atau kesulitan kepatuhan pengobatan</li>
                                    </ul>
                                </li>
                                <li>5. Jadwal Pengawasan dan Pemantauan
                                    <p>Pasien dianjurkan untuk:</p>
                                    <ul>
                                        <li>Kontrol rutin ke Puskesmas sesuai jadwal yang ditetapkan</li>
                                        <li>Evaluasi tekanan darah, kepatuhan obat, dan efek samping secara berkala</li>
                                        <li>Penyesuaian terapi dilakukan berdasarkan hasil pemantauan tekanan darah dan kondisi klinis pasien</li>
                                    </ul>
                                </li>
                                <li>6. Konseling Nutrisi untuk Mendukung Pengobatan
                                    <p>Pasien diberikan konseling nutrisi meliputi:</p>
                                    <ul>
                                        <li>Pembatasan konsumsi garam (&lt; 5 gram/hari)</li>
                                        <li>Penerapan pola makan seimbang (DASH diet)</li>
                                        <li>Peningkatan konsumsi buah dan sayur</li>
                                        <li>Pembatasan makanan berlemak, gorengan, dan makanan olahan</li>
                                        <li>Anjuran menjaga berat badan ideal</li>
                                        <li>Edukasi membaca label makanan rendah garam</li>
                                    </ul>
                                </li>
                                <li>7. Rujukan Kembali Jika Terjadi Komplikasi
                                    <p>Pasien direncanakan untuk dirujuk kembali ke fasilitas kesehatan rujukan apabila terjadi:</p>
                                    <ul>
                                        <li>Peningkatan tekanan darah tidak terkontrol</li>
                                        <li>Gejala neurologis seperti kelemahan mendadak, bicara pelo, atau penurunan kesadaran</li>
                                        <li>Nyeri dada, sesak napas, atau penurunan fungsi ginjal</li>
                                    </ul>
                                </li>
                            </ol>
