<style type="text/css">
    fieldset {
        border-radius: 5px;
        border: 1px solid #228be6;
    }

    .k-slider-horizontal {
        display: inline-block;
        float: left;
        width: 450px;

        height: 26px;


    }

    .k-slider {

        margin-left: 3%;
        margin-right: 3%;
        margin-top: 1%;
        margin-bottom: 5%;
        display: inline-block;
    }

    .activeBtn {
        background-color: #10c4b2;
        color: #ffffff;
    }

    table,
    th,
    td {
        border: 1px solid #929191;
        border-collapse: collapse;
        padding: 5px;
    }

    th,
    td {
        padding: 5px;
        text-align: left;
    }
</style>

<div class="grid_12" disable-contents="allDisabled">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <div class="panel-heading" c-translate>Assesmen Awal Keperawatan Rawat Jalan Non Jiwa</div>
        </div>

        <div class="grid_12" style="margin-top: 10px;">
            <fieldset style="margin-top: 10px">
                <div class="grid_12" ng-repeat="list in listRujukan | orderBy:'id'" style="padding: 5pt 10pt">
                    <b>{{list.nama}}</b>
                    <div class="grid_12" style="padding: 5pt">
                        <div ng-repeat="jawab in list.detail | orderBy:'id'">
                            <div ng-switch on="jawab.type">
                                <div class="grid_12" ng-switch-when="textarea">
                                    <div>
                                        <label>{{jawab.nama}}</label>
                                    </div>
                                    <div>
                                        <textarea style="width: 95%;height: 100px" c-text-area type="input"
                                            filter="'string'" class="k-textbox" style="{{data.style}}"
                                            ng-model="item.obj[jawab.id]" />
                                        </div>
                                </div>
                            </div>

                            <div class="grid_3">
                                <label class="grid_12">{{jawab.nama}}</label>
                                <div ng-repeat="jawabb in jawab.detail | orderBy:'id'">
                                    <div ng-switch on="jawabb.type">
                                        <div class="grid_12" ng-switch-when="checkbox">
                                            <div class="grid_12">
                                                <input type="checkbox" class="k-checkbox" id="item.obj{{jawabb.id}}"
                                                    ng-model="item.obj[jawabb.id]">
                                                <label class="k-checkbox-label" for="item.obj{{jawabb.id}}">
                                                    &nbsp;{{jawabb.nama}}</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                                
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>
        <div class="grid_12">
            <div class="grid_8"></div>
            <div class="grid_4">
                <fieldset style="margin-top:10px;border-radius: 10px;height: 220px;">
                    <div style="padding: 20px;">
                        <div class="grid_12">
                            <div class="grid_12">
                                <label c-label item="item"
                                    c-label-text="Tanggal dan Jam"></label>
                            </div>
                            <div class="grid_12">
                                <input style="width: 100%" k-ng-model="item.obj[1901607]"
                                    kendo-datetimepicker placeholer="yyyy-MM-dd HH:mm"
                                    k-format="'yyyy-MM-dd HH:mm'"
                                    parsedate="yyyy-MM-dd HH:mm" />

                            </div>
                        </div>
                        <div class="grid_12" style="margin-top:10px">
                            <div class="grid_12">
                                <label c-label item="item" c-label-text="Perawat"></label>
                            </div>
                            <div class="grid_12">
                                <input style="width: 100%;" kendo-combo-box
                                    k-ng-model="item.obj[1901608]" k-data-text-field="'text'"
                                    k-data-value-field="'value'" k-filter="'contains'"
                                    k-auto-bind="false" k-data-source="listPegawai" />

                            </div>
                        </div>
                        
                    </div>
                </fieldset>
            </div>

        </div>
        <div class="grid_12">
            <div ng-include='"../app/module/EMR/TemplateButtonDinamis" '></div>
        </div>
    </div>
</div>
