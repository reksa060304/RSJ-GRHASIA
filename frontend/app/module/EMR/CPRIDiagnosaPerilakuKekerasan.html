<style type="text/css">

        border-collapse: collapse;
        border-spacing: 0;
        border-color: #aabcfe;
    }

        font-family: Arial, sans-serif;
        font-size: 14px;
        padding: 10px 5px;
        border-style: solid;
        border-width: 1px;
        overflow: hidden;
        word-break: normal;
        border-color: #aabcfe;
        color: #669;
        background-color: #e8edff;
    }

    .tg th {
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: normal;
        padding: 10px 5px;
        border-style: solid;
        border-width: 1px;
        overflow: hidden;
        word-break: normal;
        border-color: #aabcfe;
        color: #039;
        background-color: #b9c9fe;
    }

    .tg .tg-yw4l {
        vertical-align: top
    }


    .rowstyle {
        border-bottom: 1px dashed lightblue
    }

    .footer {
        text-align: center;
        font-size: 120%;
        font-weight: 700;
        margin-bottom: 20px
    }

    table,
    th,
    td {
        border: 1px solid #929191;

        padding: 5px;
    }

    th,
    td {
        padding: 5px;
        text-align: left;
    }

<div class="grid_12">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <div class="panel-heading" c-translate>Catatan Perkembangan Rawat Intensif <br> Diagnosa Keperawatan Perilaku Kekerasan </div>
        </div>
        <div style="margin-top:10px">
            <div class="grid_12" style="margin-top: 20px">
                <table style="width:100%;color: #4c5356;">
                    <tr>
                        <th>
                            <div class="grid_12" style ="text-align: center;">
                                <b>Tanggal Jam</b>
                            </div>
                        </th>
                        <th>
                            <div class="grid_12" style ="text-align: center;">
                                <b>Pelaksanaan</b>
                            </div>
                        </th>
                        <th>
                            <div class="grid_12" style ="text-align: center;">
                                <b>Evaluasi</b>
                            </div>
                        </th>
                        <th>
                            <div class="grid_12 " style ="text-align: center;">
                                <b>Paraf Nama</b>
                            </div>
                        </th>
                    </tr>
                              
                    <tr>
                        <td>
                            <div class="grid_12">
                                <input style="width: 100%" k-ng-model="item.obj[3012400]" kendo-datetimepicker
                                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                                    parsedate="yyyy-MM-dd HH:mm" />
                            </div>
                        </td>
                        <td>
                            <div class="grid_12 margin-bottom margin-top:10px">
                                <div class="grid_12 margin-bottom" ng-repeat="list in listPelaksana">
                                    <div class="grid_12">
                                        <div ng-repeat="jawab in list.detail">
                                            <div ng-switch on="jawab.type">
                                                <div class="grid_12" ng-switch-when="checkbox" style="margin-top: 10px;">
                                                    <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                                        ng-model="item.obj[jawab.id]">
                                                    <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                                        &nbsp;{{jawab.nama}}</label>
                                                
                                                </div>
                                                <div class="grid_12" ng-switch-when="textbox2" style="margin-top: 10px;">
                                                    <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                                        ng-model="item.obj[jawab.id]">
                                                    <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                                        &nbsp;{{jawab.nama}}</label>
                                                    <div class="grid_12">
                                                        <label c-label item="item" c-label-text=""></label>
                                                    </div>
                                                    <div class="grid_12 parentKeteranganFieldTambahan">
                                                        <input c-text-box type="text" filter="" class="k-textbox"
                                                            ng-model="item.obj[jawab.idd]" />
                                                        <label class="keteranganFieldTambahan"
                                                            style="margin-top: 10px;margin-right: 30px"></label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                            </div> 
                        </td>
                        <td style="vertical-align: top;">
                            <div class="grid_12">
                                <label for="">
                                    &nbsp;</label>
                                <label c-label item="item">
                                    <textarea style="width: 100%;height: 300px" c-text-area type="input"
                                                filter="'string'" class="k-textbox" 
                                                ng-model="item.obj[3012419]" />
                                </label>
                            </div>
                        </td>
                        <td style="vertical-align: top;">
                            <div class="grid_12 margin-bottom margin-top-30" style="margin-top: 100px;">
                                <label c-label item="item">Nama Perawat</label>
                                <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[3012420]"
                                    k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                                    k-auto-bind="false" k-data-source="listPegawai" />
                            </div>
                        </td>
                         
                    </tr>
                   
                </table>
            </div>
        </div>
    </div>
</div>

<br />
<div class="grid_12">
    <div ng-include='"../app/module/EMR/TemplateButtonDinamis" '></div>

</div>
