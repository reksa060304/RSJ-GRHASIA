                    <div class="grid_12 margin-top-10 margin-bottom">
                        <div class="container-edukasi">
                            <p style="font-size: 1.2em; font-weight: bold; margin-bottom: 20px;">
                                Rekomendasi Edukasi dan Tindak Lanjut di Puskesmas</p>
                            <ol>
                                <li>1. Melanjutkan pengobatan anti kejang
                                    <p>Pasien agar diberikan edukasi yang jelas dan berkelanjutan tentang pentingnya konsumsi obat anti kejang setiap hari sesuai anjuran, meskipun gejala mulai membaik. Tidak boleh menghentikan obat tiba-tiba karena dapat memicu kejang. Jika lupa minum obat, segera minum begitu teringat. Jangan menggandakan dosis jika sudah mendekati waktu dosis berikutnya.</p>
                                </li>

                                <li>2. Penjelasan Terkait Tatalaksana Kejang Di Rumah
                                    <ol type="a">
                                        <li>a. Hal – hal yang harus dilakukan saat pasien kejang :
                                            <ul class="arrow-list">
                                                <li>Tetap tenang, jangan panik</li>
                                                <li>Singkirkan benda keras/tajam di sekitar pasien</li>
                                                <li>Longgarkan pakaian, terutama di leher</li>
                                                <li>Posisikan pasien berbaring miring (posisi pemulihan) bila memungkinkan</li>
                                                <li>Catat waktu mulai kejang</li>
                                                <li>Lindungi kepala pasien (alas bantal/lipatan kain)</li>
                                                <li>Biarkan kejang berhenti secara alami</li>
                                                <li>Awasi pernapasan pasien</li>
                                                <li>Setelah kejang berhenti, biarkan pasien istirahat</li>
                                            </ul>
                                        </li>
                                        <li>b. Hal – hal yang tidak boleh dilakukan saat pasien kejang :
                                            <ul class="arrow-list">
                                                <li>Jangan memasukkan benda apa pun ke dalam mulut</li>
                                                <li>Jangan menahan atau mengikat tubuh pasien</li>
                                                <li>Jangan memberi minum atau obat saat kejang berlangsung</li>
                                                <li>Jangan melakukan napas buatan saat pasien masih kejang</li>
                                            </ul>
                                        </li>
                                    </ol>
                                </li>

                                <li>3. Penjelasan tentang pencegahan kekambuhan kejang
                                    <p>Pasien diberikan edukasi mengenai risiko dan cara mencegah kekambuhan kejang, termasuk:</p>
                                    <ol type="a">
                                        <li>a. Kepatuhan minum obat: Pasien perlu diarahkan untuk meminum obat pada waktu yang sama setiap hari.</li>
                                        <li>b. Pengawasan dosis pemberian obat : pasien dan keluarga diarahkan untuk tidak merubah dosis pemberian tanpa evaluasi dari dokter.</li>
                                    </ol>
                                </li>

                                <li>4. Dukungan Psikososial
                                    <p>Epilepsi atau ayan/sawan sering disalahartikan sebagai penyakit menular, gangguan jiwa, atau akibat hal mistis, sehingga perlunya edukasi terkait :</p>
                                    <ol type="a">
                                        <li>a. Edukasi keluarga tentang penyakit epilepsi juga penting untuk mengurangi stigma di rumah dan lingkungan sosial pasien.</li>
                                        <li>b. Epilepsi dapat menimbulkan stigma sosial, sehingga pasien sering mengalami tekanan psikologis. Puskesmas perlu menyediakan dukungan psikologis atau kelompok dukungan untuk pasien epilepsi agar mereka dapat berbagi pengalaman dan mengurangi kecemasan terkait penyakit ini.</li>
                                    </ol>
                                </li>

                                <li>5. Jadwal Pengawasan dan Pemantauan
                                    <p>Puskesmas perlu menyusun jadwal kontrol rutin untuk memantau perkembangan kesehatan pasien termasuk:</p>
                                    <ol type="a">
                                        <li>a. Kunjungan setiap minggu untuk memeriksa kepatuhan terhadap pengobatan dan memantau tanda-tanda efek samping.</li>
                                        <li>b. Pemantauan kondisi umum, intensitas kejang dan fungsi kognitif pasien setiap kali kunjungan dilakukan.</li>
                                    </ol>
                                </li>

                                <li>6. Konseling Nutrisi untuk Mendukung Pengobatan
                                    <p>Pasien epilepsi sering kali mengalami penurunan berat badan dan kelemahan. Puskesmas perlu memberikan konseling nutrisi untuk memastikan pasien mengonsumsi makanan yang tinggi kalori dan protein, seperti:</p>
                                    <ol type="a">
                                        <li>a. Sumber protein: Daging tanpa lemak, ikan, telur, dan kacang-kacangan.</li>
                                        <li>b. Buah dan sayuran: Untuk membantu meningkatkan daya tahan tubuh.</li>
                                        <li>c. Vitamin dan suplemen jika diperlukan, seperti vitamin B-kompleks dan asam folat.</li>
                                    </ol>
                                </li>

                                <li>7. Rujukan Kembali Jika Terjadi Komplikasi
                                    <p>Seringnya komplikasi muncul pada pasien epilepsi sehingga perlu pemantauan kondisi dan perlu rujukan ke rumah sakit :</p>
                                    <ol type="a">
                                        <li>a. Jika selama pemantauan terdapat tanda-tanda komplikasi seperti peningkatan frekuensi kejang walaupun dengan terapi kejang, penurunan fungsi kognitif, dan penurunan kesadaran, pasien harus segera dirujuk kembali ke rumah sakit untuk penanganan lebih lanjut.</li>
                                        <li>b. Jika terjadi efek samping dengan gejala serius seperti kejang > 5 menit dan kejang berulang.</li>
                                    </ol>
                                </li>
                            </ol>
