<md-dialog aria-label="PRMRJ" style="width: 95%; max-width: 1100px; max-height: 92vh; border-radius: 4px; overflow: hidden;">

    <!-- Toolbar Header -->
    <div style="background-color: #1565c0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fa fa-file-text" style="color: white; font-size: 18px;"></i>
            <span style="color: white; font-size: 15px; font-weight: 600;">PRMRJ</span>
        </div>
        <button ng-click="kembali()"
                style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: white; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px;">
            <i class="fa fa-times"></i> Tutup
        </button>
    </div>

    <!-- Content -->
    <md-dialog-content style="padding: 0; overflow-y: auto; flex: 1; max-height: calc(92vh - 110px);">
        <div style="padding: 12px 16px;">
            <div ng-include="'../app/module/EMR/PRMRJ.html'"></div>
        </div>
    </md-dialog-content>

</md-dialog>
