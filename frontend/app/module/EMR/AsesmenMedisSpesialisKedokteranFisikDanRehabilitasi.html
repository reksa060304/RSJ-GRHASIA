<div class="grid_12">
    <div class="grid_12">
        <div class="panel panel-default container_12">
            <div class="panel-heading" c-translate>Asesmen Medis Spesialis Kedokteran Fisik dan Rehabilitasi</div>
        </div>
        <div class="grid_12 margin-top-30">
            <label c-label item="item">Tanggal</label>
            </div>
            <div class="grid_4">
                <input style="width: 100%" k-ng-model="item.obj[3003500]" kendo-datetimepicker
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
            </div>
        </div>

        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_12 margin-top-30  margin-bottom">
                    <label c-label item="item"> A. ANAMNESIS</label>
                </div>
                <div class="grid_12 margin-top-20 margin-bottom">
                    <label c-label item="item" class="margin-bottom">1. Keluhan Utama</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003501]"
                            style="height: 80px; width: 98%; "/>
                </div>
                <div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom">2. Riwayat Penyakit Sekarang</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003502]"
                            style="height: 80px; width: 98%; "/>
                </div>
                <div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom">3. Riwayat Penyakit Dahulu</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003503]"
                            style="height: 80px; width: 98%; "/>
                </div><div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom">4. Riwayat Penyakit Keluarga</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003504]"
                            style="height: 80px; width: 98%; "/>
                </div>
            <div class="grid_12 margin-bottom">
                <label c-label item="item" class="margin-bottom">5. Riwayat Alergi</label>
                <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003505]"
                        style="height: 80px; width: 98%; "/>
              </div>
             </div>
            </div>
         </fieldset>
        </div>

        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_12 margin-top-30  margin-bottom">
                    <label c-label item="item">B. PEMERIKSAAN</label>
                </div>
                <div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom">1. Pemeriksaan Fisik</label>
                    <textarea c-text-area type="input" filter="'string'" claes="k-textbox" ng-model="item.obj[3003506]"
                            style="height: 90px; width: 98%; "/>
                </div>
                <div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom">2. Pemeriksaan Penunjang</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003507]"
                            style="height: 90px; width: 98%; "/>
                </div>
            </fieldset>
        </div>
        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_12 margin-top-30 margin-bottom">
                    <label c-label item="item">C. DIAGNOSIS</label>
                </div>
                <div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom"></label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003508]"
                            style="height: 90px; width: 98%; "/>
                </div>
                </div>
            </fieldset>
        </div>

        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_12 margin-top-30 margin-bottom">
                    <label c-label item="item">E. PROBLEM REHABILITASI MEDIK</label>
                </div>
                <div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom"></label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003509]"
                            style="height: 90px; width: 98%; "/>
                </div>
                </div>
            </fieldset>
        </div>

        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_12 margin-top-30  margin-bottom">
                    <label c-label item="item">F. PENATALAKSANAAN</label>
                </div>
                <div class="grid_12 margin-bottom">
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003510]"
                            style="height: 100px; width: 98%; "/>
                </div>
                <div class="grid_12 margin-bottom">
                    <label c-label item="item" class="margin-bottom">Edukasi tentang diagnosis, penatalaksanaan dan prognosis kepada:</label>
                </div>
                <div class="grid_12 margin-top margin-bottom" ng-repeat="list in listEdukasiDiagnosis">
                    <div class="grid_12">
                        <div ng-repeat="jawab in list.detail">
                            <div ng-switch on="jawab.type">
                                <div class="grid_4" ng-switch-when="checkbox" style="margin-top: -5px;">
                                    <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                        ng-model="item.obj[jawab.id]">
                                    <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                        &nbsp;{{jawab.nama}}</label>
                                
                                </div>
                                <div class="grid_4 text-center" ng-switch-when="textbox" style="margin-top: -5px;">
                                    <div class="grid_12">
                                        <label>{{jawab.nama}}</label>
                                    </div>
                                    <div class="grid_12 parentKeteranganFieldTambahan">
                                        <input c-text-box type="text" filter="" class="k-textbox"
                                            ng-model="item.obj[jawab.id]" style="width: 95%" />
                                        <label class="keteranganFieldTambahan"
                                            style="margin-top: 5px;margin-right: 60px">{{jawab.satuan}}</label>
                                    </div>
                                </div>
                                <div class="grid_4" ng-switch-when="checkboxtextbox" style="margin-top: -5px;">
                                    <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                        ng-model="item.obj[jawab.id]">
                                    <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                        &nbsp;{{jawab.nama}}</label>
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text=""></label>
                                    </div>
                                    <div class="grid_12 parentKeteranganFieldTambahan">
                                        <input c-text-box type="text" filter="" class="k-textbox"
                                            ng-model="item.obj[jawab.idd]" />
                                        <label class="keteranganFieldTambahan"
                                            style="margin-top: 5px;margin-right: 30px"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>

        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_6 margin-top-30 text-center margin-bottom border-right">
                    <div class="grid_12">
                        <label c-label item="item">INTEGRASI ASUHAN</label>
                    </div>
                    <div class="grid_12 margin-top margin-bottom" ng-repeat="list in listIntegrasiAsuhan">
                        <div class="grid_12">
                            <div ng-repeat="jawab in list.detail">
                                <div ng-switch on="jawab.type">
                                    <div class="grid_4" ng-switch-when="checkboxtextbox" style="margin-top: -5px;">
                                        <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                            ng-model="item.obj[jawab.id]">
                                        <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                            &nbsp;{{jawab.nama}}</label>
                                        <div class="grid_12">
                                            <label c-label item="item" c-label-text=""></label>
                                        </div>
                                        <div class="grid_12 parentKeteranganFieldTambahan">
                                            <input c-text-box type="text" filter="" class="k-textbox"
                                                ng-model="item.obj[jawab.idd]" />
                                            <label class="keteranganFieldTambahan"
                                                style="margin-top: 5px;margin-right: 30px"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="grid_12 margin-bottom margin-top">
                        <label c-label item="item" class="margin-bottom">Catatan / Notasi DPJP:</label>
                        <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003523]"
                                style="height: 55px; width: 98%; "/>
                    </div>
                    <div class="grid_12 margin-top">
                        <div class="grid_6"></div>
                        <div class="grid_6">
                            <label c-label item="item" c-label-text="Dokter"></label>
                        </div>
                    </div>
                    <div class="grid_12">
                        <div class="grid_6"></div>
                        <div class="grid_6">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.obj[3003535]"
                            k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listPegawai" />
                        </div>
                    </div>
                </div>
                <div class="grid_6 margin-top-30 text-center margin-bottom">
                    <div class="grid_12">
                        <label c-label item="item">RENCANA PEMULANGAN PASIEN</label>
                    </div>
                    <div class="grid_12 margin-top margin-bottom" ng-repeat="list in listPemulanganPasien">
                        <div class="grid_12">
                            <div ng-repeat="jawab in list.detail">
                                <div ng-switch on="jawab.type">
                                    <div class="grid_6" ng-switch-when="checkboxtextbox" style="margin-top: -5px;">
                                        <input type="checkbox" class="k-checkbox" id="item.obj{{jawab.id}}"
                                            ng-model="item.obj[jawab.id]">
                                        <label class="k-checkbox-label" for="item.obj{{jawab.id}}">
                                            &nbsp;{{jawab.nama}}</label>
                                        <div class="grid_12 parentKeteranganFieldTambahan">
                                            <input c-text-box type="text" filter="" class="k-textbox"
                                                ng-model="item.obj[jawab.idd]" />
                                            <label class="keteranganFieldTambahan"
                                                style="margin-top: 5px;margin-right: 30px"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>

        <div class="grid_12">
            <fieldset style="margin-top: 10px;">
                <div class="grid_4 margin-top-30 text-center margin-bottom">
                    <label c-label item="item" class="margin-bottom">Penanggung Jawab Pasien</label>
                    <textarea c-text-area type="input" filter="'string'" class="k-textbox" ng-model="item.obj[3003533]"
                        style="height: 30px; width: 98%; "/>
                </div>
                <div class="grid_4 margin-top-30 text-center margin-bottom">
                    <label c-label item="item" c-label-text="Dokter Pemeriksa/DPJP"></label>
                    <input style="width: 80%;" kendo-combo-box k-ng-model="item.obj[3003534]"
                            k-data-text-field="'text'" k-data-value-field="'value'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listPegawai" />
                </div>
                <div class="grid_4 margin-top-30 text-center margin-bottom">
                    <label c-label item="item" c-label-text="Selesai Pemeriksaan Pukul"></label>
                    <input  k-ng-model="item.obj[3003532]"  kendo-timepicker k-max="now" placeholer="HH:mm" k-format="'HH:mm'" ng-value="{{data2.datevalue}}"/>
                </div>
            </fieldset>
        </div>
    </div>
</div>
