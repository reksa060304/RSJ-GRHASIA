<style>
    
</style>
<div class="grid_12">
    <div class="panel panel-default container_12">
        <div class="panel-heading">Laporan Bor Los Toi</div>
        <div class="panel-body">
            <div class="panel panel-default panel-white" ng-hide="isMasuk">
                <div class="grid_12">
                    <!-- <div class="grid_5"></div> -->
                    <div class="grid_12">
                        <fieldset class="effect-shadow" style=" border-radius: 4px">
                            <legend id="filterData">
                                <a ng-click="showAndHide()">
                                    <h2><span class="fa fa-plus warnaa">
                                        </span> &nbsp;Pencarian</h2>
                                </a>
                            </legend>
                            <div class="grid_12" id="contentPencarian">
                                <div class="grid_11">
                                    <div class="grid_3">
                                        <label c-label item="item" c-label-text="Tanggal awal"></label>
                                        <input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker
                                            placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" />
                                    </div>
                                    <div class="grid_3">
                                        <label c-label item="item" c-label-text="Tanggal Akhir"></label>
                                        <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker
                                            placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" />
                                    </div>
                                    <div class="grid_2" style="margin-top: 2px;">
                                        <label c-label item="item" c-label-text="Ruangan"></label>
                                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                                            k-data-text-field="'namaruangan'" k-data-value-field="'id'"
                                            k-filter="'contains'" k-auto-bind="false" k-data-source="listRuangan" />
                                    </div>
                                    <label c-label c-label-text=""></label>
                                    <em style="margin-top:10px;" ng-click='SearchData()' id="iconButton"
                                        data-role="button" class="k-button k-button-icon k-primary" role="button"
                                        aria-disabled="false" tabindex="0"><span
                                            class="k-sprite k-icon k-i-search">Refresh</span></em>
                                    <em style="margin-top:10px;" ng-click='ClearData()' id="iconButton"
                                        data-role="button" class="k-button k-button-icon k-primary" role="button"
                                        aria-disabled="false" tabindex="0"><span
                                            class="k-sprite k-icon k-i-cancel">Reset</span></em>
                                </div>
                                <div class="grid_1" style="margin-top: 10px;">

                                </div>
                            </div>
                        </fieldset>
                    </div>
                    <div class="grid_12" style="margin-top: 40px; margin-bottom: -10px;">
                        <div class="grid_2">
                            <label c-label item="item" c-label-text="Jumlah Tempat Tidur"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.ttlTempatTidur" disabled />
                        </div>
                        <div class="grid_1">
                            <label c-label item="item" c-label-text="BOR"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.bortt" disabled />
                        </div>
                        <div class="grid_1">
                            <label c-label item="item" c-label-text="AVLOS"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.los" disabled />
                        </div>
                        <div class="grid_1">
                            <label c-label item="item" c-label-text="LOS"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.losaja" disabled />
                        </div>
                        <div class="grid_1">
                            <label c-label item="item" c-label-text="TOI"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.toi" disabled />
                        </div>
                        <div class="grid_1">
                            <label c-label item="item" c-label-text="BTO"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.bto" disabled />
                        </div>
                        <div class="grid_1">
                            <label c-label item="item" c-label-text="NDR"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.ndr" disabled />
                        </div>
                        <div class="grid_1">
                            <label c-label item="item" c-label-text="GDR"></label>
                            <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                                ng-model="item.gdr" disabled />
                        </div>
                    </div>
                </div>

                <div class="grid_12" style="margin-top:60px">
                    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
                </div>
            </div>
        </div>
    </div>
</div>
