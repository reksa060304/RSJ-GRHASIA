<style>
	.btn-disabled {
		background-color: red;
	}
	.btn-enabled {
		background-color: green;
	}
</style>
<div class="grid_12">
	<div class="grid_12 headerBox">
		<h1 style="color: white;"><b>Daftar Barang Aset</b></h1>
	</div>
	<!-- <div class="grid_12" style="margin-top: 30px;">
		<label c-label item="item" c-label-text="Detail Jenis Produk"></label>
		<div class="grid_12" ng-repeat="list in listJenisProdukDetail">
			<div ng-repeat="opsi in list.detail | orderBy:'no'" class="grid_1">
				<input type='radio' class='k-radio' name="{{opsi.nama}}" id="{{opsi.nama}}" ng-model="item.jenisProdukDetail" value="{{opsi.id}}">
				<label class="k-radio-label" for="{{opsi.nama}}">{{opsi.nama}}</label>
			</div>
		</div>
	</div>		 -->
	<div class="grid_12" style="margin-top: 30px;"></div>
		<div class="grid_3">
			<label c-label item="item" c-label-text="Detail Jenis Produk"></label>
			<select ng-show="listJenisProdukDetail.length" kendo-multi-select
				k-options="selectDetailJenisProduk" k-filter="'contains'"
				k-data-source="listJenisProdukDetail" k-ng-model="item.jenisProdukDetail"
				></select>
		</div>
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item" c-label-text="kd"></label>
			</div>
			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kdProdukScr" />
			</div>
		</div>
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Nama Produk"></label>
			</div>
			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaProdukScr" 
				ng-keypress="($event.which == 13)? cariFilter():item.namaProdukScr"/>
			</div>
		</div>
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item">Nama Produk</label>
			</div>
			<div class="grid_12">
				<input style="width: 100%; " kendo-combo-box k-ng-model="item.produk"
								k-data-text-field=" 'namaproduk' " k-filter=" 'contains' "
								k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listProduk"
								/>
			</div>
		</div>
	</div>
	<div class="grid_12" style="margin-top: 10px;">
		
		
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="kdIntern"></label>
			</div>
			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kdProdukInternScr" />
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="kdBarcode"></label>
			</div>
			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kdBarcodeScr" />
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="kodeBmn"></label>
			</div>
			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kodeBmnScr" />
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item">Jumlah Row</label>
			</div>
			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.jumlahRows" />
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item">Status Enabled</label>
			</div>
			<div class="grid_12">
				<input style="width: 100%; " kendo-combo-box k-ng-model="item.Status"
                                k-data-text-field=" 'status' " k-filter=" 'contains' "
                                k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listStatus"
                                 />
			</div>
		</div>
		<div class="grid_1">
			<button class="c-button" style="margin-top: 22px" ng-click="cariFilter()">Cari</button>
		</div>
		<div class="grid_12" style="margin-top: 20px;">
			<div class="grid_12 borderBox">
				<kendo-grid options="mainGridOptions" k-data-source="dataSource" k-sortable="'true'" k-ng-model="current"
					ng-click="klik(current)">
					
				</kendo-grid>
			</div>

		</div>
	</div>
	<div class="grid_12" style="margin-top: 20px;">		
		<div class="grid_6"></div>
		<div class="grid_2">
			<button class="c-button" ng-click="KelBPJS()">Kelompok Produk BPJS</button>
		</div>
		<div class="grid_2">
			<button class="c-button" ng-click="edit()">Ubah</button>
		</div>
		<div class="grid_2">
			<button class="c-button" ng-click="tambah()">Tambah</button>
		</div>
	</div>
</div>
