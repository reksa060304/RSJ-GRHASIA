<style type="text/css">
    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }

    .alert {
        background-color: #63f98e
    }

    .warning {
        background-color: #ffff66
    }

    .danger {
        background-color: #f76565
    }

    .green {
        background-color: #98FB98;
        color: #000000;
        /*font-weight: bold;*/
    }

    .red {
        background-color: #ff3860;
        color: #FFFFFF;
        /*font-weight: bold;*/
    }

    .blue {
        background-color: #1E90FF;
        color: #ffffff;
        /*font-weight: bold;*/
    }

    .koneng {
        background-color: #FFFF00;
        color: #191970;
        /*font-weight: bold;*/
    }
</style>

<div class="panel panel-default container_12">
    <div class="panel-heading" c-translate>Data Stok Ruangan Gabungan</div>
    <div class="panel-body">
        <div class="grid_12">
            <div class="grid_6">
                <div class="grid_4">
                    <label c-label item="item" c-label-text="Nama Produk"></label>
                    <input c-text-box type="input" class="k-textbox" ng-model="item.namaProduk"
                        ng-keypress="($event.which == 13)? cari():item.namaProduk" />
                </div>
                <div class="grid_5">
                    <div class="grid_12">
                        <label c-label class="label-aja" item="item" c-label-text="NamaBarang"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaBarang"
                            k-data-text-field="'namaproduk'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listNamaBarang" />
                    </div>
                </div>
                <div class="grid_3 pull-right">
                    <div class="grid_12" style="margin-top:21px">
                        <button class="c-button" ng-click="cari()">Cari</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_12 borderBox">
                <kendo-grid id="kGrid" data-source="dataGrid" k-selectable="'row'" k-sortable="'true'"  options="columnGrid"
                    k-ng-model="dataSelected" ng-click="KlikGrids(dataSelected)">
                </kendo-grid>
            </div>
        </div>
        <div class="grid_1">
            <label c-label item="item" c-label-text="Rows"></label>
            <input c-text-box type="input" class="k-textbox" ng-model="item.jmlRows" />
        </div>
    </div>
</div>
