<style type="text/css">
    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }
</style>

<div ng-show="dataVOloaded">
    <div class="grid_12">

        <div class="grid_12 headerBox">
            <h1 style="color: white;"><b>Laporan Perencanaan Stok Obat</b></h1>
        </div>
        <div class="grid_12">
            <div class="grid_8">
                
                <div class="grid_12" style="margin-top: 50px;">
                    <!-- AwalPeriode -->
                    <div class="grid_3 padDatePicker" style="margin-top: 5px;">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Tanggal"></label>
                        </div>
                        <div class="grid_12">
                            <input style="width: 100%" k-ng-model="item.tglAwal" kendo-datetimepicker k-max="now"
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label item="item">Kebutuhan Untuk Berapa Bulan</label>
                        </div>

                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kebutuhan" />
                        </div>
                    </div>
                    <div class="grid_2" style="margin-top: 18px;">
                        <button class="c-button" ng-click="cariFilter()">Cari</button>
                    </div>
                </div>


            </div>
            <div class="grid_12" style="margin-top: 20px;">
                <div class="grid_12 borderBox">
                    <div id="kGrid" kendo-grid k-data-source="dataGrid" k-selectable="'row'" options="columnGrid"
                        k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelected">
                    </div>
                </div>
            </div>


        </div>
        


        


        <div class="grid_12" style="margin-top:60px">
            <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
        </div>
        <div kendo-window="popUp" k-title="'Tanda tangan'" k-width="600" k-visible="false"
            k-on-open="win2visible = true" k-on-close="win2visible = false">
            <div class="panel panel-default container_12" style="padding: 0px 10px;">
                <div class="grid_6">
                    <fieldset>
                        <legend><b>Petugas Penyerahan</b></legend>
                        <div class="grid_12"">
                            <div class=" grid_12">
                            <div class="grid_12" style="margin-top: 10px">
                                <label c-label item="item" c-label-text="Jabatan" real></label>
                            </div>
                            <div class="grid_12">
                                <input kendo-combo-box k-ng-model="item.DataJabatan2" k-data-text-field="'namajabatan'"
                                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                                    k-data-source="listDataJabatan" />
                            </div>
                        </div>
                        <div class="grid_12">
                            <div class="grid_12" style="margin-top: 10px">
                                <label c-label item="item" c-label-text="Pegawai" real></label>
                            </div>
                            <div class="grid_12">
                                <input kendo-combo-box k-ng-model="item.DataPegawai2" k-data-text-field="'namalengkap'"
                                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                                    k-data-source="ListDataPegawai" />
                            </div>
                        </div>
                </div>
                </fieldset>
            </div>
            <div class="grid_6">
                <fieldset>
                    <legend><b>Petugas Penerima</b></legend>
                    <div class="grid_12"">
                    <div class=" grid_12">
                        <div class="grid_12" style="margin-top: 10px">
                            <label c-label item="item" c-label-text="Jabatan" real></label>
                        </div>
                        <div class="grid_12">
                            <input kendo-combo-box k-ng-model="item.DataJabatan1" k-data-text-field="'namajabatan'"
                                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                                k-data-source="listDataJabatan" />
                        </div>
                    </div>
                    <div class="grid_13">
                        <div class="grid_12" style="margin-top: 10px">
                            <label c-label item="item" c-label-text="Pegawai" real></label>
                        </div>
                        <div class="grid_12">
                            <input kendo-combo-box k-ng-model="item.DataPegawai1" k-data-text-field="'namalengkap'"
                                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                                k-data-source="ListDataPegawai" />
                        </div>
                    </div>
            </div>
            </fieldset>
        </div>
        <div class="grid_12">
            <fieldset>
                <legend><b>Mengetahui</b></legend>
                <div class="grid_12"">
            <div class=" grid_12">
                    <div class="grid_12" style="margin-top: 10px">
                        <label c-label item="item" c-label-text="Jabatan" real></label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.DataJabatan3" k-data-text-field="'namajabatan'"
                            k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listDataJabatan" />
                    </div>
                </div>
                <div class="grid_13">
                    <div class="grid_12" style="margin-top: 10px">
                        <label c-label item="item" c-label-text="Pegawai" real></label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.DataPegawai3" k-data-text-field="'namalengkap'"
                            k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                            k-data-source="ListDataPegawai" />
                    </div>
                </div>
        </div>
        </fieldset>
    </div>
    <div class="clear"></div>
    <!-- kata kunci confirm -->
    <div class="dialog_buttons pull-right" style="margin-top:5%">
        <input type="button" class="confirm_no k-button" value="Tidak" style="width: 70px" ng-click="BatalCetak()" />
        &nbsp;
        <input type="button" class="confirm_yes k-button" value="Ya" style="width: 70px" ng-click="CetakAh()" />
    </div>
</div>
</div>
</div>
