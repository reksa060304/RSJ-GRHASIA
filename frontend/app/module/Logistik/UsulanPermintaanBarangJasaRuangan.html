<style type="text/css">
    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }
</style>
<div class="grid_12">
    <div class="grid_12 headerBox">
        <h1 style="color: white;"><b>PURCHASE ORDER (PO)</b></h1>
    </div>
    <div class="grid_12" style="margin-top: 5px">
        <div class="grid_12 headerBox">
            <p>Data PO</p>
        </div>                    
        <div class="grid_4">
             <div class="grid_12">
                <div class="grid_12">
                    <label c-label item="item">Kelompok Barang</label>
                </div>
                <div class="grid_12">
                    <input kendo-combo-box k-ng-model="item.kelompokproduk" k-data-text-field="'kelompokproduk'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listKelompokProduk" k-on-change='getProduk()'/>
                </div>
            </div>
            <div class="grid_12" style="margin-top: 10px">
                <div class="grid_12">
                    <label c-label item="item">Tanggal PO</label>
                </div>
                <div class="grid_12 padDatePicker">
                    <input style="width: 99%" k-ng-model="item.tglUsulan" kendo-date-picker k-max="now"
                        placeholer="dd-MM-yyyy" k-format="'dd-MM-yyyy'" />
                </div>
            </div>                                                            
        </div>
        <div class="grid_4">
            <div class="grid_12">
                <div class="grid_12">
                    <label c-label item="item">Unit Pengorder</label>
                </div>
                <div class="grid_12">
                    <input kendo-combo-box k-ng-model="item.ruanganPengusul" k-data-text-field="'namaruangan'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listUnitPengusul" />
                </div>
            </div>
            <div class="grid_12" style="margin-top: 10px">
                <div class="grid_12">
                    <label c-label item="item">Unit Tujuan</label>
                </div>
                <div class="grid_12">
                    <input kendo-combo-box k-ng-model="item.ruanganTujuan" k-data-text-field="'namaruangan'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listUnitTujuan" />
                </div>
            </div>                    
        </div>  
        <div class="grid_4">
            <div class="grid_12">
                <div class="grid_6">
                    <div class="grid_12">
                        <label c-label item="item">Penanggung Jawab</label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.penanggungjawab" k-data-text-field="'namalengkap'"
                            k-data-value-field="'ssid'" k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listPegawai" />
                    </div>
                </div>
                <div class="grid_6">
                    <div class="grid_12">
                        <label c-label item="item">Mengetahui</label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.mengetahui" k-data-text-field="'text'"
                            k-data-value-field="'value'" k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listPegawaiS" />
                    </div>
                </div>
                
            </div>
            <div class="grid_12" style="margin-top: 10px">
                <div class="grid_12">
                    <label c-label item="item">Tgl Jatuh Tempo</label>
                </div>
                <div class="grid_12 padDatePicker">
                    <input style="width: 99%" k-ng-model="item.tglJatuhTempo" kendo-date-picker
                        placeholer="dd-MM-yyyy" k-format="'dd-MM-yyyy'" />
                </div>
            </div>               
        </div>
        <div class="grid_12" style="margin-top: 10px">
            <div class="grid_6">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Nama Suplier"></label>
                </div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaRekanan" k-data-text-field="'namarekanan'"
                     k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRekanan"/>
                </div>
            </div>
            <div class="grid_6">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Keterangan"></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.keterangan" />
                </div>
            </div>    
        </div>                    
    </div>    
    <div class="grid_12" ng-show='showInputObat' style="margin-top: 5px;">
        <div class="grid_12 headerBox">
            <p>Detail Barang</p>
        </div>
        <div class="grid_3">
            <div class="grid_12">
                <div class="grid_12">
                    <label c-label item="item">Tanggal Kebutuhan</label>
                </div>
                <div class="grid_12 padDatePicker">
                    <input style="width: 100%" k-ng-model="item.tglKebutuhan" kendo-date-picker placeholer="dd-MM-yyyy"
                        k-format="'dd-MM-yyyy'" />
                </div>
            </div>
            <!-- <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Kode Produk</label>
                </div>
                <div class="grid_12">
                    <input kendo-combo-box k-ng-model="item.produk" k-data-text-field="'id'" k-data-value-field="'id'"
                        k-filter="'contains'" k-auto-bind="false" k-data-source="listProduk"
                        k-on-change='getSatuan()' />
                </div>
            </div> -->
        </div>
        <div class="grid_3">
           <!--  <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Kode internal</label>
                </div>
                <div class="grid_12">
                    <input kendo-combo-box k-ng-model="item.produk" k-data-text-field="'kdproduk'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listProduk"
                        k-on-change='getSatuan()' />
                </div>
            </div> -->
            <div class="grid_12">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Produk"></label>
                </div>
                <div class="grid_12">
                    <input kendo-combo-box k-ng-model="item.produk" k-data-text-field="'namaproduk'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listProduk"
                        k-on-change='getSatuan()' />
                </div>
            </div>
        </div>

        <div class="grid_1" style="margin-top: 5px">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Satuan"></label>
            </div>
            <div class="grid_12">
                <input kendo-combo-box k-ng-model="item.satuan" k-data-text-field="'satuanstandar'"
                    k-data-value-field="'ssid'" k-filter="'contains'" k-auto-bind="false" k-data-source="listSatuan"
                    k-on-change='getNilaiKonversi()' />
            </div>
        </div>
        <div class="grid_1" style="margin-top: 5px">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Jumlah"></label>
            </div>
            <div class="grid_12">
                <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                    ng-model="item.jumlah" k-on-change="hitung()" />
            </div>
        </div>
        <div class="grid_2" style="margin-top: 5px">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Harga"></label>
            </div>
            <div class="grid_12">
                <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                    ng-model="item.hargaSatuan" />
            </div>
        </div>
        <div class="grid_1" style="margin-top: 5px">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Harga Diskon"></label>
            </div>
            <div class="grid_12">
                <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                    ng-model="item.hargaDiskon" ng-disabled="false" />
            </div>
        </div>
        <div class="grid_1" style="margin-top: 5px">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Diskon %"></label>
            </div>
            <div class="grid_12">
                <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                    ng-model="item.hargaDiskonPersen" ng-disabled="false" />
            </div>
        </div>        
        <div class="grid_12">
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Ppn"></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                        ng-model="item.ppn" ng-disabled="false" />
                </div>
            </div>
            <div class="grid_1">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Ppn %"></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                        ng-model="item.ppnpersen" ng-disabled="false"/>
                </div>
            </div>
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Sub Total"></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                        ng-model="item.subTotal" ng-disabled="true" />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Spesifikasi"></label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                        ng-model="item.spesifikasi" />
                </div>
            </div>
            <div class="grid_3">
                <div class="grid_12" style="margin-top: 10px">
                    <div class="grid_4">
                        <button class="btnTemplate1" ng-click="tambah()">Tambah</button>
                    </div>
                    <div class="grid_4">
                        <button class="btnTemplate1" ng-click="hapus()">Hapus</button>
                    </div>
                    <div class="grid_4">
                        <button class="btnTemplate1" ng-click="batal()">Batal</button>
                    </div>
                </div>
            </div>

            <div class="grid_12" style="margin-top: 10px">
                <div class="grid_12 borderBox">
                    <div id="kGrid" kendo-grid k-data-source="dataGrid" k-selectable="'row'" k-columns="columnGrid"
                        k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelected"
                        ng-click="klikGrid(dataSelected)">
                    </div>
                </div>
            </div>

            <div class="grid_8">
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Subtotal"></label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                            ng-model="item.totalSubTotal" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Diskon"></label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                            ng-model="item.totalDiskon" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Ppn"></label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                            ng-model="item.totalPpn" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Total"></label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" style="text-align: right" filter="" class="k-textbox"
                            ng-model="item.totalIniLoh" />
                    </div>
                </div>
            </div>

            <!-- NamaKegiatan -->
            <div class="grid_12">
                <div class="grid_6">
                </div>
                <div class="grid_6">
                    <div class="grid_6">
                    </div>
                    <div class="grid_2" style="margin-top: 22px">
                        <button class="c-button" ng-click="simpan()" ng-show='saveShow'>Simpan</button>
                    </div>
                    <div class="grid_2" style="margin-top: 22px">
                        <button class="c-button" ng-click="Batal()">Batal</button>
                    </div>
                    <div class="grid_2" style="margin-top: 22px">
                        <button class="c-button" ng-click="kembali()">Kembali</button>
                    </div>
                </div>
            </div>

            <div class="grid_12" style="margin-top:60px">
                <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
            </div>
        </div>
    </div>
</div>
