<!-- <div ng-controller="DaftarPasienApotikCtrl"> -->
<div ng-show="dataVOloaded">
    <!-- <c-panel item="item" header="'Produk'" disabled> -->
    <div class="grid_12">

        <div class="grid_12 headerBox">
            <h1 style="color: white;"><b>Daftar Resep Pasien</b></h1>
        </div>
        <div class="grid_12">

            <!-- Departemen -->
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Instalasi"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.instalasi"
                        k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listDepartemen" k-on-change='getRuangan()' />
                </div>
            </div>
            <!-- Ruangan -->
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Ruangan"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan" k-data-text-field="'ruangan'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listRuangan" />
                </div>
            </div>
            <!-- Ruangan -->
            <!-- <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Jenis Racikan"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisRacikan" k-data-text-field="'jenisracikan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisRacikan" />
                </div>
            </div> -->
            <div class="grid_1">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Depo"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruanganDepo"
                        k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listRuanganDepo" />
                </div>
            </div>
            <!-- <div class="grid_1">
            </div> -->
            <div class="grid_7">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Periode Tanggal"></label>
                </div>
                <div class="grid_12">
                    <!-- AwalPeriode -->
                    <div class="grid_4 padDatePicker">
                        <div class="grid_12">
                            <input style="width: 100%" k-ng-model="item.tglAwal" kendo-datetimepicker k-max="now"
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                    </div>

                    <!-- AkhirPeriode -->
                    <div class="grid_4 padDatePicker">
                        <div class="grid_12">
                            <input style="width: 100%" k-ng-model="item.tglAkhir" kendo-datetimepicker
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                    </div>
                    <div class="grid_1" style="margin-top: -20px;">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Rows"></label>
                        </div>
                        <div class="clear"></div>

                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.jmlRows" />
                        </div>
                    </div>
                    <div class="grid_3" style="margin-top: -5px;">
                        <div class="grid_6" style="margin-top: -5px;">
                            <button class="btnTemplate1" ng-click="cariFilter()"><i class="fa fa-search"></i>
                                Cari</button>
                        </div>
                        <div class="grid_6" style="margin-top: -5px;">
                            <button class="btnTemplate1" ng-click="clearFilter()"><i class="fa fa-refresh"></i>
                                Bersih</button>
                        </div>
                    </div>
                </div>


            </div>
        </div>
        <div class="grid_12">
            <!-- <div class="grid_12 headerBox">
                        <p>Produk</p>
                    </div> -->
            <!-- grid table -->
            <div class="grid_12 borderBox">
                <div id="kGrid" kendo-grid k-data-source="dataGrid" k-selectable="'row'" options="columnGrid"
                    k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelected">
                </div>
            </div>

        </div>


    </div>
    <!-- NamaKegiatan -->
    <div class="grid_12">
        <div class="grid_1">
            <div class="grid_12">
                <label c-label item="item">No Resep</label>
            </div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noResep"
                    ng-keypress="($event.which == 13)? cariEnter():item.noResep" />
            </div>
        </div>
        <div class="grid_1">
            <div class="grid_12">
                <label c-label item="item">No Registrasi</label>
            </div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noReg"
                    ng-keypress="($event.which == 13)? cariEnter():item.noReg" />
            </div>
        </div>
        <div class="grid_1">
            <div class="grid_12">
                <label c-label item="item">No.MR</label>
            </div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noMr"
                    ng-keypress="($event.which == 13)? cariEnter():item.noMr" />
            </div>
        </div>
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Nama Pasien"></label>
            </div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPasien"
                    ng-keypress="($event.which == 13)? cariEnter():item.namaPasien" />
            </div>
        </div>
        <div class="grid_1"></div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="TransaksiPelayanan()"><i class="fa fa-medkit"></i>Transaksi
                Pelayanan</button>
        </div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="showPop()"><i class="fa fa-stethoscope"></i> Tindakan</button>
        </div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="detailTagihan()"><i class="fa fa-th-list"></i>Detail
                Tagihan</button>
        </div>
        <div class="grid_8"></div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="hasil(1)"><i
                    class="fa fa-medkit"></i>Hasil
                Laboratorium</button>
        </div>
        <div class="grid_2">
            <button class="btnTemplate1" ng-click="HasilExpertise()"><i
                    class="fa fa-plus-square"></i>Expertisa
                Radiologi</button>
        </div>
    </div>
    <div class="grid_12" style="margin-top:60px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>
</div>

<div kendo-window="popupAntrians" k-title="'Pilih Ruangan'" k-width="400" k-height="120" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <label c-label item="item " c-label-text="Nama Ruangan "></label>
    <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruanganAntrian" k-data-text-field="'namaruangan'"
        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRuanganApd" />
    <div class="clear">
        <button class="k-button" ng-click="inputTindakan()" style="float:right;margin-top:4%"
            ng-hide="tombolSimpanVis">Lanjut </button>

    </div>
</div>
<div kendo-window="popUpHasilRad" k-title="'Data Order '" k-visible="false" k-width="900" k-height="500">
    <div class="panel panel-default container_12">
        <div class="grid_12">
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">No Registrasi</label>
                </div>
                <div class="clear"></div>
                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="popupRad.noregistrasi"
                        ng-disabled="true" />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">No RM</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="popupRad.nocm"
                        ng-disabled="true" />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Nama Pasien</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="popupRad.namapasien"
                        ng-disabled="true" />
                </div>
            </div>
        </div>
        <div class="grid_12">
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Umur</label>
                </div>
                <div class="clear"></div>
                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="popupRad.umur"
                        ng-disabled="true" />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Tipe Pasien</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="popupRad.kelompokpasien"
                        ng-disabled="true" />
                </div>
            </div>
            <div class="grid_4">
                <div class="grid_12">
                    <label c-label item="item">Ruangan Terakhir</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="popupRad.namaruangan"
                        ng-disabled="true" />
                </div>
            </div>
        </div>
        <div class="grid_12 ">
            <div kendo-grid k-data-source="sourceHasilRad" k-selectable="'row'" k-columns="columnHasilRad"
                k-pageable="'true'" k-sortable="'true'" k-ng-model="dataHasilRad"
                ng-click="klikHasilRad(dataHasilRad,ruanganMana)">
                <div k-detail-template>
                    <kendo-tabstrip>
                        <div>
                            <div kendo-grid k-options="detailHasilRad(dataItem)"></div>
                        </div>
                    </kendo-tabstrip>
                </div>
            </div>
        </div>
        <div class="grid_12">
            <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:20px">
                <!-- <kendo-button class="k-primary" icon="'k-icon k-update'" ng-click='lihatHasilRad()' ng-show="showRadiologi">Lihat
								Hasil</kendo-button> -->
                <kendo-button class="k-primary" icon="'k-icon k-update'" ng-click='lihatHasilLab()'
                    ng-hide="showRadiologi">Lihat
                    Hasil</kendo-button>
                <kendo-button icon="'k-icon k-cancel'" ng-click='tutup()'>Tutup</kendo-button>
            </div>
        </div>
    </div>
</div>

<div kendo-window="popUpEkpertise" k-title="'Masukan Ekspertise'" k-width="1200" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <fieldset>
            <legend>Ekspertise</legend>
            <div class="grid_12">
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item">No Foto</label>
                    </div>
                    <div class="clear"></div>
                    <div class="grid_12">
                        <input c-text-box type="input" class="k-textbox" ng-model="item.nofoto" disabled />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item">Nama Pelayanan</label>
                    </div>
                    <div class="clear"></div>
                    <div class="grid_12">
                        <input c-text-box type="input" filter="'varchar'" class="k-textbox" disabled
                            ng-model="item.namaPelayanan" disabled />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item">Tanggal</label>
                    </div>
                    <div class="clear"></div>
                    <div class="grid_12 padDatePicker">
                        <input style="width: 100%" k-ng-model="item.tglInput" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" disabled />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label item="item">Dokter</label>
                    </div>

                    <div class="grid_12">
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.dokter"
                            k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listDokter" disabled />
                    </div>

                </div>
            </div>
            <div class="grid_12">
                <div class="grid_12">
                    <label c-label item="item">Keterangan</label>
                </div>
                <div class="clear"></div>
                <div class="grid_12">
                    <textarea class="k-textbox" style="height: 300px; width: 100%;" ng-model="item.keterangan"
                        disabled></textarea>
                </div>
            </div>
        </fieldset>
        <div class="grid_8">
            <input style="width: 65%;" kendo-combo-box k-ng-model="itemimg.gambar" k-data-text-field="'filename'"
                k-data-value-field="'norec'" k-filter="'contains'" k-auto-bind="false" k-data-source="listNamaGambar"
                k-on-change='selectImage()' />
            <button style="margin-top: 4px;" class="k-button k-button-icontext k-primary k-grid-update"
                ng-hide="hideExper" ng-click="CheckImage()"><span class="k-icon k-update"></span>Lihat
                Gambar</button>
        </div>
        <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
            <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="cetakEks()"><span
                    class="k-icon k-print"></span>Cetak</button>
        </div>
    </div>
</div>
