<div class="grid_12 headerBox">
	<h1 style="color: white;"><b>Input Tagihan</b></h1>
</div>
<!-- Kriteria -->
<div class="grid_12">
	<!-- <div class="grid_12 headerBox containerBorderBox" style="padding:0px">
				<p>Data</p>
			</div> -->
	<div class="grid_12 borderBox containerBorderBox">

		<!-- NamaPelanggan -->
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Tgl Transaksi"></label>
			</div>
			<div class="clear"></div>
			<div class="grid_12">
				<input style="width: 100%" k-ng-model="item.tglStruk" kendo-datetimepicker placeholer="yyyy-MM-dd HH:mm"
					k-format="'yyyy-MM-dd HH:mm'" />
			</div>
		</div>
		<div class="grid_1">
			<div class="grid_12">
				<label c-label item="item" c-label-text="noCm"></label>
			</div>
			<div class="clear"></div>
			<div class="grid_12">
				<input c-text-box type="input" filter="" ng-blur="CariPasien()" class="k-textbox" ng-model="item.nocm_pasien"/>
				<img ng-show="isLoadingNoCM" style="position:absolute;right:0;top:7px;" height="24" src="stylesheets\Flat\loading-image.gif" />
			</div>
		</div>
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item" c-label-text="NamaPelanggan"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPasien_klien" />
			</div>
		</div>
		<div class="grid_1">
			<div class="grid_12">
				<label c-label item="item" c-label-text="No Telepon"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input style="width: 100%" c-text-box type="input" filter="" class="k-textbox"
					ng-model="item.noTelp_klien" />
			</div>
		</div>

		<!-- Telepon -->
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Kelompok Transaksi"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokTransaksi"
					k-data-text-field="'kelompoktransaksi'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listKelompokTransaksi"
					k-on-change="kelompokTransaksiSelected(item.kelompokTransaksi)" />
			</div>
		</div>

		<!-- tanda1 -->
		<div class="grid_1" ng-hide="noPolAmbulan">
			<div class="grid_12">
				<label c-label item="item" c-label-text="NomorPolisi"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.noPolisi"
					k-data-text-field="'nopolisi'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
					k-data-source="listAmbulan">
			</div>
		</div>
		<div class="grid_2" ng-hide="noPolAmbulan">
			<div class="grid_12">
				<label c-label item="item" c-label-text="JenisKegiatan"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisKegiatan"
					k-data-text-field="'namajeniskegiatan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisKegiatanAmbulan">
			</div>
		</div>

	</div>
</div>
<div class="clear"></div>

<br />

<!-- DaftarTagihan -->
<div class="grid_12">
	<div class="grid_12 headerBox">
		<p>Rincian Tagihan</p>
	</div>
	<div class="clear"></div>
</div>
<div class="grid_4">
	<div class="grid_12">
		<div class="grid_12">
			<label c-label item="item" c-label-text="Layanan"></label>
		</div>
		<div class="grid_12">
			<input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
				ng-model="item.namaproduk" ng-keypress="($event.which == 13)? CariProduk():item.namaproduk" />
		</div>
	</div>
	<div class="grid_12 borderBox" style="margin-top: 10px;">
		<div id="kGrid" kendo-grid k-data-source="dataDaftarProduk" k-selectable="'row'" k-columns="columnDaftarProduk"
			k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelectedProduk"
			ng-click="klikGrid(dataSelectedProduk)">
		</div>
	</div>
	<!-- grid table -->
</div>

						ng-model="item.no" disabled />
				</div>
			</div>
			<div class="grid_4">

			<div class="grid_12">
				<div class="grid_8"></div>
				<div class="grid_4">
					<div class="grid_12" style="margin-top: 10px">

							<button class="btnTemplate1" ng-click="tambah()">Tambah</button>
