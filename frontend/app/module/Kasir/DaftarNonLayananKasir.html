<div class="grid_12 headerBox">
	<h1 style="color: white;"><b>Daftar Tagihan Non Layanan</b></h1>
</div>
<!-- Kriteria -->
<div class="grid_12">

	<div class="grid_12 borderBox containerBorderBox">
		<!-- NamaPelanggan -->
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="NamaPelanggan"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPelanggan"
				ng-keypress="($event.which == 13)? SearchData():item.namaPelanggan" />
			</div>
		</div>

		<!-- Status -->
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Status"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.status" k-data-text-field="'namaExternal'"
					k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listStatus" />
			</div>
		</div>
		<!-- Status -->
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Kelompok Transaksi"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokTransaksi"
					k-data-text-field="'kelompoktransaksi'" k-data-value-field="'id'" k-filter="'contains'"
					k-auto-bind="false" k-data-source="listKelompokTransaksi" />
			</div>
		</div>

		<!-- Periode Pulang -->
		<div class="grid_3">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Periode"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<!-- AwalPeriode -->
				<div class="grid_6 padDatePicker">
					<div class="grid_12">
						<input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker
							placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
					</div>
				</div>

				<!-- AkhirPeriode -->
				<div class="grid_6 padDatePicker">
					<div class="grid_12">
						<input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
							placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
					</div>
				</div>
				<div class="clear"></div>
			</div>
		</div>

		<!-- Button Search -->
		<div class="grid_1">
			<div class="grid_12">
				<label>&nbsp;</label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<button class="btnTemplate1" ng-click="SearchData()">Cari</button>
			</div>
		</div>

		<!-- Button Clear -->
		<div class="grid_1">
			<div class="grid_12">
				<label>&nbsp;</label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<button class="btnTemplate1" ng-click="ClearSearch()">Clear</button>
			</div>
		</div>

	</div>
</div>
<div class="clear"></div>

<br />

<!-- DaftarNonLayanan -->
<div class="grid_12">
	<div class="grid_12 headerBox">
		<p>List Tagihan</p>
	</div>
	<div class="clear"></div>

	<!-- grid table -->
	<div class="grid_12 borderBox">
		<div id="kGrid" kendo-grid k-data-source="dataDaftarNonLayanan" k-selectable="'row'"
			options="columnDaftarNonLayanan" k-sortable="'true'" k-ng-model="dataPasienSelected"
			ng-click="klikGrid(dataPasienSelected)">
		</div>
	</div>


	<div class="clear"></div>
</div>
</div>

<div class="grid_12" style="margin-top: 20px;">
	<!-- <div class="grid_5"></div> -->
	<div class="grid_2"></div>
	<!-- <div class="grid_2" ng-hide="showBayar"></div> -->
	<div class="grid_2">
		<!-- <button class="c-button" ng-click="Bayar()" ng-show='showBayar'>Bayar</button> -->
		<button class="btnTemplate1" style="margin-top:-20px;margin-left: 0;" ng-click="Bayar()" ng-show='showBayar'><i
			class="fa fa-money"></i>Bayar</button>
	</div>
	<!-- <div class="grid_2"> -->

		<!-- <button class="btnTemplate1" style="margin-top:-20px;margin-left: 0;" ng-click="Cetak()"><i
			class="fa fa-print"></i>Cetak</button>
	</div> -->
	<div class="grid_2">
		<!-- <button class="c-button" ng-click="Detail()">Detail</button> -->
		<button class="btnTemplate1" style="margin-top:-20px;margin-left: 0;" ng-click="Detail()"><i
			class="fa fa-exclamation"></i>Detail</button>
	</div>
	<div class="grid_2">
		<!-- <button class="c-button" ng-click="InputTagihan()">Input</button> -->
		<button class="btnTemplate1" style="margin-top:-20px;margin-left: 0;" ng-click="InputTagihan()"><i
			class="fa fa-plus-square"></i>Input</button>
	</div>
	<div class="grid_2">
		<!-- <button class="c-button" ng-click="Hapus()">Edit</button> -->
		<button class="btnTemplate1" style="margin-top:-20px;margin-left: 0;" ng-click="EditTagihan()"><i
			class="fa fa-pencil-square-o"></i>Edit</button>
	</div>
	<div class="grid_2">
		<!-- <button class="c-button" ng-click="Hapus()">Hapus</button> -->
		<button class="btnTemplate1" style="margin-top:-20px;margin-left: 0;" ng-click="Hapus()"><i
			class="fa fa-trash"></i>Hapus</button>
	</div>
	
</div>
<div class="grid_12" style="margin-top:60px">
	<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>

	<div ng-include='"../app/template/Shared/Keuangan/TemplateButtonKasir"'></div>
