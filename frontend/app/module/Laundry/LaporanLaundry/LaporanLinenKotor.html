<style>
    .k-checkbox:checked+.k-checkbox-label:before {
        /* background-color: #fff; */
        border-color: #10c4b2;
        color: white;
        background-color: #10c4b2;
    }

    md-content.md-default-theme,
    md-content {
        color: rgba(0, 0, 0, 0.87);
        background-color: #FFFFFF;
    }

    .custom-button {
        margin: 0 0 10px;
        background: none;
        color: black;
        border-radius: 0.8em;
        border: 1px solid;
        background-color: white;
    }

    .k-edit,
    .k-i-download {
        background-position: -313px -221px;
    }

    a.k-button.k-button-icontext {
        min-width: 84px;
        background-color: #e0360b;
        border: none;
        margin: .1em;
    }

    k-button.k-button-icontext.k-grid-Cetak {
        min-width: 84px;
        background-color: #e0360b;
        border: none;
        margin: .1em;
    }

    .duplicateDate {
        background-color: red;
        border: 2px solid red !important;
    }

    span.errorCuti {
        text-align: center;
        width: 100%;
        padding: 10px 20px;
        color: red;
        font: italic 14px/30px arial, sans-serif;
    }

    .md-dialog-container,
    md-dialog {
        display: -webkit-box;
        display: -webkit-flex;
        display: flex;
        z-index: 200000;
    }

    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }
</style>
<div class="panel panel-default ">
    <div class="panel-heading headerBox"><span class="title" c-translate>Laporan Linen Kotor</span></div>
    <div class="panel-body">

        <div class="grid_12">
            <md-content class="md-padding" ng-show="!isInput">
                <div class="grid_12">
                    <!-- Nama -->
                    <div class="grid_2">
                        <label c-label item="item" c-label-text="namaRuangan"></label>
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                            k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listRuangan" />
                    </div>
                    <div class="grid_1">
                        <label c-label item="item" c-label-text="bulan"></label>
                        <input style="width: 100%" k-options="monthUngkul" k-ng-model="item.qBulan" kendo-date-picker
                            placeholer="MMMM" k-format="'MMMM-yyyy'" />
                    </div>
                    <div class="grid_1">
                        <label c-label c-label-text=""></label>
                        <em style="margin-top:6px;" ng-click='cari()' id="iconButton" data-role="button"
                            class="k-button k-button-icon k-primary" role="button" aria-disabled="false"
                            tabindex="0"><span class="k-sprite k-icon k-i-search">Cari</span></em>
                        <em style="margin-top:6px;" ng-click='resetFilters()' id="iconButton" data-role="button"
                            class="k-button k-button-icon k-primary" role="button" aria-disabled="false"
                            tabindex="0"><span class="k-sprite k-icon k-i-cancel">Refresh</span></em>
                    </div>
                </div>
                <div class="grid_12 headerBox">
                    <p>Data Jadwal</p>
                </div>
                <div class="grid_12">
                    <kendo-grid id="kGrid" k-ng-model="dataSelected" k-data-source="dataSourceGrid"
                        options='mainGridOptions' ng-click='klik(dataSelected)' class="max-height">
                    </kendo-grid>
                </div>
            </md-content>
        </div>
        <div class="grid_12" style="margin-top:60px">
            <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
        </div>
    </div>
</div>
