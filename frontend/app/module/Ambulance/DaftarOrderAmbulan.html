<c-panel item="item" header="'Daftar Order'" disabled>
    <div class="grid_12">

        <!--<div class="grid_12 headerBox">

                </div> -->
        <div class="grid_12">

            <!-- Departemen -->
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item">Ruangan Order</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">

                </div>
            </div>

                <div class="grid_12">
                    <label c-label item="item">Ruangan Tujuan</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruanganTujuan"
                        k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listRuangan" />
                </div>
            </div>
            <!-- Ruangan -->
            <div class="grid_1">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Tipe Pasien"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokPasien"

                </div>
            </div>
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Dokter"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.dokter"
                        k-data-text-field="'namadokter'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listDokter" />
                </div>
            </div>

            <div class="grid_5">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Periode Registrasi"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <!-- AwalPeriode -->
                    <div class="grid_4 padDatePicker">
                        <input style="width: 100%" k-ng-model="item.tglAwal" kendo-datetimepicker k-max="now"
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm"
                            ng-disabled='cekBelumVerifs' />
                    </div>

                    <!-- AkhirPeriode -->
                    <div class="grid_4 padDatePicker">
                        <input style="width: 100%" k-ng-model="item.tglAkhir" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" ng-disabled='cekBelumVerifs' />
                    </div>
                    <div class="grid_2">
                        <button class="c-button" ng-click="cariFilter()">Cari</button>

                    </div>
                </div>
            </div>

            <div class="grid_12" style="margin-left: 5px">

                    <span>Masuk {{totalMasuk}}</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                        <span id="square" style="background-color:#FF0000">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>

                        <span id="square" style="background-color:#3CB27A">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
                        <span>Selesai Periksa</span>
                    </div> -->
                <div class="grid_4">
                </div>
                <div class="grid_2">
                    <input type="checkbox" class="k-checkbox" id="isBelumVerifikasi" ng-model="item.belumVerifikasi"

                    <label class="k-checkbox-label" for="isBelumVerifikasi"><b>Belum Verifikasi</b></label>
                </div>
            </div>
        </div>

        <!-- grid WARNA -->

        </div>

    <!-- NamaKegiatan -->

                </div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noReg" />
                </div>
            </div>
            <div class="grid_2">
                <div class="grid_12">
                    <label c-label item="item">No RM</label>
                </div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noMr" />
                </div>
            </div>

            <div class="grid_3">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Nama Pasien"></label>
                </div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPasien" />
                </div>
            </div>
            <div class="grid_3">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="No Order"></label>
                </div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noOrderCari" />
                </div>
            </div>
            <div class="grid_1">

                </div>

                <div class="grid_12">
                    <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.jmlRow" />
                </div>
            </div>
        </div>
        <div class="grid_6">
            <div class="grid_4" style="margin-top: 22px">
                <button class="c-button" ng-click="cetakBuktiLayanan()">Bukti Layanan</button>
            </div>
            <div class="grid_4" style="margin-top: 22px">
                <button class="c-button" ng-click="verifikasi()">Verifikasi</button>
            </div>
            <div class="grid_4" style="margin-top: 22px">
                <button class="c-button" ng-click="editOrder()">Edit Order</button>
            </div>
            <!-- <div class="grid_4" style="margin-top: 22px">
                <button class="c-button" ng-click="verifikasiNew()">Verifikasi New</button>
            </div> -->

        </div>
    </div>
</c-panel>
