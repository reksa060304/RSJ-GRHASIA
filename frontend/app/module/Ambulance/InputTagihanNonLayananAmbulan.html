						margin-left: 5px;

				</div>

				</div>

					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.kecamatanDomisili"

				</div>

					<label c-label item="item" c-label-text="kotaKabupaten"></label>
					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.kotaKabupatenDomisili"
						k-data-text-field="'namakotakabupaten'" k-filter="'contains'"
						k-data-value-field="'id'" k-data-source="listDataKotaKabupaten"
						k-auto-bind="'false'" />
				</div>
				<div class="grid_4">
					<label c-label item="item" c-label-text="propinsi"></label>
					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.propinsiDomisili"
						k-data-text-field="'namapropinsi'" k-filter="'contains'"
						k-data-value-field="'id'" k-data-source="listDataPropinsi"
						k-auto-bind="'false'" />
				</div>
				<div class="grid_4">
					<label c-label item="item">Negara</label>
					<input required style="width: 100%;" kendo-combo-box k-ng-model="item.negaraDomisili"
						k-data-text-field="'namanegara'" k-filter="'contains'"
						k-data-value-field="'id'" k-data-source="listNegara" />
				</div>
			</div>
		</div>
	</div>
</div>
