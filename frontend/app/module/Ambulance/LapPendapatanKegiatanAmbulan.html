<div ng-show="dataVOloaded">

    <center>
        <c-panel item="item" header="'Laporan Pendapatan Kegiatan Ambulan'" disabled>
    </center>
    <!-- <br/> -->

    <!-- Kriteria -->
    <div class="grid_12">
        <div class="grid_12 borderBox containerBorderBox">

            <!-- Periode Pulang -->
            <div class="grid_1">
                <div class="grid_12">
                    <label c-label item="item" c-label-text="Tangggal Order"></label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%" k-options="yearUngkul" k-ng-model="item.tahun"
                        kendo-date-picker placeholer="YYYY" k-format="'yyyy'" />
                    <div class="clear"></div>
                </div>
            </div>

            <!-- Button Search -->
            <div class="grid_1">
                <div class="grid_12">
                    <label>&nbsp;</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()"> <i
                            class="fa fa-search"></i>Cari</button>
                </div>
            </div>


        </div>
    </div>

    <!-- DaftarPasienPulang -->
    <div class="grid_12">
        <div class="grid_12 headerBox">
            <p>Data</p>
        </div>
        <div class="clear"></div>

        <!-- grid table -->
        <div class="grid_12 borderBox">
            <kendo-grid id="kGrid" data-source="dataDaftarPasienPulang" options="columnDaftarPasienPulang"
                k-pageable="'true'" k-sortable="'true'" k-resizable="'true'" k-selectable="'row'"
                on-change="onChange(data)" k-ng-model="dataPasienSelected" ng-click="klikGrid(dataPasienSelected)">
            </kendo-grid>

        </div>
        <div class="clear"></div>
    </div>

    <div class="grid_12" style="margin-top:60px">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>
