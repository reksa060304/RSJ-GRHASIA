<!-- POP UP Verifikasi -->
<div kendo-window="popUpVerif" k-title="'Detail Order'" k-visible="false" k-width="1000"
k-on-close="win2visible = false">
<div class="panel panel-default container_12">

    <div class="grid_2">
        <div class="grid_12">
            <label c-label item="item" c-label-text="No Order"></label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noOrder"
                ng-disabled="true" />
        </div>
    </div>
    <div class="grid_2">
        <div class="grid_12">
            <label c-label item="item">No RM</label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="headerVerif.nocm"
                ng-disabled="true" />
        </div>
    </div>
    <div class="grid_6">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Nama Pasien"></label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPasiens"
                ng-disabled="true" />
        </div>
    </div>
    <div class="grid_2">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Jenis Kegiatan"></label>
        </div>
        <div class="clear"></div>
        <div class="grid_12">
            <input style="width: 100%;" kendo-combo-box k-ng-model="popUp.kegiatan"
            k-data-text-field="'namajeniskegiatan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
            k-data-source="listJenisKegiatan">
        </div>
    </div>

    <div class="grid_12 headerBox" style="margin-top:10px;">
        <p>Rincian Layanan</p>
    </div>
    <div class="grid_12 " style="margin-top:10px">
        <kendo-grid id="kGrids" k-data-source="sourceVerif" options="columnVerif" 
        k-ng-model="dataSelectedVerif" ng-click="klikVerif(dataSelectedVerif)">
        </kendo-grid>
    </div>
    <div class="grid_12">
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Kendaraan"></label>
            </div>
            <div class="clear"></div>
    
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="popUp.noPolisi"
                k-data-text-field="'nopolisi'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="listAmbulan">
            </div>
        </div>
        <div class="grid_4">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Supir"></label>
            </div>
            <div class="clear"></div>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="popUp.driver"
                k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="listSupir">
            </div>
        </div>
        <div class="grid_4">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Dokter"></label>
            </div>
            <div class="clear"></div>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="popUp.dokter"
                k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="listDokter">
            </div>
        </div>       
    </div>

    <div class="grid_12">        
        <div class="grid_5">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Perawat"></label>
            </div>
            <div class="clear"></div>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="popUp.perawat"
                k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="listPerawat">
            </div>
        </div>
        <div class="grid_5">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Verifikasi Order"></label>
            </div>
            <div class="clear"></div>
            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="popUp.verifikasiOrder"
                k-data-text-field="'jenis'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                k-data-source="listVerifikasi">
            </div>
        </div>
          <div class="grid_6">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Keterangan"></label>
            </div>
            <div class="clear"></div>
            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="popUp.messages"
                   k-auto-bind="false"/>
        </div>
    </div>

    <div class="grid_12">
        <div class="grid_8"></div>
        <div class="grid_4">
            <div class="pull-right" style="margin-top:4%">
                <button class="k-button" ng-click="simpanVerifikasi()"
                    ng-disabled='btnSimpanVis'>Simpan</button>
                <button class="k-button" ng-click="batalVerif()">Tutup</button>
            </div>
        </div>
    </div>


</div>
