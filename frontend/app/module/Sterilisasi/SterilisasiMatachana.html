<style type="text/css">
    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }
</style>
<div class="grid_12">
    <div class="grid_12 headerBox">
        <h1 style="color: white;"><b>Matachana</b></h1>
    </div>
    <div class="grid_12">
        <div class="grid_3">
            <div class="grid_12">
                <label c-label item="item">No Struk</label>
            </div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noKirim" disabled/>
            </div>
        </div>
        <div class="grid_3">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Ruangan Pengirim"></label>
            </div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                    k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                    k-auto-bind="false" k-data-source="listRuangan" k-on-change='getSatuan()' disabled/>
            </div>
        </div>
        <div class="grid_3">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Ruangan Tujuan"></label>
            </div>

            <div class="grid_12">
                <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruanganTujuan"
                    k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                    k-auto-bind="false" k-data-source="listRuanganTujuan" disabled/>
            </div>
        </div>        
        <div class="grid_3">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Petugas penginput"></label>
            </div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.pegawai" disabled/>
            </div>
        </div>
    </div>



    <div class="grid_12" ng-show='showInputObat'>

        <div class="grid_12 headerBox">
            <p>Form Matachana</p>
        </div>
        <div class="grid_4">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Tanggal Input"></label>
            </div>
            <div class="grid_12 padDatePicker">
                <input style="width: 100%" k-ng-model="item.tglInput" kendo-date-picker k-max="now"
                    placeholer="dd-MM-yyyy hh:mm" k-format="'dd-MM-yyyy hh:mm'"/>
            </div>
        </div>

        <div class="grid_4">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Suhu"></label>
            </div>
            <div class="grid_12">
                <!-- <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                    ng-model="item.suhu" ng-value="134"/> -->
                    <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                    ng-model="item.suhu" ng-init="item.suhu = 134"/>
            </div>
        </div>

        <div class="grid_4">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Waktu (menit)"></label>
            </div>
            <div class="grid_12">
                <!-- <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                    ng-model="item.waktu" ng-value="60"/> -->
                    <input c-text-box type="input" style="text-align: left" filter="" class="k-textbox"
                    ng-model="item.waktu" ng-init="item.waktu = 60"/>
            </div>
        </div>

        <div class="grid_12">
            <div class="grid_12 borderBox">
                <div id="kGrid" kendo-grid k-data-source="dataGrid" k-selectable="'row'" k-columns="columnGrid"
                    k-pageable="'true'" k-sortable="'true'" k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)">
                </div>
            </div>
        </div>

        <!-- NamaKegiatan -->
        <div class="grid_12">
            <div class="grid_8"></div>
            <div class="grid_4">
                <div class="grid_8"></div>
                <div class="grid_2" style="margin-top: 22px">
                    <button class="c-button" ng-click="simpan()">Simpan</button>
                </div>
                <div class="grid_2" style="margin-top: 22px">
                    <button class="c-button" ng-click="kembali()">Kembali</button>
                </div>
            </div>
        </div>
    </div>
</div>
