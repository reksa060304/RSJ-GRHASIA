<style>
    .k-checkbox:checked+.k-checkbox-label:before {
        /* background-color: #fff; */
        border-color: #10c4b2;
        color: white;
        background-color: #10c4b2;
    }

    .k-grid-content-locked, .k-grid-footer-locked, .k-grid-header-locked {
        display: inline-block;
        vertical-align: top;
        overflow: hidden;
        position: relative;
        border-style: solid;
        border-width: 0 1px 0 0;
        height: auto !important;
    }

    md-content.md-default-theme,
    md-content {
        color: rgba(0, 0, 0, 0.87);
        background-color: #FFFFFF;
    }
</style>
<div class="panel panel-default">
    <div class="panel-heading">
        <div class="headerBox">
            <span class="title" c-translate>Verifikasi HAIs</span>
        </div>
    </div>

    <div class="panel-body">
        <div class="grid_12">
            <div class="grid_2">
                <!-- Kalender -->
                <fieldset class="effect-shadow" style=" border-radius: 1px">
                    <legend id="filterData">
                        <a ng-click="showAndHide()">Kalender</a>
                    </legend>
                    <div class="grid_12">
                        <div class="grid_12" style="margin-top:10px">
                            <center>
                                <label c-label item="item"> Bulan : {{item.bulan | date:" MMMM, yyyy"}}</label>
                            </center>
                        </div>
                    </div>
                    <div class="grid_12">
                        <center>
                            <kendo-calendar ng-model="item.bulan" k-options="monthOnly" style="margin-top:10px"></kendo-calendar>
                        </center>
                    </div>
                </fieldset>
            </div>

            <div class="grid_10">
                <!-- Filter -->
                <div class="grid_12">
                    <div class="grid_3">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Ruangan"></label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input kendo-combo-box k-ng-model="item.ruangan"
                                k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'"
                                k-auto-bind="false" k-data-source="listRuangan" ng-disabled="isInput"
                                k-on-change='search()' />
                        </div>
                    </div>
                    <div class="grid_2" style="margin-top: 22px;">
                        <button class="c-button" ng-click="cari()">CARI</button>
                    </div>
                    <div class="grid_2" style="margin-top: 22px;">
                        <button class="c-button" ng-click="laporanBundleHais()">Laporan</button>
                    </div>
                </div>

                <!-- Grid -->
                <div class="grid_12">
                    <div id="grid" k-ng-model="dataBundleHais" class="height-auto"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="grid_12">
        <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
    </div>
</div>
