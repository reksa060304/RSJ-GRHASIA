<c-panel item="item" header="'Data Gaji Berkala Terakhir'" disabled></c-panel>
<div class="grid_12">

    <div class="grid_4" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item">Periode Tanggal TMT</label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <!-- AwalPeriode -->
            <div class="grid_6 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker k-max="now"
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
            </div>

            <!-- AkhirPeriode -->
            <div class="grid_6 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
            </div>
            <div class="clear"></div>
        </div>
    </div>
    <div class="grid_1" style="margin-top:5px">
        <div class="grid_12">
            <label>&nbsp;</label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()"> <i
                    class="fa fa-refresh"></i>Refresh</button>
        </div>
    </div>

    <div class="grid_12">
        <!-- <div class="grid_12 headerBox">
            <p>Daftar Pengunjung</p>
        </div>
        <div class="clear"></div> -->
        <div class="grid_12" style="margin-top: 10px;">
            <div class="grid_12 borderBox">
                <kendo-grid id="kGrid" data-source="dataSourceGrid" options="columnGrid" k-selectable="'row'"
                    k-sortable="'true'" k-resizable="'true'" k-ng-model="dataSelected"
                    ng-click="klikGrid(dataSelected)">
                </kendo-grid>
            </div>
        </div>
        <!-- <md-content>
            <md-tabs md-dynamic-height md-border-bottom md-selected="myVar">

                    <md-content class="md-padding">
                        
                    </md-content>
                </md-tab>
            </md-tabs>
        </md-content> -->

    <div class="grid_12">
        <div class="grid_3">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="verif()"> <i
                    class="fa fa-check"></i>Verif</button>
        </div>
        <div class="grid_3">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="cetakGajiBerkala()"> <i

<div kendo-window="popUpRiwayatGajiBerkala" k-title="'Kenaikan Gaji Berkala'" k-width="850" k-height="350"
    k-visible="false" k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="panel-heading-white"><span class="title" c-translate>Lama</span></div>
        <div class="panel-body">
            <div class="grid_12">
                <div class="grid_4">
                    <md-radio-group ng-model="gajilamanya">
                        <md-radio-button value="KP" class="md-primary">Pangkat Golongan
                        </md-radio-button>
                        <md-radio-button value="KGB" class="md-primary">Gaji Berkala
                        </md-radio-button>
                    </md-radio-group>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label>Gaji Lama</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                            ng-model="itemGajiBerkala.gajiawal" />
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label>Tanggal SK(Lama)</label>
                    </div>
                    <div class="clear"></div>
                    <div class="grid_12">
                        <input style="width: 100%" kendo-date-picker k-ng-model="itemGajiBerkala.tanggalsk"
                            k-format="'yyyy-MM-dd'" />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label>Tanggal TMT(Lama)</label>
                    </div>
                    <div class="clear"></div>
                    <div class="grid_12">
                        <input style="width: 100%" kendo-date-picker k-ng-model="itemGajiBerkala.tanggaltmtcetak"
                            k-format="'yyyy-MM-dd'" />
                    </div>
                </div>
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label>No SK(Lama)</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                            ng-model="itemGajiBerkala.noskcetak" />
                    </div>
                </div>

            </div>

        </div>
        <br><br>
        <div class="panel-heading-white"><span class="title" c-translate>Baru</span></div>
        <div class="panel-body">
            <div class="grid_12">
                <div class="grid_12">
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>No SK</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                                ng-model="itemGajiBerkala.nosk" />
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label item="item">Pangkat / Golongan</label>
                        </div>
                        <div class="grid_12">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="itemGajiBerkala.golongan"
                                k-data-text-field="'golongan'" k-data-value-field="'id'" k-auto-bind="true"
                                k-data-source="ListGolonganGajiBerkala" />
                            <!-- k-on-change="getDataGolongan()" -->
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>Tanggal SK(Baru)</label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input style="width: 100%" kendo-date-picker k-ng-model="itemGajiBerkala.tanggalskbaru"
                                k-format="'yyyy-MM-dd'" />
                        </div>
                    </div>


                </div>

                <div class="grid_12">
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>Tanggal TMT(Baru)</label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input style="width: 100%" kendo-date-picker k-ng-model="itemGajiBerkala.tanggaltmt"
                                k-format="'yyyy-MM-dd'" k-on-change="getDataGolongan()" />
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>Masa Kerja Golongan</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                                ng-model="itemGajiBerkala.masakerjagolongan" ng-hide="true" />
                        </div>
                        <div class="grid_6">
                            <input c-text-box type="text" filter="'varchar'" class="k-textbox"
                                ng-model="itemGajiBerkala.tahunmasakerjagolongan" placeholder="tahun" />
                        </div>
                        <div class="grid_6">
                            <input c-text-box type="text" filter="'varchar'" class="k-textbox"
                                ng-model="itemGajiBerkala.bulanmasakerjagolongan" placeholder="bulan" />
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>Gaji Baru</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                                ng-model="itemGajiBerkala.gajiakhir" />
                        </div>
                    </div>

                </div>
                <div class="grid_12">
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>Jenis SK</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                                ng-model="itemGajiBerkala.jenissk" />
                        </div>
                    </div>
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label>Pejabat Yang Menetapkan</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                                ng-model="itemGajiBerkala.pejabatmenetapkan" />
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <div class="grid_12">
            <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                <button class="k-button k-button-icontext k-primary k-grid-update"
                    ng-click="tambahRiwayatGajiBerkala()"><span class="k-icon k-update"></span>Simpan</button>
                <button class="k-button  k-button-icontext" ng-click="batalRiwayatGajiBerkala()"><span
                        class="k-icon k-cancel"></span>Batal</button>
            </div>
        </div>
    </div>
</div>
