<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }
    .k-grid .k-grid-header .k-header  {
        white-space: normal;
    }
    .k-grid .k-grid-header .k-header  {
        text-align: center;
    }
    .k-window-content .k-content {
        overflow: none
    }
    legend {
        cursor:pointer;
        padding: 10px;
    }
    .effect-shadow{
    -webkit-box-shadow: 2px 2px 5px #b6b6b6;
       -moz-box-shadow: 2px 2px 5px #b6b6b6;
            box-shadow: 2px 2px 5px #b6b6b6;
    }
    .warnaa {
        color: black
    }
    hr {
        border: 1px solid black;
        margin-top: 0px;
        margin-bottom: 0px;
        display: inline-block;
        width: 100%;
    }
    h1{
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }
    h2{
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }
</style>
<div class="grid_12">
    <div class="panel panel-default container_12">
        <div class="panel-heading" c-translate>Laporan Diagnosa Pasien</div>
        <div class="panel-body">
            <div class="panel panel-default panel-white" ng-hide="isMasuk">
                <fieldset class="effect-shadow" style=" border-radius: 4px">
                    <legend id="filterData">                                      
                        <a ng-click="showAndHide()"> <h2><span class="fa fa-plus warnaa">
                            </span> &nbsp;Pencarian</h2> </a>
                    </legend>
                    <div class="grid_12" id="contentPencarian">
                        <div class="grid_12">
                            <div class="grid_3">
                                <div class="grid_2">
                                    <input type="checkbox" class="k-checkbox" id="tglmasukss"
                                        ng-model="item.cbxtanggalmasuk" value="true"
                                        ng-click="tanggalmasuk(item.cbxtanggalmasuk)">
                                    <label class="k-checkbox-label" for="tglmasukss"></label>
                                </div>
                                <div class="grid_5">
                                    <label c-label item="item" c-label-text="Tanggal Masuk Awal" ></label>
                                    <input disabled="true" id= "tglmasukawal" style="width: 100%" k-ng-model="item.tglawalmasuk" kendo-datetimepicker placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'"
                                    />
                                </div>
                                <div class="grid_5">
                                    <label c-label item="item" c-label-text="Tanggal Masuk Akhir"></label>
                                    <input disabled="true" id="tglmasukakhir" style="width: 100%"
                                        k-ng-model="item.tglakhirmasuk" kendo-datetimepicker placeholer="yyyy-mm-dd"
                                        k-format="'yyyy-MM-dd'"
                                    />
                                </div>
                                <div class="grid_2">
                                    <input type="checkbox" class="k-checkbox" id="tglpulangss"
                                        ng-model="item.cbxtanggalpulang" value="true"
                                        ng-click="tanggalpulang(item.cbxtanggalpulang)">
                                    <label class="k-checkbox-label" for="tglpulangss"></label>
                                </div>
                                <div class="grid_5">
                                    <label c-label item="item" c-label-text="Tanggal Pulang Awal"></label>
                                    <input disabled="true" id="tglpulgawal" style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker
                                        placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" />
                                </div>
                                <div class="grid_5">
                                    <label c-label item="item" c-label-text="Tanggal Pulang Akhir"></label>
                                    <input disabled="true" id="tglpulgakhir" style="width: 100%"
                                        k-ng-model="item.tglakhir" kendo-datetimepicker
                                        placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" />
                                </div>
                            </div>
                            
                            <div class="grid_2">
                                <div class="grid_6">
                                    <label c-label item="item" c-label-text="Jenis Laporan"></label>
                                    <input  style="width: 100%;" kendo-combo-box k-ng-model="item.departement" k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDepartemen"  k-on-change="getIsiComboRuangan()"/>
                                </div>
                                <!-- <div class="grid_6">
                                    <label c-label item="item" c-label-text="Ruangan"></label>
                                    <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan" k-data-text-field="'namaruangan'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listRuangan"/>
                                    
                                </div> -->
                                <div class="grid_6">
                                    <label c-label item="item" c-label-text="Status Pasien"></label>
                                    <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box
                                        k-ng-model="item.StatuspasieN" k-data-text-field="'statuspasien'"
                                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                                        k-data-source="StatusPasien" />
                                </div>
                            </div>
                            <div class="grid_7">
                                <div class="grid_2">
                                    <label c-label item="item" c-label-text="Jenis Diagnosa"></label>
                                    <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.JenisDiagnosa" k-data-text-field="'jenisdiagnosa'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisDiagnosa"/>
                                </div>
                                <div class="grid_4">
                                    <label c-label item="item" c-label-text="Kode Diagnosa"></label>
                                    <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.Diagnosa" k-data-text-field="'kddiagnosa'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDiagnosa"/>
                                </div>
                                <div class="grid_4">
                                    <label c-label item="item" c-label-text="Nama Diagnosa"></label>
                                    <input ng-disabled="isDisable" style="width: 100%;" kendo-combo-box k-ng-model="item.Diagnosa" k-data-text-field="'namadiagnosa'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDiagnosa"/>
                                </div>
                                <div class="grid_1" style="margin-top: 10px;">
                                    <label c-label c-label-text=""></label>
                                    <em style="margin-top:-6px;" ng-click='SearchData()' id="iconButton"
                                        data-role="button" class="k-button k-button-icon k-primary" role="button"
                                        aria-disabled="false" tabindex="0"><span
                                            class="k-sprite k-icon k-i-search">Refresh</span></em>
                                    <em style="margin-top:-6px;" ng-click='ClearData()' id="iconButton"
                                        data-role="button" class="k-button k-button-icon k-primary" role="button"
                                        aria-disabled="false" tabindex="0"><span
                                            class="k-sprite k-icon k-i-cancel">Reset</span></em>
                                </div>
                            </div>
                        </div>
                        
                        <!-- <div class="grid_2" style="margin-top:28px">       
                            <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SearchData()"  style="width:100px"  ><span class="k-sprite k-icon k-i-search"></span>Cari </button>
                            <button class="k-button  k-button-icontext" ng-click="ClearData()"  style="width:100px" ><span class="k-sprite k-icon k-delete"></span>Clear</button>
                        </div> -->
                    </div>
                </fieldset>
               
                <div class="grid_12">
                    
                    <md-content>
                        <md-tabs md-dynamic-height md-border-bottom md-selected="myVar">
                            
                            <md-tab label="Data Indeks Penyakit">
                                <md-content class="md-padding">
                                    <div class="grid_12" style="margin-top: 10px;">
                                        <div class="grid_12 borderBox">
                                            <kendo-grid id="kGrid2" data-source="sourceLaporan" options="columnLaporan"
                                                k-selectable="'row'" k-sortable="'true'" class="max-height"
                                                k-resizable="'true'" k-ng-model="dataSelected"
                                                ng-click="klik(dataSelected)">
                                            </kendo-grid>
                                        </div>
                                    </div>
                                </md-content>
                            </md-tab>
                            <md-tab label="Diagnosa Per-Pasien">
                                <md-content class="md-padding">
                                    <div class="grid_12" style="margin-top: 10px;">
                                        <div class="grid_12 borderBox">
                                            <kendo-grid id="kGrid" data-source="dataSourceGridDiagnosapasien" options="columnGridDiagnosapasien"
                                                k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                                                k-ng-model="dataPasienSelected" ng-click="klikGrid(dataPasienSelected)">
                                            </kendo-grid>
                                        </div>
                                    </div>
                                </md-content>
                            </md-tab>
                            <md-tab label="jumlah Pasien Jiwa">
                                <md-content class="md-padding">
                                    <div class="grid_12" style="margin-top: 10px;">
                                        <div class="grid_12 borderBox">
                                            <kendo-grid id="kGrid" data-source="dataSourceGridDiagnosapasienjiwa"
                                                options="columnGridDiagnosapasienjiwa" k-selectable="'row'"
                                                k-sortable="'true'" k-resizable="'true'" k-ng-model="dataPasienSelected"
                                                ng-click="klikGrid(dataPasienSelected)">
                                            </kendo-grid>
                                        </div>
                                    </div>
                                </md-content>
                            </md-tab>
                            
                            
                        </md-tabs>
                    </md-content>
                </div>
                <div class="grid_12" style="margin-top:60px">
                    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
                </div>
            </div>                
        </div>
    </div>
</div>
