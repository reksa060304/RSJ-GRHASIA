<style>
	.style-center{
		display: inline-block;
		text-align: center;
		width: 100%;
	}

	.style-right{
		display: inline-block;
		text-align: right;
		width: 100%;
	}

	.style-left{
		display: inline-block;
		text-align: left;
		width: 100%;
	}
</style>
	<div class="grid_12 headerBox">
		<h1 style="color: white;"><b>Daftar Rekap Klaim BPJS</b></h1>
	</div>
	<div class="clear"></div>

	<br/>

	<!-- Kriteria -->
	<div class="grid_12">
		<!-- <div class="grid_12 headerBox containerBorderBox" style="padding:0px">
			<p>Kriteria</p>
		</div> -->
		<div class="grid_12 borderBox containerBorderBox">
			<!-- Periode Pulang -->
			<div class="grid_3">
				<div class="grid_12">
					<label c-label item="item" c-label-text="PeriodeTransaksi"></label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<!-- AwalPeriode -->
					<div class="grid_6">
						<div class="grid_12">
							<input style="width: 100%" k-ng-model="item.awalPeriode"  kendo-date-picker k-max="now" placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
						</div>
					</div>

					<!-- AkhirPeriode -->
					<div class="grid_6">
						<div class="grid_12">
							<input style="width: 100%" k-ng-model="item.akhirPeriode"  kendo-date-picker k-max="now" placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
						</div>
					</div>
					<div class="clear"></div>
				</div>
			</div>

            <div class="grid_2" style="margin-top: 10px;">
				<div class="grid_12">
					<label c-label item="item" c-label-text="Kelompok Pasien" real></label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokpasien" 
                    k-data-text-field="'kelompokpasienfix'" k-data-value-field="'kelompokpasienfix'" 
                    k-filter="'contains'" k-auto-bind="false" k-data-source="listKelompokPasien" />
				</div>
			</div>
			<!-- Button Search -->
			<div class="grid_1" style="margin-top:5px;">
				<div class="grid_12">
					<label>&nbsp;</label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<button class="btnTemplate1" ng-click="SearchData()">Cari</button>
				</div>
			</div>

			<!-- Button Clear -->
			<div class="grid_1" style="margin-top:5px;">
				<div class="grid_12">
					<label>&nbsp;</label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<button class="btnTemplate1" ng-click="ClearSearch()">Clear</button>
				</div>
			</div>
			
		</div>
	</div>
	<div class="clear"></div>

	<!-- Data Pasien Pulang -->
	<div class="grid_12">
		<div class="grid_12 headerBox">
			<p>Data Pasien Piutang</p>
		</div>
		<div class="clear"></div>

		<!-- grid table -->
		<div class="grid_12 borderBox">
			<div id="grid" kendo-grid 
			k-data-source="dataPasienPiutang" 
			k-selectable="'row'" 
			options="columnDataPasienPiutang"
			k-pageable="'true'"
			k-sortable="'true'"
			k-ng-model="dataPasienSelected">
		</div>
	</div>
	<div class="clear"></div>
</div>
