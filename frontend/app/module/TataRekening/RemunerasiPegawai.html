<style>
	.btn-disabled {
		background-color: red;
	}
	.btn-enabled {
		background-color: green;
	}
</style>
<div class="grid_12">
	<div class="grid_12 headerBox">
		<h1 style="color: white;"><b>Daftar Remunerasi Pegawai</b></h1>
	</div>

			<fieldset style="min-height:50px !important" align="left">
				<legend>
					<h2>Pencarian</h2>
				</legend>
				<div class="grid_12">
					<div class="grid_4">
						<div class="grid_4">
							<div class="grid_12">
								<label c-label item="item">Tgl Awal</label>
							</div>
							<div class="grid_12">
								<input style="width: 100%" k-ng-model="item.tglAwal" k-max="now"
									kendo-datepicker placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd'" />

							</div>
						</div>
						<div class="grid_4">
							<div class="grid_12">
								<label c-label item="item">Tgl Akhir</label>
							</div>
							<div class="grid_12">
								<input style="width: 100%" k-ng-model="item.tglAkhir" k-max="now"
									kendo-datepicker placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd'" />

							</div>
						</div>
					</div>

					<div class="grid_4 k-edit-buttons  k-state-default " style="margin-top:27px">
						<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SearchData()"
							style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
						<button class="k-button  k-button-icontext" ng-click="ClearData()" style="width:100px"><span
								class="k-sprite k-icon k-delete"></span>Clear</button>
					</div>
				</div>
			</fieldset>

	<div class="grid_12" style="margin-top: 10px;">
		<div class="grid_12" style="margin-top: 20px;">
			<div class="grid_12 borderBox">
				<kendo-grid options="mainGridOptions" k-data-source="dataSource" k-sortable="'true'" k-ng-model="current"
					ng-click="klik(current)">
					
				</kendo-grid>
			</div>

		</div>
	</div>
	
</div>
