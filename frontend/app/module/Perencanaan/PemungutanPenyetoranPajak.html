                                    <input style="width: 100%" k-ng-model="item.tglawal" kendo-datepicker placeholer="yyyy-mm-dd"
									k-format="'yyyy-MM-dd'" />
                                </div>
                            </div>
                        </div>
                        <div class="grid_5">
                            <div class="grid_12">
                                <div class="grid_12">
                                    <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datepicker placeholer="yyyy-mm-dd"
									k-format="'yyyy-MM-dd'" />
                                </div>
                            </div>
                        </div>
                        <div class="grid_2" style="margin-top: 5px;">
                            <button class="c-button" ng-click="cariFilter()">Cari</button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </fieldset>

        </div>

        <div class="grid_12" style="margin-top:50px;">
            <div class="grid_6">
                <div class="grid_12">
                    <div class="grid_4" >
                        <legend id="filterData">
                            <a ng-click="showAndHide()">Pemungutan Pajak</a>
                        </legend>
                    </div>
                    <div class="grid_12" style="margin-top:10px; margin-left: 10px;">
                        <div class="grid_3" style="text-align: left; margin-top: 10px;">
                            <label c-label item="item" c-label-text="Uraian Pajak"></label>
                        </div>
                        <div class="grid_9" style="margin-top: 10px;">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.uraianspjp" disabled/>
                        </div>
                    </div>
                </div>
                <div class="grid_12" style="margin-top:5px;">
                    <div class="grid_12 borderBox">
                        <kendo-grid id="grid" data-source="dataGridPemungutan" options="columnGridPemungutan" k-pageable="'true'"
                            k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"

                    </div>
                </div>
                <div class="grid_12" style="margin-top:5px;">
                    <div class="grid_4" >
                        <button class="btnTemplate1" ng-click="HapusPenyetoran()">Hapus</button>
                    </div>
                    <div class="grid_4"></div>
                    <div class="grid_4" >
                        <button class="btnTemplate1" ng-click="EntryPemungutan()">Entry</button>
                    </div>
                </div>
            </div>
        </div>


        <div class="grid_12" kendo-window="popupTambahPajak" k-title="'Entry Pemungutan Pajak'" k-visible="false" width="1000" style="overflow-x: hidden;">
            
            <div class="grid_12">
                    <div class="grid_12" style="text-align: left; margin-top: 10px;" ng-hide="true">
                        <label c-label item="item" c-label-text="Nomor Pajak"></label>
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input c-text-box type="input" class="k-textbox" ng-model="item.nopajak" disabled/>
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Uraian Pajak
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <!-- <input c-text-box type="input" class="k-textbox" ng-model="item.tolokUkurKeluaran"  /> -->
                        <textarea required class="k-textbox" style="    height: 76px;
                                            width: 100%;
                                            margin-top: 5px;
                                            resize: none;" ng-model="item.uraianPajak"></textarea>
                    </div>
                    <div class="grid_12 borderBox containerBorderBox" style="overflow-y: scroll; height:320px; margin-top: 50px;">
                        <legend id="filterData">
                            <a ng-click="showAndHide()">PPh:</a>
                        </legend>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;" >
                            Jenis PPh
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input kendo-combo-box k-ng-model="item.jenispajak"
                                k-data-text-field="'jenispajak'" k-data-value-field="'id'"
                                k-filter="'contains'" k-auto-bind="false"
                                k-data-source="listJenisPajak"  />
                        </div>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            Tanggal Penyetoran
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input style="width: 100%" k-ng-model="item.tglPPh" kendo-datepicker 
                            placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd'"/>
                        </div>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            Id Billing
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.idbillpph" />
                        </div>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            NTPN
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.ntpnpph" />
                        </div>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            <label c-label item="item" c-label-text="Jumlah Penyetoran"></label>
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.jumlahPPh" />
                        </div>
                        <input c-text-box type="input" class="k-textbox" style="border: none;" ng-model="item.jumlahPPhDinamis" />
                        <div class="grid_2" style="margin-top: 10px;">
                            <button class="btnTemplate1" ng-click="TambahPPh()">Tambah</button>
                        </div>
                        <div class="grid_12 borderBox" style="margin-top: 90px;">
                            <kendo-grid id="grid" data-source="dataGridPPh" options="columnGridPPh" k-pageable="'true'"
                                k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                                k-ng-model="dataSelectedPPh" ng-click="klikPPh(dataSelectedPPh)" style="min-height: 0px; max-height: 1500px;">
                            </kendo-grid>
                        </div>
                    </div>

                    <div class="grid_12 borderBox containerBorderBox" style="overflow-y: scroll; height:260px;">
                        <legend id="filterData">
                            <a ng-click="showAndHide()">PPn:</a>
                        </legend>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            Tanggal Pemungutan
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input style="width: 100%" k-ng-model="item.tglPPn" kendo-datepicker 
                            placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd'"/>
                        </div>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            Id Billing
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.idbillppn" />
                        </div>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            NTPN
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.ntpnppn" />
                        </div>
                        <div class="grid_12" style="text-align: left; margin-top: 10px;">
                            <label c-label item="item" c-label-text="Jumlah Penyetoran"></label>
                        </div>
                        <div class="grid_12" style="margin-top: 10px;">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.jumlahPPn" />
                        </div>
                        <input c-text-box type="input" class="k-textbox" style="border: none;" ng-model="item.jumlahPPnDinamis" />
                        <div class="grid_2" style="margin-top: 10px;">
                            <button class="btnTemplate1" ng-click="TambahPPN()">Tambah</button>
                        </div>
                        <div class="grid_12 borderBox" style="margin-top: 90px;">
                            <kendo-grid id="grid" data-source="dataGridPPN" options="columnGridPPN" k-pageable="'true'"
                                k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                                k-ng-model="dataSelectedPPN" ng-click="klikPPN(dataSelectedPPN)" style="min-height: 0px; max-height: 1500px;">
                            </kendo-grid>
                        </div>
                    </div>

            </div>
            
            <div class="grid_12" style="margin-top: 10px;">
                <div class="grid_8" ></div>
                <div class="grid_4" >
