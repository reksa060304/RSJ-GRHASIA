<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }

    .k-window-content .k-content {
        overflow: none
    }

    legend {
        cursor: pointer;
        padding: 10px;
    }

    .effect-shadow {
        -webkit-box-shadow: 2px 2px 5px #b6b6b6;
        -moz-box-shadow: 2px 2px 5px #b6b6b6;
        box-shadow: 2px 2px 5px #b6b6b6;
    }

    .warnaa {
        color: black
    }

    .align-right{
        text-align: right;
    }

    hr {
        border: 1px solid black;
        margin-top: 0px;
        margin-bottom: 0px;
        display: inline-block;
        width: 100%;
    }

    h1 {
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }

    h2 {
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }
</style>
<div class="grid_12">
    <div class="panel panel-default container_12">
        <div class="panel-heading" c-translate>LPJ</div>
    </div>
    <div class="panel panel-default panel-white" ng-hide="isMasuk">
        <fieldset class="effect-shadow" style=" border-radius: 4px">
            <legend id="filterData">
                <a ng-click="showAndHide()">
                    <h2><span class="fa fa-plus warnaa">
                        </span> &nbsp;Pencarian</h2>
                </a>
            </legend>
            <div class="grid_12" id="contentPencarian">
                <div class="grid_4" style="margin-top: 15px;">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Periode"></label>
                    </div>
                    <div class="grid_12">
                        <!-- AwalPeriode -->
                        <div class="grid_3">
                            <div class="grid_12">
                                <div class="grid_12">
                                    <input style="width: 100%" k-options="monthUngkul" k-ng-model="item.bulan"
                                        kendo-date-picker k-format="'MMMM'" />
                                </div>
                            </div>
                        </div>
                        <div class="grid_3">
                            <div class="grid_12">
                                <div class="grid_12">
                                    <input style="width: 100%" k-options="yearUngkul" k-ng-model="item.tahun" kendo-date-picker
                                        placeholer="YYYY" k-format="'yyyy'" />
                                </div>
                            </div>
                        </div>
                        <div class="grid_2" style="margin-top: 5px;">
                            <button class="c-button" ng-click="cariFilter()">Cari</button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </fieldset>

        <!-- Tabel Hasil Pencarian -->
        <div class="grid_12" style="margin-top:50px;">
            <div class="grid_12 borderBox">
                <kendo-grid id="grid" data-source="dataGrid" options="columnGrid" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 1500px;">
                </kendo-grid>
            </div>
            <div class="grid_2">
                <button class="btnTemplate1" ng-click="TambahLPJ()">Tambah</button>
            </div>
        </div>


        <div class="grid_12" kendo-window="popupTambahLPJ" k-title="'LPJ'" k-visible="false" width="1000" style="overflow-x: hidden;">
	
            <legend id="filterData">
                <a ng-click="showAndHide()">List SPJ</a>
            </legend>
            <div class="grid_12 borderBox">
                <kendo-grid id="grid" data-source="dataGridLPJ" options="columnGridLPJ" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;">
                </kendo-grid>
            </div>
            <div class="grid_12">
                    <div class="grid_12" style="text-align: left; margin-top: 10px;" >
                        Periode LPJ Bulan
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input kendo-combo-box k-ng-model="item.itembulan"
                            k-data-text-field="'bulan'" k-data-value-field="'id'"
                            k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listBulan"  />
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Jenis Bukti
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input kendo-combo-box k-ng-model="item.itemJenisBukti"
                            k-data-text-field="'jenisbukti'" k-data-value-field="'id'"
                            k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listJenisBukti"  />
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Tanggal LPJ
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input style="width: 100%" k-ng-model="item.tglLPJ" kendo-datetimepicker 
                        placeholer="yyyy-MM-dd" k-format="'yyyy-MM-dd HH:mm:ss'"/>
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Keterangan
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <!-- <input c-text-box type="input" class="k-textbox" ng-model="item.tolokUkurKeluaran"  /> -->
                        <textarea required class="k-textbox" style="    height: 76px;
                                            width: 100%;
                                            margin-top: 5px;
                                            resize: none;" ng-model="item.keteranganLPJ"></textarea>
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        <label c-label item="item" c-label-text="Nomor LPJ"></label>
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input c-text-box type="input" class="k-textbox" ng-model="item.nolpj" />
                    </div>
                
            </div>
            
            <div class="grid_12" style="margin-top: 10px;">
                <div class="grid_8" ></div>
                <div class="grid_4" >
                        <button class="btnTemplate1" ng-click="SaveLPJ()">Simpan</button>
                </div>
            </div>
        </div>
    </div>
</div>
