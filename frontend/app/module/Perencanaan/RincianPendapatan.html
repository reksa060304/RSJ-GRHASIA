<div>
    <c-panel item="item" header="'Rincian Pendapatan'" disabled>
    </c-panel>
    <div class="grid_12">
        

        <!-- <div class="grid_1" style="margin-top: 12px;">
            <button class="btnTemplate1" ng-click="Cari()">Cari</button>
        </div> -->
        <div class="grid_12">
            <div class="grid_12">
                <div class="grid_2" style="text-align: left;vertical-align: middle;">
                    PILIH SUMBER PENDAPATAN
                </div>
                <div class="grid_4">
                    <input kendo-combo-box k-ng-model="item.sumberPendapatan" k-data-text-field="'namaexternal'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listSumberPendapatan" />
                </div>
                <div class="grid_3">
                    <div class="grid_5">
                        <input type="checkbox" class="k-checkbox" id="perubahans" ng-model="item.perubahans"
                            value="true" ng-click="perubahans(item.perubahans)">
                        <label class="k-checkbox-label" for="perubahans"><b>Perubahan</b></label>
                    </div>
                    <div class="grid_5">
                        <input type="checkbox" class="k-checkbox" id="nonPerubahans" ng-model="item.nonPerubahans"
                            value="true" ng-click="nonPerubahans(item.nonPerubahans)">
                        <label class="k-checkbox-label" for="nonPerubahans"><b>Non Perubahan</b></label>
                    </div>
                </div>
                <div class="grid_2">
                    <label c-label item="item" c-label-text="Tahun Diperoleh"></label>
                    <input style="width: 100%" k-options="yearUngkul" k-ng-model="item.tahun" kendo-date-picker
                        placeholer="YYYY" k-format="'yyyy'" />
                </div>
            </div>
            <div class="grid_12">
                <div class="grid_2" style="text-align: left;">
                    RINCIAN URAIAN PENDAPATAN
                </div>
                <div class="grid_4">
                    <input kendo-combo-box k-ng-model="item.uraianPendapatan" k-data-text-field="'uraianpendapatan'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listUraianPendapatan" />
                </div>
                
                <div class="grid_2">
                    <button class="btnTemplate1" style="margin-left: 0;" ng-click="resetFilters()"> <i
                            class="fa fa-refresh"></i>Reset</button>
                </div>
            </div>
            <div class="grid_12 borderBox">
                <kendo-grid id="kGrids" k-data-source="dataSourceRincianPendapatan" k-selectable="'row'"
                    class="max-height" k-options="columnRincianPendapatan" k-ng-model="dataSelected"
                    ng-click="klikGrid(dataSelected)">
                    <!-- TambahSPJ editDetailSPJ item.searchSPJ -->
                </kendo-grid>
            </div>
        </div>

        <div class="clear"></div>

    </div>
</div>
<div kendo-window="popupTambahRincianPendapatan" k-title="'Rincian Pendapatan'" k-visible="false" k-width="800"
    k-height="500" k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12">
        <div class="grid_12">
            <div class="grid_12">
                <div class="grid_6">
                    <label c-label item="item" c-label-text="Tanggal"></label>
                    <input style="width: 100%" k-ng-model="itemRincian.tglinput" kendo-datetimepicker placeholer="yyyy-mm-dd"
                        k-format="'yyyy-MM-dd HH:mm'" />
                </div>
                <div class="grid_6">
                    <label c-label item="item" c-label-text="Tahun Diperoleh"></label>
                    <input style="width: 100%" k-options="yearUngkul" k-ng-model="itemRincian.tahun" kendo-date-picker
                        placeholer="YYYY" k-format="'yyyy'" />
                </div>
            </div>
            <div class="grid_12">
                <label c-label item="item">Pilih Sumber Pendapatan</label>
                <input kendo-combo-box k-ng-model="itemRincian.sumberPendapatan" k-data-text-field="'namaexternal'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                    k-data-source="listSumberPendapatan" />
            </div>
            <div class="grid_12">
                <label c-label item="item">Pilih Uraian Pendapatan</label>
                <input kendo-combo-box k-ng-model="itemRincian.uraianpendapatans" k-data-text-field="'uraianpendapatan'"
                    k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                    k-data-source="listUraianPendapatan" />
            </div>
            <div class="grid_6">
                <label c-label item="item">Uraian Pendapatan</label>
                <input c-text-box type="input" class="k-textbox" ng-model="itemRincian.uraianPendapatan"
                    style="text-align:right;" />
            </div>
            <div class="grid_6">
                <label c-label item="item">Jumlah Pendapatan</label>
                <input c-text-box type="text" class="k-textbox" ng-model="itemRincian.jumlahPendapatan"
                    style="text-align:right;" />
            </div>
            <div class="grid_12">
                <label c-label item="item">Keterangan</label>
                <textarea required class="k-textbox" style="height: 76px;
                width: 100%;
                margin-top: 5px;
                resize: none;" ng-model="itemRincian.keterangan"></textarea>
            </div>
            <div class="grid_12">
                <div class="grid_6">
                    <input type="checkbox" class="k-checkbox" id="perubahan" ng-model="itemRincian.perubahan"
                        value="true" ng-click="perubahan(itemRincian.perubahan)">
                    <label class="k-checkbox-label" for="perubahan">Perubahan</label>
                </div>
                <div class="grid_6">
                    <input type="checkbox" class="k-checkbox" id="nonPerubahan" ng-model="itemRincian.nonPerubahan"
                        value="true" ng-click="nonPerubahan(itemRincian.nonPerubahan)">
                    <label class="k-checkbox-label" for="nonPerubahan">Non Perubahan</label>
                </div>
            </div>
        </div>
        <div class="grid_12" style="margin-top: 10px;">
            <div class="grid_2" style="margin: 10px;">
                <button class="btnTemplate1" ng-click="simpanRincian()">Simpan</button>
            </div>
            <div class="grid_2" style="margin: 10px;">
                <button class="btnTemplate1" ng-click="batalRincian()">Batal</button>
            </div>
        </div>
    </div>
</div>
