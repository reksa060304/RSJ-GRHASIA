<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }

    .k-window-content .k-content {
        overflow: none
    }

    legend {
        cursor: pointer;
        padding: 10px;
    }

    .effect-shadow {
        -webkit-box-shadow: 2px 2px 5px #b6b6b6;
        -moz-box-shadow: 2px 2px 5px #b6b6b6;
        box-shadow: 2px 2px 5px #b6b6b6;
    }

    .warnaa {
        color: black
    }

    .align-right{
        text-align: right;
    }

    hr {
        border: 1px solid black;
        margin-top: 0px;
        margin-bottom: 0px;
        display: inline-block;
        width: 100%;
    }

    h1 {
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }

    h2 {
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }
</style>
<div class="grid_12">
    <div class="panel panel-default container_12">
        <div class="panel-heading" c-translate>Buku Kas Umum</div>
    </div>
    <div class="panel panel-default panel-white" ng-hide="isMasuk">
        <fieldset class="effect-shadow" style=" border-radius: 4px">
            <legend id="filterData">
                <a ng-click="showAndHide()">
                    <h2><span class="fa fa-plus warnaa">
                        </span> &nbsp;Pencarian</h2>
                </a>
            </legend>
            <div class="grid_12" id="contentPencarian">
                <div class="grid_6" style="margin-top: 15px;">
                    <div class="grid_12">
                        <!-- AwalPeriode -->
                        <div class="grid_3">
                            <div class="grid_12">
                                <label c-label item="item" c-label-text="Periode"></label>
                            </div>
                            <div class="grid_12">
                                <div class="grid_12">
                                    <input style="width: 100%" k-ng-model="item.tglawal" kendo-datepicker placeholer="yyyy-mm-dd"
                                    k-format="'yyyy-MM-dd'" />
                                </div>
                            </div>
                        </div>
                        <div class="grid_3">
                            <br>
                            <div class="grid_12">
                                <div class="grid_12">
                                    <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datepicker placeholer="yyyy-mm-dd"
                                    k-format="'yyyy-MM-dd'" />
                                </div>
                            </div>
                        </div>
                        <div class="grid_4">
                            <div class="grid_12">
                                <label c-label item="item" c-label-text="Nama Rekanan"></label>
                            </div>
                            <div class="grid_12">
                                <div class="grid_12">
                                    <input kendo-combo-box k-ng-model="item.namarekanan"
                                    k-data-text-field="'namarekanan'" k-data-value-field="'id'"
                                    k-filter="'contains'" k-auto-bind="false"
                                    k-data-source="listPihakKetiga"  />
                                </div>
                            </div>
                        </div>
                        <div class="grid_2" style="margin-top: 5px;">
                            <br>
                            <button class="c-button" ng-click="cariFilter()">Cari</button>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>

        <!-- Tabel Hasil Pencarian -->
        <div class="grid_12" style="margin-top:50px;">
            <div class="grid_12 borderBox">
                <kendo-grid id="gridl" data-source="dataGrid" options="columnGrid" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 1500px;">
                </kendo-grid>
            </div>
            <div class="grid_4">
                <div class="grid_3">
                    <p style="font-weight: bold; margin-top: 10px;">Cari Data BKU</p>
                </div>
                <div class="grid_9">
                    <input c-text-box type="input" class="k-textbox" ng-model="item.caridatabku"/>
                </div>
            </div>
            <div class="grid_5"></div>
            <div class="grid_2">
                <button class="btnTemplate1" ng-click="TambahBKU()">Tambah</button>
            </div>
        </div>


        <div class="grid_12" kendo-window="popupTambahBKU" k-title="'BKU'" k-visible="false" width="1000" style="overflow-x: hidden;">
	
            <legend id="filterData">
                <a ng-click="showAndHide()">List Jenis Bukti</a>
            </legend>
            <div class="grid_12 borderBox" ng-hide="hidepanjar">
                <kendo-grid id="grids" data-source="dataGridPanjar" options="columnGridPanjar" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidespm">
                <kendo-grid id="grid" data-source="dataGridSPM" options="columnGridSPM" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidejasgir">
                <kendo-grid id="gridj" data-source="dataGridJasaGiro" options="columnGridJasaGiro" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidests">
                <kendo-grid id="gridsts" data-source="dataGridSTS" options="columnGridSTS" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidepajak">
                <kendo-grid id="gridp" data-source="dataGridPajak" options="columnGridPajak" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidespj">
                <kendo-grid id="gridk" data-source="dataGridSPJ" options="columnGridSPJ" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12">
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Nomor BKU
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input c-text-box type="input" class="k-textbox" ng-model="item.nobku" disabled/>
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;" >
                        Tanggal BKU
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input style="width: 100%" k-ng-model="item.tglbku" kendo-datepicker placeholer="yyyy-mm-dd"
                                    k-format="'yyyy-MM-dd'" />
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Jenis Bukti
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <input kendo-combo-box k-ng-model="item.itemJenisBukti"
                            k-data-text-field="'jenisbukti'" k-data-value-field="'id'"
                            k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listJenisBukti"  />
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;" ng-hide="hiderekanan">
                        Nama Pihak Ketiga 
                    </div>
                    <div class="grid_12" ng-hide="hiderekanan">
                        <input kendo-combo-box k-ng-model="item.pihakKetiga"
                            k-data-text-field="'namarekanan'" k-data-value-field="'id'"
                            k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listPihakKetiga"  />
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Sumber Dana 
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.sumberDana"
                            k-data-text-field="'asalproduk'" k-data-value-field="'id'"
                            k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listAsalProduk"  />
                    </div>
                    <div class="grid_12" style="text-align: left; margin-top: 10px;">
                        Uraian BKU
                    </div>
                    <div class="grid_12" style="margin-top: 10px;">
                        <!-- <input c-text-box type="input" class="k-textbox" ng-model="item.tolokUkurKeluaran"  /> -->
                        <textarea required class="k-textbox" style="    height: 76px;
                                            width: 100%;
                                            margin-top: 5px;
                                            resize: none;" ng-model="item.uraianBKU"></textarea>
                    </div>
                    
                
            </div>
            
            <div class="grid_12" style="margin-top: 10px;">
                <div class="grid_8" ></div>
                <div class="grid_4" >
                        <button class="btnTemplate1" ng-click="SaveBKU()">Simpan</button>
                </div>
            </div>
        </div>


        <div class="grid_12" kendo-window="popupDetailBKU" k-title="'BKU'" k-visible="false" width="1000" style="overflow-x: hidden;">
            <div class="grid_12" style="text-align: left; margin-top: 10px;">
                Nomor BKU
            </div>
            <div class="grid_12" style="margin-top: 10px;">
                <input c-text-box type="input" class="k-textbox" ng-model="item.nobkudetail"/>
            </div>
            <div class="grid_12" style="text-align: left; margin-top: 10px;" >
                Tanggal BKU
            </div>
            <div class="grid_12" style="margin-top: 10px;">
                <input style="width: 100%" k-ng-model="item.tglbkudetail" kendo-datetimepicker placeholer="yyyy-mm-dd"
                            k-format="'yyyy-MM-dd HH:mm'" />
            </div>
            <legend id="filterData">
                <a ng-click="showAndHide()">List Jenis Bukti</a>
            </legend>
            <div class="grid_12 borderBox" ng-hide="hidepanjar">
                <kendo-grid id="grids" data-source="dataGridPanjar" options="columnGridPanjar" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidepengembalian">
                <kendo-grid id="grids" data-source="dataGridPengembalian" options="columnGridPengembalian" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidespm">
                <kendo-grid id="grid" data-source="dataGridSPM" options="columnGridSPM" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidejasgir">
                <kendo-grid id="gridj" data-source="dataGridJasaGiro" options="columnGridJasaGiro" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidests">
                <kendo-grid id="gridsts" data-source="dataGridSTS" options="columnGridSTS" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidepajak">
                <kendo-grid id="gridp" data-source="dataGridPajak" options="columnGridPajak" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12 borderBox" ng-hide="hidespj">
                <kendo-grid id="gridk" data-source="dataGridSPJ" options="columnGridSPJ" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)" style="min-height: 0px; max-height: 500px;" >
                </kendo-grid>
            </div>
            <div class="grid_12" style="margin-top: 10px;">
                <div class="grid_8" ></div>
                <div class="grid_4" >
                        <button class="btnTemplate1" ng-click="SaveBKUDetail()">Simpan</button>
                </div>
            </div>
        </div>
    </div>
</div>
