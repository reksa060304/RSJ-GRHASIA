<c-panel item="item" header="'REKAP SPJ DETAIL'">
    <div class="grid_12" style="margin-top: 2em;">
        <div class="grid_2">
            <label c-label item="item" c-label-text="Tanggal awal"></label>
            <input style="width: 100%" k-ng-model="item.tglawal" kendo-datepicker placeholer="yyyy-mm-dd"
                k-format="'yyyy-MM-dd'" />
        </div>

        <div class="grid_2">
            <label c-label item="item" c-label-text="Tanggal Akhir"></label>
            <input style="width: 100%" k-ng-model="item.tglakhir" kendo-datepicker placeholer="yyyy-mm-dd"
                k-format="'yyyy-MM-dd'" />
        </div>
        <div class="grid_2">
            <label c-label item="item" c-label-text="Status SPJ" real></label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="item.statusspj" k-data-text-field="'status'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listStatusSPJ" />
        </div>
        <div class="grid_2">
            <label c-label item="item" c-label-text="Sub Kegiatan" real></label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="item.kegiatansubsubspj"
                k-data-text-field="'keterangansubsubkegiatan'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listSubSubKegiatanspj" />
        </div>
        <div class="grid_2">
            <label c-label item="item" c-label-text="Asal Produk" real></label>
            <input style="width: 100%;" kendo-combo-box k-ng-model="item.asalproduk"
                k-data-text-field="'asalproduk'" k-data-value-field="'id'" k-filter="'contains'"
                k-auto-bind="false" k-data-source="listAsalProduk" />
        </div>
        <div class="grid_1" style="margin-top: 12px;">
            <button class="btnTemplate1" ng-click="CariSPJ()">Cari</button>
        </div>
        <div class="grid_12">

            <div class="grid_12 borderBox">
                <kendo-grid id="kGridsSPJ" k-data-source="dataSourceSPJ" k-selectable="'row'" class="max-height"
                    k-options="columnSPJ" k-ng-model="dataSPJSelected" ng-click="klikSPJ(dataSPJSelected)">
                    <!-- TambahSPJ editDetailSPJ item.searchSPJ -->
                </kendo-grid>
            </div>
        </div>

        <div class="clear"></div>

    </div>
</c-panel>
