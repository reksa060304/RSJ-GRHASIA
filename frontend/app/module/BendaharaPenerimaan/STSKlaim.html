<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }

    .k-window-content .k-content {
        overflow: none
    }

    legend {
        cursor: pointer;
        padding: 10px;
    }

    .effect-shadow {
        -webkit-box-shadow: 2px 2px 5px #b6b6b6;
        -moz-box-shadow: 2px 2px 5px #b6b6b6;
        box-shadow: 2px 2px 5px #b6b6b6;
    }

    .warnaa {
        color: black
    }

    .align-right{
        text-align: right;
    }

    hr {
        border: 1px solid black;
        margin-top: 0px;
        margin-bottom: 0px;
        display: inline-block;
        width: 100%;
    }

    h1 {
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }

    h2 {
        color: black;
        display: block;
        font-size: 14px;
        margin-block-start: 0px;
        margin-block-end: 0;
        margin-inline-start: 0px;
        margin-inline-end: 0px;
        font-weight: bold;
    }
</style>
<div class="grid_12">
    <div class="panel panel-default container_12">
        <div class="panel-heading" c-translate>Form Surat Tanda Setoran Klaim</div>
    </div>
    <div class="panel panel-default panel-white" ng-hide="isMasuk">
        <fieldset class="effect-shadow" style=" border-radius: 4px">
            <legend id="filterData">
                <a ng-click="showAndHide()">
                    <h2><span class="fa fa-plus warnaa">
                        </span> &nbsp;Pencarian</h2>
                </a>
            </legend>
            <div class="grid_12" id="contentPencarian">
                <div class="grid_12">
                    <div class="grid_4">
                        <div class="grid_6">
                            <label c-label item="item" c-label-text="Tanggal awal"></label>
                            <input style="width: 100%" k-ng-model="item.tglAwal" kendo-datetimepicker
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                        <div class="grid_6">
                            <label c-label item="item" c-label-text="Tanggal Akhir"></label>
                            <input style="width: 100%" k-ng-model="item.tglAkhir" kendo-datetimepicker
                                placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                        </div>
                    </div>
                    <div class="grid_2" style="margin-top: 10px;">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Kelompok Pasien" real></label>
                        </div>
                        <div class="clear"></div>
        
                        <div class="grid_12">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokpasien" 
                            k-data-text-field="'kelompokpasienfix'" k-data-value-field="'kelompokpasienfix'" 
                            k-filter="'contains'" k-auto-bind="false" k-data-source="listKelompokPasien" />
                        </div>
                    </div>
                    <div class="grid_2">
                        Status STS
                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.statusSTS"
                            k-data-text-field="'names'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="listStatusSTS" />
                    </div>
                    <div class="grid_2">
                        No STS
                        <input c-text-box type="input" class="k-textbox" ng-model="item.Nosts"
                                />
                    </div>
                    <div class="grid_1" style="margin-top: 20px;">
                        <button class="c-button" ng-click="cariFilter()">Cari</button>
                    </div>
                    </div>
                </div>
            </div>
        </fieldset>

        <!-- Tabel Hasil Pencarian -->
        <div class="grid_12">
            <div class="grid_1" style="margin-top: 50px">
                <input type="checkbox" class="k-checkbox" id="item.kasusbaru"
                    ng-model="item.kasusbaru"
                    ng-click="checkboxClicked()">
                <label class="k-checkbox-label" for="item.kasusbaru">Pilih Semua</label>
            </div>
            <div class="grid_11" style="margin-top: 50px"></div>
        </div>
        <div class="grid_12" style="margin-top:10px;">
            <div class="grid_12 borderBox">
                <kendo-grid id="grid" data-source="dataGrid" options="columnGrid" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'true'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)">
                </kendo-grid>
            </div>
        </div>
        <div class="grid_2" style="margin-top: 15px;">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Total Setor"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.totalSetor" />
			</div>

		</div>
        <div class="grid_2" style="margin-top: 15px;">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Terbilang"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.terbilang" />
			</div>
		</div>
        <div class="grid_1" style="margin-top: 15px;">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Data Dipilih"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.dipilih" />
			</div>
		</div>
        <div class="grid_2" style="margin-top: 15px;">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Tanggal STS"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input style="width: 100%" k-ng-model="item.tanggalSTS" kendo-datetimepicker
						placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
			</div>
		</div>
        <div class="grid_2" style="margin-top: 15px;">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Uraian"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.uraian" />
			</div>
		</div>
        <div class="grid_3" style="margin-top: 15px;"></div>
        <div class="grid_12" style="margin-top: 15px;">
            <div class="grid_8" ng-include='"../app/template/Shared/TemplateLoading"'></div>
            <div class="grid_4" style="float:right;">
                <div class="grid_2"></div>
                <div class="grid_3">
                    <button class="c-button" ng-click="cetakpdf()">Cetak PDF</button>
                </div>
                <div class="grid_3">
                    <button class="c-button" ng-click="simpanSTS()">Simpan STS</button>
                </div>
                <div class="grid_2">
                    <button class="c-button" ng-click="detail()">Detail STS</button>
                </div>
                <div class="grid_2">
                    <button class="c-button" ng-click="batal()">Batal STS</button>
                </div>
            </div>
        </div>

        <div class="grid_12" style="margin-top: 50px;">
            <div class="grid_12 borderBox">
                <kendo-grid id="gridsts" data-source="dataSTS" options="columnSTS" k-pageable="'true'"
                    k-sortable="'true'" k-groupable="'true'" k-resizable="'true'" k-selectable="'row'"
                    k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)">
                </kendo-grid>
            </div>
        </div>

        <div class="grid_12" hidden="">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.terbilangsts" />
        </div>
        <div class="grid_12" hidden="">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.totalsts" />
        </div>
        <div class="grid_12" hidden="">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nosts" />
        </div>
        <div class="grid_12" hidden="">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.tglpenerimaansts" />
        </div>
        <div class="grid_12" hidden="">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.carabayarsts" />
        </div>
        <div class="grid_12" hidden="">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namasts" />
        </div>
    </div>
</div>
