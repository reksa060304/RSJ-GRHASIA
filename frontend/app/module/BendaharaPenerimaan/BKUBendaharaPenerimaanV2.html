		display: inline-block;
		text-align: center;
		width: 100%;
	}

	.style-right {
		display: inline-block;
		text-align: right;
		width: 100%;
	}

	.style-left {
		display: inline-block;
		text-align: left;
		width: 100%;
	}

	.k-grid .k-grid-header .k-header .k-link {
		height: auto;
	}

	.k-grid .k-grid-header .k-header {
		white-space: normal;
	}

	.k-grid .k-grid-header .k-header {
		text-align: center;
	}

	button:disabled {
		background: #B5B2B1;
	}

<div class="grid_12" style="margin-top:60px">
	<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>

<div class="grid_12 headerBox">
	<h1 style="color: white;"><b>Buku Kas Umum V2</b></h1>
</div>
<!-- Kriteria -->
<div class="grid_12">
	<div class="grid_12 borderBox containerBorderBox">
		<div class="grid_2" ng-show="isNamaPerkiraan">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Nama Perkiraan"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPerkiraan" />
			</div>
		</div>

		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="No STS"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.nosts" />
			</div>
		</div>
		<div class="grid_2">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Keterangan"></label>
			</div>
			<div class="clear"></div>

			<div class="grid_12">
				<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.uraian" />
			</div>
		</div>
		<!-- JenisTransaksi -->
		<!-- <div class="grid_2">
				<div class="grid_12">
					<label c-label item="item">Sumber Dana</label>
				</div>
				<div class="clear"></div>

				<div class="grid_12">
					<input style="width: 100%;" kendo-combo-box k-ng-model="item.asalProduk"
						k-data-text-field="'asalproduk'" k-data-value-field="'id'" k-filter="'contains'"
						k-auto-bind="false" k-data-source="listAsalProduk" ng-disabled="txtDisable" />
				</div>
			</div> -->
		<!-- Periode -->
		<div class="grid_4">
			<div class="grid_12">
				<label c-label item="item" c-label-text="Periode"></label>
			</div>

			<div class="grid_12" style="margin-top: -5px">
				<!-- PeriodeAwal -->
				<div class="grid_6">
					<div class="grid_12">
						<input style="width: 100%" k-ng-model="item.tglAwal" kendo-date-picker k-max="now"
							placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
					</div>
				</div>

				<!-- PeriodeAkhir -->
				<div class="grid_6">
					<div class="grid_12">
						<input style="width: 100%" k-ng-model="item.tglAkhir" kendo-date-picker k-max="now"
							placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
					</div>
				</div>
			</div>
		</div>
		<div class="grid_2 k-edit-buttons  k-state-default " style="margin-top:23px">
			<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SearchData()"
				style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
		</div>
	</div>
</div>


<!-- MonitoringRekeningKoran -->
<div class="grid_12">
	<div class="grid_12 headerBox">
		<p>Daftar BKU</p>
		<kendo-grid id="kGrids" k-groupable="true" data-source="dataSource" options="columnGrid" k-selectable="'row'"
			k-sortable="'true'" k-resizable="'true'" k-ng-model="dataSelected" ng-click="klikGrid(dataSelected)">
		</kendo-grid>
	</div>

    <div style="margin-top: 4em;" class="grid_12">
        <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="handlePopUpCetak()">Cetak BKU</button>
    </div>
</div>


<div kendo-window="popUpCetak" k-title="'Cetak'" k-width="800" k-visible="false">
	<div class="panel panel-default container_12">
        <div class="grid">
            <div class="grid_12">
                <h2 id="filterData">
                    <b>Filter Cetak</b>
                </h2>
            </div>

            <div class="grid_12" style="margin-top: 2em">
				
				<div class="grid_6">
                    <div class="grid_12">
                        <label for="">Tgl BKU</label>
                    </div>
					<div class="grid_12">
						<input style="width: 100%;" k-ng-model="item.tglbkucetak" kendo-date-picker placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
					</div>
				</div>

				<div class="grid_6">
                    <div class="grid_12">
                        <label for="">Tgl Cetak</label>
                    </div>
					<div class="grid_12">
						<input style="width: 100%;" k-ng-model="item.tglcetak" kendo-date-picker placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
					</div>
				</div>
			</div>
    
            <div class="grid_12" style="margin-top: 3em;">
                <button class="k-button  k-button-icontext" ng-click="batalCetak()">
                    <span class="k-icon k-cancel"></span>
                    Batal
                </button>
                <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="cetakLaporan()" >
                    <span class="k-icon k-update"></span>
                    Cetak
                </button>
            </div>
        </div>
        
	</div>
</div>

<!-- start penerimaan -->
<div kendo-window="popUpPenerimaan" k-title="'Penerimaan'" k-width="800" k-height="500" 
     k-visible="false" k-on-open="isBendaharaPenerimaan = true" 
     k-on-close="isBendaharaPenerimaan = false">
	<div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="grid">
            <div class="grid_12">
                <h2 id="filterData">
                    <b><label ng-click="showAndHide()">List Jenis Bukti</label></b>
                </h2>
    
                <div class="grid_12 borderBox" ng-hide="hidests">
                    <kendo-grid id="gridsts" data-source="dataGridSTS" options="columnGridSTS" k-pageable="'true'"
                        k-sortable="'true'" k-groupable="'false'" k-resizable="'true'" k-selectable="'row'"
                        k-ng-model="dataSelectedsts" ng-click="klikGridsts(dataSelectedsts)"
                        style="min-height: 0px; max-height: 500px;">
                    </kendo-grid>
                </div>
            </div>
    
            <div style="margin-top: 1em;" class="grid_12">
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Jenis Bukti</label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.itemJenisBukti" k-data-text-field="'jenisbukti'"
                            k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                            k-data-source="listJenisBukti" />
                    </div>
                </div>
    
                <div class="grid_12">
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label item="item">Sumber Dana</label>
                        </div>
        
                        <div class="grid_12">
                            <input kendo-combo-box k-ng-model="item.asalProduk"
                                k-data-text-field="'asalproduk'" k-data-value-field="'id'" k-filter="'contains'"
                                k-auto-bind="false" k-data-source="listAsalProduk" ng-disabled="txtDisable" />
                        </div>
                    </div>
        
                    <div class="grid_4" ng-if="item.itemJenisBukti.jenisbukti === 'Surat Tanda Setoran'">
                        <div class="grid_12">
                            <label c-label item="item">No. STS</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noSTS" />
                        </div>
                    </div>
        
                    <div class="grid_4">
        
                        <div class="grid_12">
                            <label c-label item="item">Tanggal</label>
                        </div>
                        <div class="grid_12">
                            <input k-ng-model="item.tglbku" kendo-date-picker k-max="now"
                                placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
                        </div>
                    </div>
                </div>
    
                <div class="grid_12">
                    <div class="grid_6">
                        <div class="grid_12">
                            <label c-label item="item">Uraian</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" class="k-textbox" ng-model="item.uraian" />
                        </div>
                    </div>
                </div>			
                
                <div class="grid_12">
                    <div class="grid_6">
                        <div class="grid_12">
                            <label c-label item="item">Total Setoran</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="numeric" class="k-textbox" ng-model="item.jumlah"
                                ng-disabled="txtDisable">
                        </div>
                    </div>
                    <div class="grid_6">
                        <div class="grid_12">
                            <label c-label item="item">Terbilang</label>
                        </div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.terbilang"
                                ng-disabled="true" />
                        </div>
                    </div>
                </div>
                <!-- </fieldset> -->
            </div>
        </div>
        
		<div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
			<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SavePenerimaan()"><span
					class="k-icon k-update"></span>Simpan</button>
			<button class="k-button  k-button-icontext" ng-click="batalPenerimaan()"><span
					class="k-icon k-cancel"></span>Batal</button>
		</div>
	</div>
</div>
<!-- end penerimaan -->

<!-- start pengelurarn -->

                <div class="grid_12 borderBox" ng-hide="hidests">

                    <div class="grid_12">
                        <label c-label item="item">Tanggal</label>

                            placeholer="dd-mm-yyyy" k-format="'dd-MM-yyyy'" />
                    </div>
                </div>
    
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Uraian</label>
                    </div>
                    <div class="clear"></div>
    
                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.uraian" />
                    </div>
                </div>

                <div class="grid_12">
                    <div class="grid_6">
                        <div class="grid_12">
                            <label c-label item="item">Total Setoran</label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="numeric" class="k-textbox" ng-model="item.jumlah"
                                ng-disabled="txtDisable">
                        </div>
                    </div>
                    <div class="grid_6">
    
                        <div class="grid_12">
                            <label c-label item="item">Terbilang</label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.terbilang"
                                ng-disabled="true" />
                        </div>
                    </div>
                </div>
                <!-- </fieldset> -->
            </div>
        </div>
		<div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
			<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SavePengeluaran()"><span
					class="k-icon k-update"></span>Simpan</button>
			<button class="k-button  k-button-icontext" ng-click="batalPenerimaan()"><span
					class="k-icon k-cancel"></span>Batal</button>
		</div>
	</div>
</div>
<!-- end penegluaran -->
