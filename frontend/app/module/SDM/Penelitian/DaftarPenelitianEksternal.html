<div class="panel panel-default container_12">
	<div class="panel-heading" c-translate>Daftar Kegiatan Diklat Eksternal</div>
	
</div>
<div>
	<div class="grid_12">
		<div ng-cloak>
			<md-content>
				<md-tabs md-dynamic-height md-border-bottom md-selected="myVar">
					<md-tab label="Daftar kegiatan diklat">
						<md-content class="md-padding">
							<div class="panel-body">
								<fieldset style="min-height:50px !important" align="left">
									<legend>
										<h2>Pencarian</h2>
									</legend>
									<div class="grid_12">
										<div class="grid_2">
											<div class="grid_12" style="margin-top: 6px;">
												<label c-label item="item">Institusi Pendidikan</label>
											</div>
											<div class="grid_12">
												<input c-text-box type="input" filter="" class="k-textbox"
													ng-model="item.institusipendidikan" />
											</div>
										</div>
										<div class="grid_4">
											<div class="grid_6">
												<label c-label item="item" c-label-text="Tanggal awal"></label>
												<input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker
													placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
											</div>
											<div class="grid_6">
												<label c-label item="item" c-label-text="Tanggal Akhir"></label>
												<input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker
													placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
											</div>
										</div>
										<div class="grid_2">
											<div class="grid_12" style="margin-top: 6px;">
												<label c-label>Kegiatan</label>
												<div class="grid_12">
													<input style="width: 100%;" kendo-combo-box k-ng-model="item.kegiatandiklat"
														k-data-text-field="'detailjenisproduk'" k-data-value-field="'id'" k-filter="'contains'"
														k-auto-bind="false" k-data-source="listKegiatan" />
												</div>
											</div>
										</div>
										<div class="grid_2">
											<div class="grid_12" style="margin-top: 6px;">
												<label c-label>Status Bayar</label>
												<div class="grid_12">
													<input style="width: 100%;" kendo-combo-box k-ng-model="item.statusbayar"
														k-data-text-field="'statusbayar'" k-data-value-field="'id'" k-filter="'contains'"
														k-auto-bind="false" k-data-source="listStatusBayar" />
												</div>
											</div>
										</div>
										<div class="grid_2">
											<div class="grid_12" style="margin-top: 6px;">
												<label c-label>Status Verifikasi</label>
												<div class="grid_12">
													<input style="width: 100%;" kendo-combo-box k-ng-model="item.statusverif"
														k-data-text-field="'statusverif'" k-data-value-field="'id'" k-filter="'contains'"
														k-auto-bind="false" k-data-source="listStatusVerif" />
												</div>
											</div>
										</div>
										
									</div>
									<div class="grid_12">
										<div class="grid_1" style="margin-right: 10px;">
											<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SearchData()"
												style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
										</div>
										<div class="grid_1">
											<button class="k-button k-button-icontext" ng-click="ClearData()" style="width:100px"><span
													class="k-sprite k-icon k-delete"></span>Clear</button>
										</div>
									</div>
								</fieldset>
								<div class="grid_12" style="margin-top: 10px;">
									<kendo-grid k-data-source="DataPenelitian" k-selectable="'row'" k-options="columnPenelitian2"
										k-ng-model="current" ng-click="kl(current)">
										<div k-detail-template>
											<kendo-tabstrip>
												<div id="kGridDetail" kendo-grid k-options="data2(dataItem)" k-selectable="'row'" k-sortable="'true'"
													k-resizable="'true'" k-ng-model="dataSelected2" ng-click="klikDetail(dataSelected2)">
												</div>
											</kendo-tabstrip>
										</div>
									</kendo-grid>
								</div>
								<div class="grid_12" style="margin-top: 10px;">
									<kendo-grid k-data-source="DataPenelitian" k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
										k-options="columnPenelitian"
										k-ng-model="current" ng-click="kl(current)">
									</kendo-grid>
								</div>
								<div class="grid_12" style="margin-top:60px">
									<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
								</div>
								<div class="grid_12">
									<div class="grid_3">
										<button ng-show="!isLoading" class="c-button primary"
											style="width: 99.5%; font-size: 24px; padding:0px; margin:0px; text-align: center;" item="item"
											size="36" position="'right'" is-validate ng-click="tambahmahasiswa()">
											<span class="title">Tambah Mahasiswa</span>
										</button>
									</div>
									<div class="grid_3">
										<button ng-show="!isLoading" class="c-button success"
											style="width: 99.5%; font-size: 24px; padding:0px; margin:0px; text-align: center;" item="item"
											size="36" position="'right'" is-validate ng-click="Ubah()">
											<span class="title">Ubah</span>
										</button>
									</div>
									<div class="grid_3">
										<button ng-show="!isLoading" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;"
											item="item" size="36" position=" 'right'" class="c-button cancel" ng-click="Hapus()">
											<span class="title">Hapus</span>
										</button>
									</div>
									<div class="grid_3">
										<button ng-show="verif" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;" item="item"
											size="36" position="'right'" class="c-button primary" ng-click="verifikasi()">
											<span class="title">Verifikasi</span>
										</button>
										<button ng-show="batalverif" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;background-color: yellow;color: black; font-weight: bold;"
											item="item" size="36" position=" 'right'" class="c-button" ng-click="batalverifikasi()">
											<span class="title">Batal Verifikasi</span>
										</button>
									</div>
									<div class="grid_3">
										<button ng-show="tagih" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;" item="item"
											size="36" position="'right'" class="c-button primary" ng-click="tagihan()">
											<span class="title">Verif Tagihan</span>
										</button>
										<button ng-show="unveriftagih"
											style="width: 99.5%; font-size: 24px; padding:0px; margin: 0px;background-color: yellow;color: black; font-weight: bold;"
											item="item" size="36" position="'right'" class="c-button" ng-click="unveriftagihan()">
											<span class="title">Unverif Tagihan</span>
										</button>
									</div>
									<div class="grid_3">
										<button ng-show="tglpembayaran" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;" item="item" size="36"
											position="'right'" class="c-button primary" ng-click="tglbayar()">
											<span class="title">Tgl Pembayaran</span>
										</button>
									</div>
								</div>
							</div>
						</md-content>
					</md-tab>
					<md-tab label="daftar mahasiswa aktif" ng-disabled ="daftarmahasiswa">
						<md-content class="md-padding">
							<div class="panel-body">
								<fieldset style="min-height:50px !important" align="left">
									<legend>
										<h2>Pencarian</h2>
									</legend>
									<div class="grid_12">
										<div class="grid_4">
											<!-- <div class="grid_6">
												<label c-label item="item" c-label-text="Tanggal Mulai"></label>
												<input style="width: 100%" k-ng-model="item.tanggalmulai" kendo-datetimepicker
													placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
											</div> -->
											<div class="grid_6">
												<div class="grid_12">
													<label c-label item="item">Institusi Pendidikan</label>
													<input c-text-box type="input" filter="" class="k-textbox" ng-model="itemMa.institusipendidikan" />
												</div>
											</div>
											<div class="grid_6">
												<div class="grid_12">
													<label c-label item="item">Mahasiswa</label>
													<input c-text-box type="input" filter="" class="k-textbox" ng-model="itemMa.mahasiswa" />
												</div>
											</div>
											<div class="grid_6">
												<label c-label item="item" c-label-text="Jenis Kegiatan"></label>
												<input style="width: 100%;" kendo-combo-box k-ng-model="item.jeniskegiatan"
													k-data-text-field="'diklatkategori'" k-data-value-field="'id'" k-filter="'contains'"
													k-auto-bind="false" k-data-source="listJenisKegiatan" />
											</div>
											<!-- <div class="grid_6">
												<label c-label item="item" c-label-text="Tanggal Selesai"></label>
												<input style="width: 100%" k-ng-model="item.tanggalselesai" kendo-datetimepicker
													placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
											</div> -->
										</div>
										
										<div class="grid_2 k-edit-buttons  k-state-default " style="margin-top:27px">
											<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SearchDataMahasiswa()"
												style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
											<button class="k-button  k-button-icontext" ng-click="ClearData()" style="width:100px"><span
													class="k-sprite k-icon k-delete"></span>Clear</button>
										</div>
									</div>
								</fieldset>
								<div class="grid_12" style="margin-top: 10px;">
									<kendo-grid id="kGrid" k-data-source="DataMahasiswaAktif"
										k-options="columnMahasiswaAktif"
										k-ng-model="current">
									</kendo-grid>
								</div>
								<div class="grid_12" style="margin-top:60px">
									<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
								</div>
							</div>
						</md-content>
					</md-tab>
					<md-tab label="detail mahasiswa" ng-disabled="daftarmahasiswa">
						<md-content class="md-padding">
							<div class="panel-body">
								<fieldset style="min-height:50px !important" align="left">
									<legend>
										<h2>Pencarian</h2>
									</legend>
									<div class="grid_12">
										<div class="grid_10">
											<div class="grid_4">
												<label c-label item="item" c-label-text="Instansi"></label>
												<input style="width: 100%;" kendo-combo-box k-ng-model="item.instansi"
													k-data-text-field="'datakampus'" k-data-value-field="'id'" k-filter="'contains'"
													k-auto-bind="false" k-data-source="listInstansi" />
											</div>
											<div class="grid_4">
												<label c-label item="item" c-label-text="Bulan" real></label>
												<input style="width: 100%" k-options="monthUngkul" k-ng-model="item.bulan" kendo-date-picker
													placeholer="MMMM" k-format="'MM'" />
											</div>
											<div class="grid_4">
												<label c-label item="item" c-label-text="Tahun" real></label>
												<input style="width: 100%" k-options="yearUngkul" k-ng-model="item.tahun" kendo-date-picker
													placeholer="YYYY" k-format="'yyyy'" />
											</div>
										</div>
										<div class="grid_10">
											
											<div class="grid_4">
												<label c-label item="item" c-label-text="Kegiatan" real></label>
												<input style="width: 100%;" kendo-combo-box k-ng-model="item.kegiatan"
													k-data-text-field="'detailjenisproduk'" k-data-value-field="'id'" k-auto-bind="false"
													k-data-source="listKegiatan" />
											</div>
											<div class="grid_4">
												<label c-label item="item" c-label-text="Pendidikan" real></label>
												<input style="width: 100%;" kendo-combo-box k-ng-model="item.pendidikan" k-data-text-field="'pendidikan'"
													k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listPendidikan" />
											</div>
											<div class="grid_4">
												<label c-label item="item" c-label-text="Jenis Kegiatan" real></label>
												<input style="width: 100%;" kendo-combo-box k-ng-model="item.jeniskegiatan"
													k-data-text-field="'diklatkategori'" k-data-value-field="'id'" k-filter="'contains'"
													k-auto-bind="false" k-data-source="listJenisKegiatan" />
											</div>
											
										</div>
										<div class="grid_2">
											<div class="grid_12" style="margin-top:27px">
												<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="searchDetailMahasiswa()"
													style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
												<button class="k-button  k-button-icontext" ng-click="ClearData()" style="width:100px"><span
														class="k-sprite k-icon k-delete"></span>Clear</button>
											</div>
										</div>

									</div>

								</fieldset>
								<div class="grid_12" style="margin-top: 10px;">
									<kendo-grid id="kGrid" k-data-source="dataDetailMahasiswaGrid" k-options="columnDetailMahasiswaGrid"
										k-ng-model="current">
									</kendo-grid>
								</div>
								<div class="grid_12" style="margin-top:60px">
									<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
								</div>
							</div>
						</md-content>
					</md-tab>
				</md-tabs>
			</md-content>
		</div>
	</div>
</div>
