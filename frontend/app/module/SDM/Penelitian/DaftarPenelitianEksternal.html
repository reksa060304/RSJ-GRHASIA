<div class="panel panel-default container_12">
	<div class="panel-heading" c-translate>Daftar Kegiatan Diklat Eksternal</div>
	<div class="panel-body">
		<fieldset style="min-height:50px !important" align="left">
			<legend>
				<h2>Pencarian</h2>
			</legend>
			<div class="grid_12">
				<div class="grid_2">
					<div class="grid_12" style="margin-top: 6px;">
						<label c-label item="item">Institusi Pendidikan</label>
					</div>
					<div class="grid_12">
						<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.institusipendidikan" />
					</div>
				</div>
				<div class="grid_4">
					<div class="grid_6">
						<label c-label item="item" c-label-text="Tanggal awal"></label>
						<input style="width: 100%" k-ng-model="item.tglawal" kendo-datetimepicker
							placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
					</div>
					<div class="grid_6">
						<label c-label item="item" c-label-text="Tanggal Akhir"></label>
						<input style="width: 100%" k-ng-model="item.tglakhir" kendo-datetimepicker
							placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd HH:mm'" />
					</div>
				</div>
				<div class="grid_2 k-edit-buttons  k-state-default " style="margin-top:27px">
					<button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SearchData()"
						style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
					<button class="k-button  k-button-icontext" ng-click="ClearData()" style="width:100px"><span
							class="k-sprite k-icon k-delete"></span>Clear</button>
				</div>
			</div>
		</fieldset>
		<div class="grid_12" style="margin-top: 10px;">
			<kendo-grid k-data-source="DataPenelitian" k-selectable="'row'" k-options="columnPenelitian"
				k-ng-model="current" ng-click="kl(current)">
			</kendo-grid>
		</div>
		<div class="grid_12" style="margin-top:60px">
			<div ng-include='"../app/template/Shared/TemplateLoading"'></div>
		</div>
		<div class="grid_12">
			<div class="grid_3">
				<button ng-show="!isLoading" class="c-button primary"
					style="width: 99.5%; font-size: 24px; padding:0px; margin:0px; text-align: center;" item="item"
					size="36" position="'right'" is-validate ng-click="tambahmahasiswa()" >
					<span class="title">Tambah Mahasiswa</span>
				</button>
			</div>
			<div class="grid_3">
				<button ng-show="!isLoading" class="c-button success"
					style="width: 99.5%; font-size: 24px; padding:0px; margin:0px; text-align: center;" item="item"
					size="36" position="'right'" is-validate ng-click="Ubah()" >
					<span class="title">Ubah</span>
				</button>
			</div>
			<div class="grid_3">
				<button ng-show="!isLoading" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;"
					item="item" size="36" position=" 'right'" class="c-button cancel" ng-click="Hapus()">
					<span class="title">Hapus</span>
				</button>
			</div>
			<div class="grid_3">
				<button ng-show="verif" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;" item="item"
					size="36" position="'right'" class="c-button primary" ng-click="verifikasi()">
					<span class="title">Verifikasi</span>
				</button>
				<button ng-show="batalverif" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;" item="item" size="36"
					position=" 'right'" class="c-button primary" ng-click="batalverifikasi()">
					<span class="title">Batal Verifikasi</span>
				</button>
			</div>
			<div class="grid_3">
				<button ng-show="tagih" style="width: 99.5%; font-size: 24px; padding:0px; margin:0px;" item="item" size="36"
					position="'right'" class="c-button primary" ng-click="tagihan()">
					<span class="title">Verif Tagihan</span>
				</button>
				<button ng-show="unveriftagih" style="width: 99.5%; font-size: 24px; padding:0px; margin: 0px;" item="item" size="36"
					position="'right'" class="c-button primary" ng-click="unveriftagihan()">
					<span class="title">Unverif Tagihan</span>
				</button>
			</div>
		</div>
	</div>
</div>
