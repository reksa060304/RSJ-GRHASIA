<div class="panel panel-default container_12">
    <div class="panel-heading" c-translate>Aspek Penilaian Mahasiswa</div>
</div>
<div class="grid_12">
    <div ng-cloak>
        <md-content>
            <md-tabs md-dynamic-height md-border-bottom md-selected="myVar">
                <md-tab label="Aspek penilaian Mahasiswa">
                    <md-content class="md-padding">
                        <div class="panel-body">
                            <fieldset style="min-height:50px !important" align="left">
                                <legend>
                                    <h2>Pencarian</h2>
                                </legend>
                                <div class="grid_12">
                                    <div class="grid_10">
                                        <div class="grid_4">
                                            <label c-label item="item" c-label-text="Instansi"></label>
                                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.instansi"
                                                k-data-text-field="'datakampus'" k-data-value-field="'id'"
                                                k-filter="'contains'" k-auto-bind="false"
                                                k-data-source="listInstansi" />
                                        </div>
                                        <div class="grid_4">
                                            <label c-label item="item" c-label-text="Bulan" real></label>
                                            <input style="width: 100%" k-options="monthUngkul" k-ng-model="item.bulan"
                                                kendo-date-picker placeholer="MMMM" k-format="'MM'" />
                                        </div>
                                        <div class="grid_4">
                                            <label c-label item="item" c-label-text="Tahun" real></label>
                                            <input style="width: 100%" k-options="yearUngkul" k-ng-model="item.tahun"
                                                kendo-date-picker placeholer="YYYY" k-format="'yyyy'" />
                                        </div>
                                    </div>
                                    <div class="grid_10">

                                        <div class="grid_4">
                                            <label c-label item="item" c-label-text="Kegiatan" real></label>
                                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.kegiatan"
                                                k-data-text-field="'detailjenisproduk'" k-data-value-field="'id'"
                                                k-auto-bind="false" k-data-source="listKegiatan" />
                                        </div>
                                        <div class="grid_4">
                                            <label c-label item="item" c-label-text="Pendidikan" real></label>
                                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.pendidikan"
                                                k-data-text-field="'pendidikan'" k-data-value-field="'id'"
                                                k-filter="'contains'" k-auto-bind="false"
                                                k-data-source="listPendidikan" />
                                        </div>
                                        <div class="grid_4">
                                            <label c-label item="item" c-label-text="Jenis Kegiatan" real></label>
                                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.jeniskegiatan"
                                                k-data-text-field="'diklatkategori'" k-data-value-field="'id'"
                                                k-filter="'contains'" k-auto-bind="false"
                                                k-data-source="listJenisKegiatan" />
                                        </div>

                                    </div>
                                    <div class="grid_2">
                                        <div class="grid_12" style="margin-top:27px">
                                            <button class="k-button k-button-icontext k-primary k-grid-update"
                                                ng-click="searchDetailMahasiswa()" style="width:100px"><span
                                                    class="k-sprite k-icon k-i-search"></span>Cari </button>
                                            <button class="k-button  k-button-icontext" ng-click="ClearData()"
                                                style="width:100px"><span
                                                    class="k-sprite k-icon k-delete"></span>Clear</button>
                                        </div>
                                    </div>

                                </div>

                            </fieldset>
                            <div class="grid_12" style="margin-top: 10px;">
                                <kendo-grid id="kGrid" k-data-source="dataDetailMahasiswaGrid"
                                    k-options="columnDetailMahasiswaGrid" k-ng-model="current"
                                    ng-dblclick ="aspekpenilaian(current)">
                                </kendo-grid>
                            </div>
                            <div class="grid_12" style="margin-top:60px">
                                <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
                            </div>
                        </div>
                    </md-content>
                </md-tab>
            </md-tabs>
        </md-content>
    </div>
</div>
<div kendo-window="popUpAspek" k-title="'Aspek Penilaian Mahasiwa'" k-width="1000" k-visible="false"
    k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        
        <div class="grid_12">
            <div class="grid_12 headerBox">
                <p>Aspek Penilaian Mahasiwa</p>
            </div>
            <div class="clear"></div>
            <!-- grid table -->
            <div class="grid_12 borderBox">
                <kendo-grid id="kGrid" data-source="dataDetail" options="columnDetail" k-pageable="'true'" k-groupable="'true'"
                    k-sortable="'true'" k-resizable="'true'" k-selectable="'row'" k-ng-model="dataSelectedDetail"
                    ng-click="klikGridDetail(dataSelectedDetail)"
                    >
                </kendo-grid>
            </div>
            <div class="clear"></div>
        </div>
        <div class="grid_12">
            <div class="grid_6">
                <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="save()"
                    style="width:100px"><span class="k-sprite k-icon k-save"></span>Simpan</button>
                
            </div>
            <div class="grid_6">
                <button class="k-button  k-button-icontext" ng-click="tutup()" style="width:100px"><span
                        class="k-sprite k-icon k-delete"></span>Tutup</button>
            </div>
        </div>
    </div>
</div>
