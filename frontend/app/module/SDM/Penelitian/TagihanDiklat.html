<div class="grid_12 headerBox">
    <h1 style="color: white;"><b>Daftar Tagihan Diklat</b></h1>
</div>
<!-- Kriteria -->
<div class="grid_12">

    <div class="grid_12 borderBox containerBorderBox">
        <!-- NamaPelanggan -->
        <div class="grid_2">
            <div class="grid_12">
                <label c-label item="item" c-label-text="NamaPelanggan"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.namaPelanggan"
                    ng-keypress="($event.which == 13)? SearchData():item.namaPelanggan" />
            </div>
        </div>

        <!-- Periode Pulang -->
        <div class="grid_3">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Periode"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <!-- AwalPeriode -->
                <div class="grid_6 padDatePicker">
                    <div class="grid_12">
                        <input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                    </div>
                </div>

                <!-- AkhirPeriode -->
                <div class="grid_6 padDatePicker">
                    <div class="grid_12">
                        <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                    </div>
                </div>
                <div class="clear"></div>
            </div>
        </div>

        <!-- Button Search -->
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="btnTemplate1" ng-click="SearchData()">Cari</button>
            </div>
        </div>

        <!-- Button Clear -->
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="btnTemplate1" ng-click="ClearSearch()">Clear</button>
            </div>
        </div>

    </div>
</div>
<div class="clear"></div>

<br />

<!-- DaftarNonLayanan -->
<div class="grid_12">
    <div class="grid_12 headerBox">
        <p>List Tagihan</p>
    </div>
    <div class="clear"></div>

    <!-- grid table -->
    <div class="grid_12 borderBox">
        <div id="kGrid" kendo-grid k-data-source="dataDaftarNonLayanan" k-selectable="'row'"
            options="columnDaftarNonLayanan" k-sortable="'true'" k-ng-model="dataPasienSelected"
            ng-click="klikGrid(dataPasienSelected)">
        </div>
    </div>


    <div class="clear"></div>
</div>


<div class="grid_12" style="margin-top: 20px;">
    <!-- <div class="grid_5"></div> -->
    <div class="grid_2"></div>
    <div class="grid_2">
        <!-- <button class="c-button" ng-click="Detail()">Detail</button> -->
        <button class="btnTemplate1" style="margin-top:-20px;margin-left: 0;" ng-click="JenisPeran()"><i
                class="fa fa-exclamation"></i>Jenis Peran</button>
    </div>

</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
<div class="grid_12" style="margin-top:30px">
    <div ng-include='"../app/template/Shared/Keuangan/TemplateButtonKasir"'></div>
</div>
<div kendo-window="popupInputDetailTagihan" k-title="'Detail'" k-visible="false" k-width="1000">
    <div class="panel panel-default container_12">

        <div ng-cloak>
            <md-content>
                <md-tabs md-dynamic-height md-border-bottom md-selected="myVar2">
                    <md-tab label="Detail Jenis Peran">
                        <md-content class="md-padding">
                            <div class="grid_12">
                                <div class="grid_12">
                                    <div class="grid_6">
                                        <div class="grid_12">
                                            <label c-label item="item" c-label-text="NamaPelanggan"></label>
                                        </div>
                                        <div class="clear"></div>

                                        <div class="grid_12">
                                            <input c-text-box type="input" filter="" class="k-textbox"
                                                ng-model="item.namaPelangganlook" disabled />
                                        </div>
                                    </div>
                                </div>

                                <div class="grid_6">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="Jenis Peran"></label>
                                    </div>
                                    <div class="grid_12">
                                        <input style="width: 100%; " kendo-combo-box k-ng-model="item.jenisperan"
                                            k-data-text-field=" 'jenisperan' " k-filter=" 'contains' "
                                            k-data-value-field=" 'id' " k-auto-bind="false "
                                            k-data-source="listJenisPeran" />
                                    </div>
                                </div>
                                <div class="grid_6">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="Nama Pegawai"></label>
                                    </div>
                                    <div class="grid_12">
                                        <input style="width: 100%; " kendo-combo-box k-ng-model="item.pegawai"
                                            k-data-text-field=" 'namalengkap' " k-filter=" 'contains' "
                                            k-data-value-field=" 'id' " k-auto-bind="false "
                                            k-data-source="listPegawai" />
                                    </div>
                                </div>
                            </div>
                            <div class="grid_12">
                                <div class="grid_2" style="float: left;padding-left: 10px">
                                    <button class="btnTemplate1 red" ng-click="delete()"><i class="fa fa-trash"></i>
                                        Hapus
                                    </button>
                                </div>
                                <div class="grid_2" style="float: right;padding-left: 10px;">
                                    <button class="btnTemplate1" ng-click="batal()"><i class="fa fa-close"></i> Batal
                                    </button>
                                </div>

                                <div class="grid_2" style="float: right;padding-left: 10px">
                                    <button class="btnTemplate1 success" ng-click="save()"><i class="fa fa-save"></i>
                                        Simpan
                                    </button>
                                </div>

                            </div>
                        </md-content>
                    </md-tab>
                </md-tabs>
            </md-content>
        </div>

        <div class="grid_12">
            <div class="grid_8">
            </div>
        </div>
    </div>
</div>
