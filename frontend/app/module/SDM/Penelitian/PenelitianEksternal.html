<div>
    <div class="panel panel-default container_12" style="background-color:transparant">
        <div class="panel-heading"><label class='title' c-label item="item" c-label-text="Kegiatan Diklat External"
                real></label></div>
        <div class="panel-body">
            <div class="grid_12">
                <!-- DATA PENELITI -->
                <div class="grid_12">
                    <div class="panel panel-default panel-white">
                        <div class="panel-heading-white"><span class="title" c-translate></span></div>
                        <div class="panel-body">
                            <div class="grid_12">
                                <div class="grid_3">
                                    <div class="grid_12" style="margin: 6px 0 0 0;">
                                        <label><b>Nama User</b></label>
                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                                            ng-model="item.namauser" ng-disabled="true" />
                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12" style="margin: 6px 0 0 0;">
                                        <label c-label item="item" c-label-text="Nama Instansi"></label>
                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="input" filter="'varchar'" class="k-textbox"
                                            ng-model="item.namainstansi" ng-disabled="true"/>
                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12" style="margin: 6px 0 0 0;">
                                        <label c-label item="item" c-label-text="No Telp"></label>
                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="text" filter="'varchar'" class="k-textbox"
                                            ng-model="item.notelp" ng-disabled="peneliti"/>
                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12" style="margin: 6px 0 0 0;">
                                        <label c-label item="item" c-label-text="Jenis"></label>
                                    </div>
                                    <div class="grid_12">
                                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.jenis"
                                            k-data-text-field="'diklatkategori'" k-data-value-field="'id'"
                                            k-filter="'contains'" k-auto-bind="false" k-data-source="ListJenisDiklat"
                                            ng-disabled="peneliti" ng-disabled="peneliti" />
                                    </div>
                                </div>
                            </div>
                           
                            <div class="grid_12">
                                <div class="grid_3">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="Layanan"></label>
                                    </div>
                                    <div class="grid_12">
                                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.layanan"
                                            k-data-text-field="'detailjenisproduk'" k-data-value-field="'id'"
                                            k-filter="'contains'" k-auto-bind="false" k-data-source="ListJenisLayanan"
                                            k-on-change="GetLevelPendidikan()" ng-disabled="peneliti"/>
                                            
                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="Level Pendidikan"></label>

                                        <input ng-show="idlvlpendidikan" style="width: 100%;" kendo-combo-box k-ng-model="item.levelpendidikan"

                                            k-filter="'contains'" k-auto-bind="false"

                                    </div>
                                </div>

                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="quantity/Waktu"></label>

                                    <div class="grid_12">
                                        <input c-text-box type="number" filter="'varchar'" class="k-textbox"

                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="Satuan"></label>
                                    </div>
                                    <div class="grid_12">

                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="Harga Satuan"></label>
                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="text" filter="'varchar'" class="k-textbox"
                                            ng-model="item.hargasatuan"disabled />
                                    </div>

                                        <label c-label item="item" c-label-text="Tanggal Mulai"></label>
                                    </div>
                                    <div class="grid_12">

                                        <input style="width: 100%" k-ng-model="item.tanggalMulai" kendo-datetimepicker
                                            placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" ng-disabled="tgl" />
                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12">
                                        <label c-label item="item" c-label-text="Tanggal Selesai"></label>
                                    </div>
                                    <div class="grid_12">
                                        <!-- <input kendo-date-picker k-ng-model="item.tanggalMulai" k-format="'dd-MM-yyyy'" style="width: 100%" /> -->
                                        <input style="width: 100%" k-ng-model="item.tanggalSelesai" kendo-datetimepicker
                                            placeholer="yyyy-mm-dd" k-format="'yyyy-MM-dd'" ng-disabled="tgl" />
                                    </div>
                                </div>
                            </div>
                             <div class="grid_12">
                                <div class="grid_3">

                                <div class="grid_3">

                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="input" filter="'varchar'" class="k-textbox"

                                    </div>
                                </div>
                                <div class="grid_3">

                                    <div class="grid_12">
                                        <input c-text-box type="text" filter="'varchar'" class="k-textbox"

                                    </div>
                                </div>
                                <div class="grid_3">
                                    <div class="grid_12" style="margin: 6px 0 0 0;">

                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="number" filter="'varchar'" class="k-textbox"
                                            ng-model="item.biaya" disabled />
                                    </div>
                                </div>
                            </div>
                        </div>
