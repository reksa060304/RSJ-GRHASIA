<style>
    .btn-disabled {
        background-color: red;
    }

    .btn-enabled {
        background-color: green;
    }
</style>
<div class="grid_12">
    <div class="grid_12 headerBox">
        <h1 style="color: white;"><b>Daftar Remunerasi Diklat</b></h1>
    </div>

    <fieldset style="min-height:50px !important" align="left">
        <legend>
            <h2>Pencarian</h2>
        </legend>
        <div class="grid_12">
            <div class="grid_3">
                <div class="grid_6">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Periode Posting"></label>
                    </div>
                    <div class="grid_12">
                        <div class="grid_12">
                            <input style="width: 100%" k-options="monthUngkul" k-ng-model="item.bulan" kendo-date-picker
                                placeholer="MMMM" k-format="'MMMM'" />
                        </div>
                    </div>
                </div>
                <div class="grid_6">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="a" style="color: #ffffff;"></label>
                    </div>
                    <div class="grid_12">
                        <div class="grid_12">
                            <input style="width: 100%" k-options="yearUngkul" k-ng-model="item.tahun" kendo-date-picker
                                placeholer="YYYY" k-format="'yyyy'" />
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid_3 k-edit-buttons  k-state-default " style="margin-top:27px">
                <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="SearchData()"
                    style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
                <button class="k-button  k-button-icontext" ng-click="ClearData()" style="width:100px"><span
                        class="k-sprite k-icon k-delete"></span>Clear</button>
            </div>
            <div class="grid_3"></div>

            
        </div>
    </fieldset>

    <div class="grid_12" style="margin-top: 10px;">
        <div class="grid_12" style="margin-top: 20px;">
            <div class="grid_12 borderBox">
                <kendo-grid options="mainGridOptions" k-data-source="dataSource" k-sortable="'true'"
                    k-ng-model="current" ng-click="klik(current)">

                </kendo-grid>
            </div>

        </div>
    </div>

    <div class="grid_12">
        <div class="grid_2" style="margin-top: 20px;">
            <button class="c-button" ng-click="postingTotalBersih()" style="height: 50px;"><i
                    class="fas fas-edit"></i>Posting Diklat Remun
            </button>
        </div>
    </div>




</div>
<div class="grid_12" style="margin-top:60px">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
