<style>
    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }
</style>

<div>
    <c-panel item="item" header="'Verifikasi Pembayaran Diklat'" disabled>

        <!-- Kriteria -->
        <div class="grid_12">
            <!-- <div class="grid_12 headerBox containerBorderBox" style="padding:0px">
				<p>Data</p>
			</div> -->
            <div class="grid_12 borderBox containerBorderBox">
                <!-- NoPendaftaran -->
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Intitusi"></label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kampus"
                            ng-disabled="true" />
                    </div>
                </div>

                <!-- NoRM -->
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item">Kegiatan</label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.kegiatan"
                            ng-disabled="true" />
                    </div>
                </div>

                <!-- NamaPasien -->
                <div class="grid_4">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Periode"></label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_12">
                        <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.periode"
                            ng-disabled="true" />
                    </div>
                </div>

            </div>
        </div>
        <div class="clear"></div>

        <br />


        <!-- DaftarTagihan -->
        <div class="grid_12">
            <div class="grid_12 headerBox">
                <p>DaftarTagihan</p>
            </div>
            <div class="clear"></div>

            <!-- grid table -->
            <div class="grid_12 borderBox">
                <div kendo-grid k-data-source="dataDaftarTagihan" k-selectable="'row'" k-sortable="'true'"
                    k-columns="columnDaftarTagihan">
                </div>
            </div>
            <div class="clear"></div>
        </div>
        <div class="clear"></div>

        <br />

        <!-- Data -->
        <div class="grid_6">
            <div class="grid_12 headerBox containerBorderBox" style="padding:0px">
                <p>Data</p>
            </div>
            <div class="grid_12 borderBox containerBorderBox">
                <!-- Total Tagihan -->
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Total Tagihan</label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_12">
                        <input c-text-box type="input" style="text-align: right;" filter="" class="k-textbox"
                            ng-model="item.totalTagihan" ng-disabled="true" />
                    </div>
                </div>

                <!-- TotalDeposit -->
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Yang Sudah Dibayar</label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_12">
                        <input c-text-box type="input" style="text-align: right;" filter="" class="k-textbox"
                            ng-model="item.totalDeposit" ng-disabled="true" />
                    </div>
                </div>

                <!-- JumlahBayar -->
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item">Sisa Tagihan</label>
                    </div>
                    <div class="clear"></div>

                    <div class="grid_12">
                        <input c-text-box type="input" style="text-align: right;" filter="" class="k-textbox"
                            ng-model="item.jumlahBayarFix" />
                    </div>
                </div>
            </div>
        </div>
        <div class="grid_6">
            <div class="grid_12 headerBox containerBorderBox" style="padding:0px">
                <p>Jumlah yang Ingin Dibayar</p>
            </div>
            <div class="grid_12 borderBox containerBorderBox">
                <!-- Total Tagihan -->
                <input c-text-box type="number" style="text-align: right;" class="k-textbox"
                    ng-model="item.jumlahBayar" />
            </div>
        </div>

    </c-panel>

    <div class="grid_12" style="margin-top:30px">
        <div ng-include='"../app/template/Shared/Keuangan/TemplateButtonKasir"'></div>
    </div>
</div>
