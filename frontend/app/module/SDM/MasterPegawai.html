
<style type="text/css">

<div class="grid_12">
	<div class="panel panel-default container_12" style="background-color:transparant">
		<div class="panel-heading"><label class='title' c-label item="item" real>Rekam Data Pegawai</label></div>
		<div class="panel-body">
			<div class="grid_12">
				<div class="grid_6">
					<div class="panel panel-default panel-white">
						<div class="panel-heading-white"><span class="title" c-translate>Data Pegawai</span></div>
						<div class="panel-body">
							<div class="grid_12">
								<div class="grid_12">
									<div class="grid_4">
										<div class="grid_12">
											<label c-label item="item" c-label-text="Id"></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" filter="" class="k-textbox" ng-model="item.idPegawai" placeholder="ID"
												readonly disabled />
										</div>
									</div>
									<div class="grid_4">
										<div class="grid_12">
											<label><b>No. Karpeg</b></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox" ng-model="item.nokarpeg"
												placeholder="No. Karpeg" />
										</div>
									</div>
								</div>
								<div class="grid_4">
									<div class="grid_12">
										<label><b>NIK</b></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" filter="'varchar'" class="k-textbox" ng-model="item.nik"
											placeholder="NIK" />
									</div>
								</div>
								<div class="grid_4">
									<div class="grid_12">
										<label><b>NIP</b></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" filter="'varchar'" class="k-textbox"
											ng-model="item.nipPns" placeholder="NIP" />
									</div>
								</div>
								
								<div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamaPegawai"></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" filter="'varchar'" class="k-textbox"
											ng-model="item.namaLengkap" placeholder="Nama Lengkap" readonly />
									</div>
								</div>
							</div>
							<div class="grid_12">
								<div class="grid_12">
									<label><b>Nama dan Gelar</b></label>
								</div>
								<div class="grid_4">
									<input c-text-box type="input" placeholder="Gelar Depan" filter="'varchar'"
										class="k-textbox" ng-model="item.gelarDepan" />
								</div>
								<div class="grid_4">
									<input c-text-box type="input" placeholder="Nama" filter="'varchar'"
										class="k-textbox" ng-model="item.nama" />
								</div>
								<div class="grid_4">
									<input c-text-box type="input" placeholder="Gelar Belakang" filter="'varchar'"
										class="k-textbox" ng-model="item.gelarBelakang" />
								</div>
							</div>
							<div class="grid_12">
								<div class="grid_6">
									<div class="grid_12">
										<label c-label item="item" c-label-text="Tempat Tanggal Lahir"></label>
									</div>
									<div class="grid_12">
										<div class="grid_6">
											<input c-text-box type="input" placeholder="Tempat Lahir" filter="'varchar'"
												class="k-textbox" ng-model="item.tempatLahir" />
										</div>
										<div class="grid_6">
											<input kendo-date-picker k-ng-model="item.tglLahir" k-format="'dd-MM-yyyy'"
												style="width: 100%" />
										</div>
									</div>
								</div>
								<div class="grid_6">
									<div class="grid_12">
										<label c-label item="item" c-label-text="UnitKerja"></label>
									</div>
									<div class="grid_12">
										<div class="grid_12" style="margin-top: 5px;">
											<input style="width: 100%;" kendo-combo-box k-ng-model="item.unitKerja"
												k-data-text-field="'name'" k-data-value-field="'id'"
												k-filter="'contains'" k-auto-bind="false"
												k-data-source="ListUnitKerja" />
										</div>
									</div>
								</div>
							</div>
							<div class="grid_12">
								<div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="JenisKelamin"></label>
									</div>
									<div class="grid_12">
										<input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisKelamin"
											k-data-text-field="'jeniskelamin'" k-data-value-field="'id'"
											k-filter="'contains'" k-auto-bind="false"
											k-data-source="ListJenisKelamin" />
									</div>
								</div>
								<div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="Pendidikan Terakhir"></label>
									</div>
									<div class="grid_12">
										<input kendo-combo-box k-ng-model="item.pendidikan"
											k-data-text-field="'pendidikan'" k-data-value-field="'id'"
											k-filter="'contains'" k-data-source="ListPendidikan" style="width: 100%;" />
									</div>
								</div>
								<div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="Pendidikan Pegawai"></label>
									</div>
									<div class="grid_12">
										<input kendo-combo-box k-ng-model="item.pendidikanpegawai"
											k-data-text-field="'namaexternal'" k-data-value-field="'id'"
											k-filter="'contains'" k-data-source="ListPendidikanPegawai" style="width: 100%;" disabled/>
									</div>
								</div>
							</div>
							<div class="grid_12">
								
								<div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="Agama"></label>
									</div>
									<div class="grid_12">
										<input style="width: 100%;" kendo-combo-box k-ng-model="item.agama"
											k-data-text-field="'agama'" k-data-value-field="'id'" k-filter="'contains'"
											k-data-source="ListAgama" />
									</div>
								</div>
								<div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="Tanggal Meninggal"></label>
									</div>
									<div class="grid_12">
										<input kendo-date-picker k-ng-model="item.tglMeninggal" k-format="'dd-MM-yyyy'"
											style="width: 100%" />
									</div>
								</div>
								<div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="Status Kawin"></label>
									</div>
									<div class="grid_12">
										<input style="width: 100%;" kendo-combo-box k-ng-model="item.statusPerkawinanPegawai"
											k-data-text-field="'statusperkawinan'" k-data-value-field="'id'" k-filter="'contains'"
											k-auto-bind="false" k-data-source="ListStatusKawin" />
									</div>
								</div>
							</div>
							<div class="grid_12">
								<div class="grid_4">
									<div class="grid_12">
										<label><b>Masa Kerja Tambahan</b></label>
									</div>
									<div class="grid_6">
										<div class="grid_6">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox"
												ng-model="item.masakerjatambahantahun" />
										</div>
										<div class="grid_6" style="margin-top: 15px">
											<label>Tahun</label>
										</div>
									</div>
									<div class="grid_6">
										<div class="grid_6">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox"
												ng-model="item.masakerjatambahanbulan" />
										</div>
										<div class="grid_6" style="margin-top: 15px">
											<label>Bulan</label>
										</div>
									</div>
								</div>
								<div class="grid_4">
									<div class="grid_12">
										<label><b>Masa Kerja Keseluruhan</b></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" filter="'varchar'" class="k-textbox"
											ng-model="item.masakerjakeseluruhan" ng-disabled="true" />
									</div>
								</div>
								<!-- <div class="grid_4">
									<div class="grid_12">
										<label c-label item="item" c-label-text="Status Kawin"></label>
									</div>
									<div class="grid_12">
										<input style="width: 100%;" kendo-combo-box
											k-ng-model="item.statusPerkawinanPegawai"
											k-data-text-field="'statusperkawinan'" k-data-value-field="'id'"
											k-filter="'contains'" k-auto-bind="false" k-data-source="ListStatusKawin" />
									</div>
								</div> -->
							</div>
						</div>
					</div>
					<div class="grid_12" style="margin-top: 16px">
						<div class="panel panel-default panel-white">
							<div class="panel-heading-white"><span class="title" c-translate>No Telphone/HP</span></div>
								<div class="panel-body">
									<div class="grid_12">
										<div class="grid_6">
											<div class="grid_12">
												<label c-label item="item">No Telp/HP 1</label>
											</div>
											<div class="grid_12">
												<input c-text-box type="input" placeholder="No Telp/HP 1" filter="'varchar'"
													class="k-textbox" ng-model="item.nomor1" />
											</div>
										</div>
										<div class="grid_6">
											<div class="grid_12">
												<label c-label item="item">No Telp/ HP 2</label>
											</div>
											<div class="grid_12">
												<input c-text-box type="input" placeholder="No Telp/HP 2" filter="'varchar'"
													class="k-textbox" ng-model="item.nomor2" />
											</div>
										</div>
									</div>
								</div>
						</div>
					</div>
					<div class="grid_12" style="margin-top: 16px">
						<div class="panel panel-default panel-white">
							<div class="panel-heading-white"><span class="title" c-translate>Data Lain</span></div>
							<div class="panel-body">
								<div class="grid_12">
									<div class="grid_4">
										<div class="grid_12">
											<label><b>NPWP</b></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox"
												ng-model="item.npwp" />
										</div>
									</div>
									<div class="grid_4">
										<div class="grid_12">
											<label><b>BPJS Kesehatan</b></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox"
												ng-model="item.nobpjs" />
										</div>
									</div>
									<div class="grid_4">
										<div class="grid_12">
											<label><b>Akta Lahir</b></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox"
												ng-model="item.aktakelahiran" />
										</div>
									</div>
									<div class="grid_4">
										<div class="grid_12">
											<label><b>Taspen</b></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox"
												ng-model="item.taspen" />
										</div>
									</div>
									<div class="grid_4">
										<div class="grid_12">
											<label><b>Email</b></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" filter="'varchar'" class="k-textbox"
												ng-model="item.email" />
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="grid_6">
					<div class="grid_12">
						<div class="panel panel-default panel-white">
							<div class="panel-heading-white"><span class="title" c-translate>Rekening Bank 1</span>
							</div>
							<div class="panel-body">
								<div class="grid_6">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NoRekening"></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" placeholder="No Rekening" filter="'varchar'"
											class="k-textbox" ng-model="item.bankRekeningNomor" />
									</div>
								</div>
								<div class="grid_6">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamaRekening"></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" placeholder="Nama Pemilik Rekening"
											filter="'varchar'" class="k-textbox" ng-model="item.bankRekeningAtasNama" />
									</div>
								</div>
								<div class="grid_12">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamaBank"></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" placeholder="Nama Bank Rekening"
											filter="'varchar'" class="k-textbox" ng-model="item.bankRekeningNama" />
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="grid_12" style="margin-top: 10px;">
						<div class="panel panel-default panel-white">
							<div class="panel-heading-white"><span class="title" c-translate>Rekening Bank 2</span>
							</div>
							<div class="panel-body">
								<div class="grid_6">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NoRekening"></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" placeholder="No Rekening" filter="'varchar'"
											class="k-textbox" ng-model="item.bankRekeningNomor2" />
									</div>
								</div>
								<div class="grid_6">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamaRekening"></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" placeholder="Nama Pemilik Rekening"
											filter="'varchar'" class="k-textbox"
											ng-model="item.bankRekeningAtasNama2" />
									</div>
								</div>
								<div class="grid_12">
									<div class="grid_12">
										<label c-label item="item" c-label-text="NamaBank"></label>
									</div>
									<div class="grid_12">
										<input c-text-box type="input" placeholder="Nama Bank Rekening"
											filter="'varchar'" class="k-textbox" ng-model="item.bankRekeningNama2" />
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="grid_12" style="margin-top: 16px">
						<div class="panel panel-default panel-white">
							<div class="panel-heading-white"><span class="title" c-translate>Alamat</span></div>
							<div class="panel-body">
								<div class="grid_12">
									<div class="grid_8">
										<div class="grid_12">
											<label c-label item="item" c-label-text="Alamat"></label>
										</div>
										<div class="grid_12" style="margin-top: 6px">
											<textarea ng-model="item.alamat" placeholder="Alamat"
												style="width: 100%; height: 65px;"></textarea>
										</div>
									</div>
									<div class="grid_4">
										<div class="grid_12">
											<label c-label item="item" c-label-text="KodePos"></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" placeholder="Kode Pos" filter="'varchar'"
												class="k-textbox" ng-model="item.kodePos" />
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="grid_12" style="margin-top: 16px">
						<div class="panel panel-default panel-white">
							<div class="panel-heading-white"><span class="title" c-translate>Jumlah Anak</span></div>
							<div class="panel-body">
								<div class="grid_12">
									<div class="grid_6">
										<div class="grid_12">
											<label c-label item="item" c-label-text="Jumlah Anak Real" real></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" placeholder="" filter="'varchar'" class="k-textbox"
												ng-model="item.jumlahanakreal" />
										</div>
									</div>
									<div class="grid_6">
										<div class="grid_12">
											<label c-label item="item" c-label-text="Jumlah Anak Tertanggung" real></label>
										</div>
										<div class="grid_12">
											<input c-text-box type="input" placeholder="" filter="'varchar'" class="k-textbox"
												ng-model="item.jumlahanaktertanggung" />
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					
				</div>
			</div>
		</div>
	</div>
</div>
<div ng-include=' "../app/template/Shared/TemplateLoading" '></div>
<div class="grid_12">
	<div ng-cloak>
		<md-content>
			<md-tabs md-dynamic-height md-border-bottom>
				<md-tab label="Status Kepegawaian" ng-disabled='nondiklat'>
					<md-content class="md-padding">
						<div class="grid_12" ng-hide="true">
							<div class="grid_4" >
								<div class="grid_12">
									<label c-label item="item" c-label-text="Tanggal Masuk"></label>
								</div>
								<div class="grid_12">
									<input kendo-date-picker k-ng-model="item.tglMasuk" k-format="'dd-MM-yyyy'"
										style="width: 100%" />
								</div>
							</div>
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item" c-label-text="Tanggal Keluar"></label>
								</div>
								<div class="grid_12">
									<input kendo-date-picker k-ng-model="item.tglkeluar" k-format="'dd-MM-yyyy'"
										style="width: 100%" />
								</div>
							</div>
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item" c-label-text="Masa Kerja"></label>
								</div>
								<div class="grid_12">
									<input c-text-box type="input" placeholder="Masa Kerja" filter="'varchar'"
										class="k-textbox" ng-model="item.MasaKerja" disabled />
								</div>
							</div>
						</div>
						<div class="grid_12">
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item" c-label-text="Pensiun"></label>
								</div>
								<div class="grid_12" style="margin-top: -6px;">
									<div class="grid_6">
										<input c-text-box type="number" filter="" class="k-textbox"
											ng-model="item.pensiun" />
										<label class="keteranganFieldTambahan"
											style="margin-top: 12px;margin-right: 30px">Tahun</label>
									</div>
									<div class="grid_6">
										<input kendo-date-picker k-ng-model="item.tglPensiun" k-format="'dd-MM-yyyy'"
											style="width: 100%" />
									</div>
								</div>
							</div>
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item" c-label-text="StatusPegawai"></label>
								</div>
								<div class="grid_12">
									<input style="width: 100%;" kendo-combo-box k-ng-model="item.kategoryPegawai"
										k-data-text-field="'kategorypegawai'" k-data-value-field="'id'"
										k-filter="'contains'" k-auto-bind="false" k-data-source="ListKategoriPegawai" />
								</div>
							</div>
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item" c-label-text="KedudukanPegawai"></label>
								</div>
								<div class="grid_12">
									<input style="width: 100%;" kendo-combo-box k-ng-model="item.kedudukan"
										k-data-text-field="'name'" k-data-value-field="'id'" k-filter="'contains'"
										k-auto-bind="false" k-data-source="ListKedudukanPegawai" />
								</div>
							</div>
						</div>
						<div class="grid_12">
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item">Pangkat / Golongan</label>
								</div>
								<div class="grid_12">
									<input style="width: 100%;" kendo-combo-box k-ng-model="item.golonganPegawai"
										k-data-text-field="'golongan'" k-data-value-field="'id'" k-auto-bind="true"
										k-data-source="ListGolonganPegawai" disabled/>
								</div>
							</div>
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item" c-label-text="Jabatan Struktural/Fungsional"></label>
								</div>
								<div class="grid_12">
									<input style="width: 100%;" kendo-combo-box k-ng-model="item.jabatanFungsional"
										k-data-text-field="'namajabatan'" k-data-value-field="'id'"
										k-filter="'contains'" k-auto-bind="false"
										k-data-source="ListJabatanFungsional" disabled/>
								</div>
							</div>
							<div class="grid_4">
								<div class="grid_12">
									<label c-label item="item" c-label-text="JenisPegawai"></label>
