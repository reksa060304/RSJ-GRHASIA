<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }

    .style-center {
        display: inline-block;
        text-align: center;
        width: 100%;
    }

    .style-right {
        display: inline-block;
        text-align: right;
        width: 100%;
    }

    .style-left {
        display: inline-block;
        text-align: left;
        width: 100%;
    }

    .photo-pasiens {
        /* display: inline-block; */
        width: 400px;
        height: auto;
        border-radius: 50%;
        /* background-size: 32px 35px; */
        /* background-position: center center; */
        vertical-align: middle;
    }

    .effect-shadow {
        -webkit-box-shadow: 2px 2px 5px #b6b6b6;
        -moz-box-shadow: 2px 2px 5px #b6b6b6;
        box-shadow: 2px 2px 5px #b6b6b6;
    }


    fieldset {
        border: 1px solid #c8c8c8;
        background-color: #ffffff;
        color: #333333;
    }

    img.photo-pasien {
        width: 300px;
        height: 100%;
        object-fit: contain;
    }
</style>
<c-panel item="item" header="'Laporan Diklat Karyawan'" disabled>
</c-panel>
<div class="grid_12">
    <div class="grid_2" style="margin-top:5px">
        <label c-label item="item" c-label-text="Departement"></label>
        <input style="width: 100%;" kendo-combo-box k-ng-model="item.departemen" k-data-text-field="'departemen'"
            k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDepartement"
            k-on-change="getIsiComboRuangan()" />
    </div>
    <div class="grid_2" style="margin-top:5px">
        <label c-label c-label-text="namaRuangan" real></label>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.ruangan" k-data-text-field=" 'ruangan' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listRuangans " />
    </div>
    <!-- <div class="grid_2" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Dokter"></label>
        </div>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.dokter" k-data-text-field=" 'namalengkap' "
            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false " k-data-source="listDokter " />
    </div>     -->
    <div class="grid_2" style="margin-top:5px">
        <label c-label c-label-text="Kelompok" real></label>
        <input style="width: 100%; " kendo-combo-box k-ng-model="item.kelompokpasien"
            k-data-text-field=" 'kelompokpasien' " k-filter=" 'contains' " k-data-value-field=" 'id' "
            k-auto-bind="false " k-data-source="listKelompokPasien " />
    </div>



    <div class="grid_4" style="margin-top:5px">
        <div class="grid_12">
            <label c-label item="item" c-label-text="Periode Bulan Tahun"></label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <!-- AwalPeriode -->
            <div class="grid_6 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periode" kendo-datepicker k-options="monthungkul"
                    k-max="now" placeholer="yyyy-MM" k-format="'mmmm'" />
            </div>

            <!-- AkhirPeriode -->
            <!-- <div class="grid_6 padDatePicker">
                <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datepicker
                    placeholer="yyyy-MM" k-format="'yyyy-MM'" />
            </div>
            <div class="clear"></div> -->
        </div>
    </div>
    <div class="grid_1" style="margin-top:5px">
        <div class="grid_12">
            <label>&nbsp;</label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()"> <i
                    class="fa fa-search"></i>Cari</button>
        </div>
    </div>

    <div class="grid_12">
        <!-- <div class="grid_12 headerBox">
            <p>Daftar Pengunjung</p>
        </div>
        <div class="clear"></div> -->

        <md-content>
            <md-tabs md-dynamic-height md-border-bottom md-selected="myVar">
                <md-tab label="Peserta pelatihan eksternal">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top: 10px;">
                            <div class="grid_12 borderBox">
                                <kendo-grid id="kGrid" data-source="dataSourcePelatihanEksternal"
                                    options="columnGridPelatihanEksternal"
                                    k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                                    k-ng-model="dataPelatihanEksternalSelected"
                                    ng-click="klikGrid(dataPelatihanEksternalSelected)">
                                </kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>
                <md-tab label="peserta pelatihan internal">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top: 10px;">
                            <div class="grid_12 borderBox">
                                <kendo-grid id="kGrid" data-source="dataSourceGridPelatihanInternal" options="columnGridPelatihanInternal"
                                    k-selectable="'row'" k-sortable="'true'" k-resizable="'true'"
                                    k-ng-model="dataPasienSelected" ng-click="klikGrid(dataPasienSelected)">
                                </kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>
                <md-tab label="Laporan Kunjungan" ng-disabled="true">
                    <md-content class="md-padding">
                        <div class="grid_12" style="margin-top: 10px;">
                            <div class="grid_12 borderBox">
                                <kendo-grid id="kGrid" k-groupable="'true'" data-source="dataSourceGrid"
                                    options="columnGrid" k-pageable="'true'" k-sortable="'true'" k-resizable="'true'"
                                    k-selectable="'row'" k-ng-model="dataPasienSelected"
                                    ng-click="klikGrid(dataPasienSelected)"></kendo-grid>
                            </div>
                        </div>
                    </md-content>
                </md-tab>

            </md-tabs>
        </md-content>
    </div>
</div>
