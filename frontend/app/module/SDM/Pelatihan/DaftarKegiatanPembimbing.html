<div class="grid_12 headerBox">
    <h1 style="color: white;"><b>Daftar Kegiatan Pembimbing</b></h1>
</div>
<div class="clear"></div>

<br />

<!-- Kriteria -->
<div class="grid_12">
    <!-- <div class="grid_12 headerBox containerBorderBox" style="padding:0px">
				<p>Kriteria</p>
			</div> -->
    <div class="grid_12 borderBox containerBorderBox">
        <!-- Periode Pulang -->
        <div class="grid_4">
            <div class="grid_12">
                <label c-label item="item" c-label-text="Periode Kegiatan"></label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <!-- AwalPeriode -->
                <div class="grid_6 padDatePicker">
                    <input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker k-max="now"
                        placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
                </div>

                <!-- AkhirPeriode -->
                <div class="grid_6 padDatePicker">
                    <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
                        placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                </div>
                
            </div>

            
        </div>
        <div class="grid_4">
            <label c-label item="item" c-label-text="Nama Pembimbing" real></label>

            <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaDokter2" k-data-text-field="'namalengkap'"
                k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDokter2" />
        </div>
        <div class="clear"></div>


        <!-- Button Search -->
        <div class="grid_1">
            <div class="grid_12">
                <label>&nbsp;</label>
            </div>
            <div class="clear"></div>

            <div class="grid_12">
                <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()">Cari</button>
            </div>
        </div>


    </div>
</div>

<!-- DaftarPasienPulang -->

    <div class="grid_12 headerBox">
        <p>Daftar Kegiatan Pembimbing</p>
    </div>

</div>

<div class="grid_3" ng-show='cboDokter'>
</div>
<div class="grid_3" ng-show='cboDokter'>
    <div class="grid_12">
        <label c-label item="item" c-label-text="Nama Dokter"></label>
    </div>
    <div class="clear"></div>

    <div class="grid_12">
        <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaDokter" k-data-text-field="'namalengkap'"

    </div>
</div>

    <button class="btnTemplate1" style="margin-left: 0;" ng-click="simpan()">Simpan</button>
</div>
<div class="grid_1" style="margin-top: 16px" ng-show='cboDokter'>
    <button class="btnTemplate1" style="margin-left: 0;" ng-click="batal()">Batal</button>
</div>

</div>

</div>
<div class="grid_12" ng-show='cboSep'>
    <div class="grid_3">
        <div class="grid_12">
            <label c-label item="item" c-label-text="No Peserta"></label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noPeserta" />
            <!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaDokter" k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDokter" /> -->
        </div>
    </div>
    <div class="grid_3">
        <div class="grid_12">
            <label c-label item="item" c-label-text="No SEP"></label>
        </div>
        <div class="clear"></div>

        <div class="grid_12">
            <input c-text-box type="input" filter="" class="k-textbox" ng-model="item.noSep" />
            <!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.namaDokter" k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false" k-data-source="listDokter" /> -->
        </div>
    </div>
    <div class="grid_1" style="margin-top: 16px">
        <button class="btnTemplate1" style="margin-left: 0;" ng-click="simpanSep()">Simpan</button>
    </div>
    <div class="grid_1" style="margin-top: 16px">
        <button class="btnTemplate1" style="margin-left: 0;" ng-click="batalSep()">Batal</button>
    </div>

        <div class="grid_6">
            <fieldset>
                <legend><b>Data Kegiatan Peserta Didik</b></legend>
                <div class="grid_12">
                    <div class="grid_12" style="margin-top:5px">
                        <label c-label real>Institusi Pendidikan </label>
                        <input c-text-box type="input" filter="'char'" class="k-textbox"
                            ng-model="itemP.institusipendidikan" disabled />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_12" style="margin-top:5px">
                        <label c-label real>Tanggal Masuk Bimbingan </label>
                        <input c-text-box type="input" filter="'char'" class="k-textbox"
                            ng-model="itemP.tglmasukbimbingan" disabled />
                    </div>

                </div>
                <div class="grid_12">
                    <div class="grid_12" style="margin-top:5px">
                        <label c-label real>Tanggal Keluar Bimbingan </label>
                        <input c-text-box type="input" filter="'char'" class="k-textbox"
                            ng-model="itemP.tglkeluarbimbingan" disabled />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_12" style="margin-top:5px">
                        <label c-label real>Daftar Mahasiswa : </label>
                        <textarea class="k-textbox" style="height: 76px;
                        width: 440px;
                        margin-top: 5px;
                        margin-left: 5px;
                        resize: true;" ng-model="itemP.daftarmahasiswa" disabled></textarea>
                    </div>

                </div>
            </fieldset>
        </div>
        <div class="grid_6">
            <fieldset>
                <legend><b>Input Kegiatan Peserta Didik</b></legend>
                <div class="grid_12">
                    
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Tanggal Input"></label>
                    </div>
                    <div class="grid_12">
                        <!-- k-max="now" -->
                        <input style="width: 100%;" k-ng-model="itemP.tglinput" kendo-datetimepicker 
                            placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" parsedate="yyyy-MM-dd HH:mm" />
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Ruangan"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%; " kendo-combo-box k-ng-model="itemP.ruangan" k-data-text-field=" 'namaruangan' "
                            k-filter=" 'contains' " k-data-value-field=" 'id' " k-auto-bind="false "
                            k-data-source="listRuangan" disabled/>
                    </div>
                </div>
                <div class="grid_12">
                    <div class="grid_12">
                        <label c-label item="item" c-label-text="Pembimbing"></label>
                    </div>
                    <div class="grid_12">
                        <input style="width: 100%; " kendo-combo-box k-ng-model="itemP.pembimbing"
                            k-data-text-field=" 'namalengkap' " k-filter=" 'contains' " k-data-value-field=" 'id' "
                            k-auto-bind="false" k-data-source="listPembimbing" disabled />
                    </div>
                </div>
                <div class="grid_12" style="margin-top: 30px">
                    <div class="grid_12">
                        <label c-label real>Kegiatan : </label>
                        <textarea class="k-textbox" style="height: 76px;
                        width: 440px;
                        margin-top: 5px;
                        margin-left: 5px;
                        resize: true;" ng-model="itemP.kegiatan"></textarea>
                    </div>
                </div>
                <div class="grid_12">
                    
                    <div class="k-edit-buttons  k-state-default pull-right"
                        style="margin-top:10px; margin-right: 10px;">
                        <button class="k-button  k-button-icontext" ng-click="saveKegiatan()"><span
                                class="k-icon k-save"></span>Simpan</button>
                    </div>

                </div>
            </fieldset>
        </div>
        <div class="grid_12">
            <div class="grid_12 headerBox">
                <p>Detail Hasil Kegiatan</p>
            </div>
            <div class="clear"></div>
            <!-- grid table -->
            <div class="grid_12 borderBox">
                <div id="kGrid" kendo-grid k-data-source="dataDaftarDetailDiklat" k-selectable="'row'"
                    options="columnDaftarDetailDiklat" k-sortable="'true'" k-ng-model="dataPasienDetailSelected"
                    ng-click="klikGridDetail(dataPasienDetailSelected)">
                </div>
            </div>
            <div class="clear"></div>
        </div>
        <div class="grid_12">
            <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px; margin-right: 10px">
                <button class="k-button  k-button-icontext" ng-click="TutupPopUps()"><span
                        class="k-icon k-cancel"></span>Tutup</button>
            </div>
        </div>
