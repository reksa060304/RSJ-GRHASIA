<style>
    .k-grid .k-grid-header .k-header .k-link {
        height: auto;
    }

    .k-grid .k-grid-header .k-header {
        white-space: normal;
    }

    .k-grid .k-grid-header .k-header {
        text-align: center;
    }
</style>
<div class="panel panel-default container_12">
    <div class="panel-heading" c-translate>Master Kenaikan Gaji</div>
    <div class="panel-body">
        <fieldset style="min-height:50px !important" align="left">
            <legend>
                <h2>Pencarian</h2>
            </legend>
            <div class="grid_8">

                <div class="grid_3">
                    <label c-label item="item">Pangkat & Golongan</label>
                    <select kendo-multi-select k-options="selectOptionsKategory" k-filter="'contains'"
                        k-data-source="listKategory" k-ng-model="item.kategory"></select>

                    <!-- <input style="width: 100%;" kendo-combo-box k-ng-model="item.kategory"
                        k-data-text-field="'kategorypegawai'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listKategory" /> -->
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label>Surat Keputusan</label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.suratkeputusanSearch"
                            k-data-text-field="'keteranganlainnya'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="ListSuratKeputusan" />
                    </div>
                </div>
                
                <!-- <div class="grid_3">
                    <label c-label item="item" c-label-text="Kategory Laporan"></label>
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.kategoryLap" k-data-text-field="'nama'"
                        k-data-value-field="'id'" k-filter="'contains'" k-auto-bind="false"
                        k-data-source="listKatLaporan" />
                </div> -->
            </div>
            <div class="grid_2 k-edit-buttons  k-state-default " style="margin-top:28px">
                <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="Search()"
                    style="width:100px"><span class="k-sprite k-icon k-i-search"></span>Cari </button>
                <button class="k-button  k-button-icontext" ng-click="ClearSearch()" style="width:100px"><span
                        class="k-sprite k-icon k-delete"></span>Clear</button>
            </div>
    </div>
    </fieldset>
</div>
<div class="grid_12" style="margin-top:10px">
    <div class="grid_12 headerBox">
        <p>Detail</p>
    </div>
    <div class="grid_12 borderBox">
        <kendo-grid k-data-source="sourceLaporan" k-selectable="'row'" k-groupable="'false'" k-options="columnLaporan"
            k-ng-model="dataPasienSelected" ng-click="click(dataPasienSelected)" class="max-height">
        </kendo-grid>
    </div>
    
</div>
<div class="grid_12" style="margin-top:60px" ng-show="isLoadingData">
    <div ng-include='"../app/template/Shared/TemplateLoading"'></div>
</div>
<div kendo-window="popUpCreate" k-title="'Input Master Gaji'" k-width="850" k-height="350"
    k-visible="false" k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="grid_12">
            <div class="grid_12">
                <div class="grid_5">
                    <div class="grid_12">
                        <label c-label>Surat Keputusan</label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.suratkeputusan"
                            k-data-text-field="'keteranganlainnya'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="ListSuratKeputusan" />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label>Pangkat & Golongan</label>
                    </div>
                    <div class="grid_12">
                        <input kendo-combo-box k-ng-model="item.golongan"
                            k-data-text-field="'golongan'" k-data-value-field="'id'" k-filter="'contains'"
                            k-auto-bind="false" k-data-source="ListGolonganPegawai" />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label>MKG</label>
                    </div>
                    <div class="grid_12">
                        <input c-text-box type="input" filter="'number'" class="k-textbox"
                            ng-model="item.mkg" />
                    </div>
                </div>
                <div class="grid_3">
                    <div class="grid_12">
                        <label c-label>Gaji Pokok</label>
                    </div>
                    <div class="grid_12">
                        <input id="txtData" c-text-box type="input" filter="'number'" class="k-textbox"
                            ng-model="item.gajipokok" ng-keypress="($event.which == 13)? tambahMKG():item.gajipokok"
                            />
                    </div>
                </div>
                <!-- <div class="grid_3">
                    <div class="grid_12">
                        <label c-label>Gaji Copy</label>
                    </div>
                    <div class="grid_12">
                        <input id="txtData2" c-text-box type="input" filter="'number'" class="k-textbox"
                            ng-model="item.gajicopy"
                            ng-keypress="($event.which == 13)? pindah() :item.gajicopy" />
                    </div>
                </div> -->
                
            </div>
            <div class="grid_12">
                <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                    <button class="k-button k-button-icontext k-primary k-grid-update" ng-click="tambahMKG()"><span
                            class="k-icon k-update"></span>Simpan</button>
                    <button class="k-button  k-button-icontext" ng-click="batalHukumanDisiplin()"><span
                            class="k-icon k-cancel"></span>Batal</button>
                </div>
            </div>
        </div>

    </div>
</div>
