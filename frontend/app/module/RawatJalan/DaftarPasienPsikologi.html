<div class="grid_12">
    <div class="panel panel-default container_12" style="background-color:transparant">
        <div class="panel-heading"><label class='title' c-label item="item" real>Daftar Pasien Psikologi</label></div>
        <div class="panel-body">
            <div class="grid_12">
                <div class="grid_12 borderBox containerBorderBox">
                    <div class="grid_2">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Dokter"></label>
                        </div>
                        <div class="clear"></div>

                        <div class="grid_12">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.dokter"
                                k-data-text-field="'namalengkap'" k-data-value-field="'id'" k-filter="'contains'"
                                k-auto-bind="false" k-data-source="listDokter2" />
                        </div>
                    </div>
                    <div class="grid_2">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Instalasi"></label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.instalasi"
                                k-data-text-field="'departemen'" k-data-value-field="'id'" k-filter="'contains'"
                                k-auto-bind="false" k-data-source="listDepartemen" k-on-change='getIsiComboRuangan()' />
                        </div>
                    </div>
                    <div class="grid_2">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Ruangan"></label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.ruangan"
                                k-data-text-field="'ruangan'" k-data-value-field="'id'" k-filter="'contains'"
                                k-auto-bind="false" k-data-source="listRuangan" />
                        </div>
                    </div>
                    <div class="grid_1">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Kelompok"></label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <input style="width: 100%;" kendo-combo-box k-ng-model="item.kelompokpasien"
                                k-data-text-field="'kelompokpasien'" k-data-value-field="'id'" k-filter="'contains'"
                                k-auto-bind="false" k-data-source="listKelompokPasien" />
                        </div>
                    </div>

                    <!-- Periode Pulang -->
                    <div class="grid_4">
                        <div class="grid_12">
                            <label c-label item="item" c-label-text="Periode Registrasi"></label>
                        </div>
                        <div class="clear"></div>
                        <div class="grid_12">
                            <!-- AwalPeriode -->
                            <div class="grid_6 padDatePicker">
                                <input style="width: 100%" k-ng-model="item.periodeAwal" kendo-datetimepicker
                                    k-max="now" placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'"
                                    parsedate="yyyy-MM-dd HH:mm" />
                            </div>
                            <!-- AkhirPeriode -->
                            <div class="grid_6 padDatePicker">
                                <input style="width: 100%" k-ng-model="item.periodeAkhir" kendo-datetimepicker
                                    placeholer="yyyy-MM-dd HH:mm" k-format="'yyyy-MM-dd HH:mm'" />
                            </div>
                            <div class="clear"></div>
                        </div>
                    </div>
                    <!-- Button Search -->
                    <div class="grid_1">
                        <div class="grid_12">
                            <label>&nbsp;</label>
                        </div>
                        <div class="clear"></div>

                        <div class="grid_12">
                            <button class="btnTemplate1" style="margin-left: 0;" ng-click="SearchData()"> <i
                                    class="fa fa-search"></i>Cari</button>
                        </div>
                    </div>


                </div>
            </div>
            <div class="grid_12">
                <div class="grid_12">
                    <kendo-grid k-data-source="gridDaftarPsikologi" k-pageable="true" k-ng-model="dataDaftarPsikologi"
                        k-selectable="'row'" options="opsiGridDaftarPsikologi" ng-click="klikGrid(dataDaftarPsikologi)"
                        style="font-size: small;"></kendo-grid>
                </div>
                <div class="grid_12">
                    <div class="grid_2" style="margin-top: 16px">
                        <button class="btnTemplate1" style="margin-left: 0;" ng-click="inputHasilPsikologi()"> <i
                                class="fa fa-pencil"></i>Input Hasil Psikologi</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div kendo-window="popUpDataDaftarPsikologi" k-title="'Input Hasil Psikologi'" k-width="600" k-height="350"
    k-visible="false" k-on-open="win2visible = true" k-on-close="win2visible = false">
    <div class="panel panel-default container_12" style="padding: 0px 10px;">
        <div class="grid_12">
            <!-- <div class="grid_6">
                <div class="grid_12">
                    <label c-label item="item">Jenis Norma</label>
                </div>
                <div class="clear"></div>

                <div class="grid_12">
                    <input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisnorma"
                        k-data-text-field="'jenisnorma'" k-data-value-field="'id'" k-filter="'contains'"
                        k-auto-bind="false" k-data-source="listJenisNorma" />
                </div>
            </div> -->
            <div class="grid_6">
                <div class="grid_12">
                    <label c-label item="item">No</label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="number" class="k-textbox" ng-model="item.no" placeholder="no" />
                </div>
            </div>
            <div class="grid_6">
                <div class="grid_12">
                    <label c-label item="item">Jawaban</label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="number" class="k-textbox" ng-model="item.jawaban" placeholder="jawaban" />
                </div>
            </div>

            <!-- <div class="grid_6">
                <div class="grid_12">
                    <label c-label item="item">Nilai</label>
                </div>
                <div class="grid_12">
                    <input c-text-box type="number" class="k-textbox" ng-model="item.nilai" />
                </div>
            </div> -->
            <div class="grid_12">
                <div class="grid_12"></div>
                <div class="grid_12">
                    <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px; margin-bottom: 10px;">
                        <button class="k-button k-button-icontext k-primary k-grid-update"
                            ng-click="simpanNormaPsikologi()"><span class="k-icon k-update"></span>Simpan</button>
                        <button class="k-button  k-button-icontext" ng-click="batalNormaPsikologi()"><span
                                class="k-icon k-cancel"></span>Batal</button>
                    </div>
                </div>
            </div>
            <div class="grid_12">
                <kendo-grid k-data-source="gridDaftarHasil" k-pageable="true" k-ng-model="dataDaftarHasil"
                    k-selectable="'row'" options="dataDaftarHasil" ng-click="klikGrid(dataDaftarHasil)"
                    style="font-size: small;"></kendo-grid>
            </div>
        </div>
    </div>
</div>
