<div class="grid_12">
    <div class="panel panel-default container_12" style="background-color:transparant">
        <div class="panel-heading"><label class='title' c-label item="item" real>Norma Psikologi</label></div>
        <div class="panel-body">
            <div class="grid_12">
                <div class="grid_12">
                    <kendo-grid k-data-source="gridNormaPsikologi" k-pageable="true" k-ng-model="dataNormaPsikologi"
                        k-selectable="'row'" options="opsiGridNormaPsikologi" ng-click="klikGrid(dataNormaPsikologi)"
                        style="font-size: small;"></kendo-grid>

                    <div kendo-window="popUpDataNormaPsikologi" k-title="'Data Norma Psikologi'" k-width="500" k-height="250"
                        k-visible="false" k-on-open="win2visible = true" k-on-close="win2visible = false">
                        <div class="panel panel-default container_12" style="padding: 0px 10px;">
                            <div class="grid_12">
                                <div class="grid_6">
                                    <div class="grid_12">
                                        <label c-label item="item" >Jenis Norma</label>
                                    </div>
                                    <div class="clear"></div>

                                    <div class="grid_12">
                                        <input style="width: 100%;" kendo-combo-box k-ng-model="item.jenisnorma"
                                            k-data-text-field="'jenisnorma'" k-data-value-field="'id'"
                                            k-filter="'contains'" k-auto-bind="false" k-data-source="listJenisNorma" />
                                    </div>
                                </div>
                                <div class="grid_6">
                                    <div class="grid_12">
                                        <label c-label item="item">Umur Min</label>
                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="number" class="k-textbox" ng-model="item.umurmin" placeholder="tahun"/>
                                    </div>
                                </div>
                                <div class="grid_6">
                                    <div class="grid_12">
                                        <label c-label item="item">Umur Max</label>
                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="number" class="k-textbox" ng-model="item.umurmax" placeholder="tahun" />
                                    </div>
                                </div>
                                
                                <div class="grid_6">
                                    <div class="grid_12">
                                        <label c-label item="item">Nilai</label>
                                    </div>
                                    <div class="grid_12">
                                        <input c-text-box type="number" class="k-textbox" ng-model="item.nilai" />
                                    </div>
                                </div>
                                <div class="grid_6">
                                    <div class="grid_12"></div>
                                    <div class="grid_12">
                                        <div class="k-edit-buttons  k-state-default pull-right" style="margin-top:10px">
                                            <button class="k-button k-button-icontext k-primary k-grid-update"
                                                ng-click="simpanNormaPsikologi()"><span
                                                    class="k-icon k-update"></span>Simpan</button>
                                            <button class="k-button  k-button-icontext"
                                                ng-click="batalNormaPsikologi()"><span
                                                    class="k-icon k-cancel"></span>Batal</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
